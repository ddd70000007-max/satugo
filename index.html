solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.navbtn{border:0;background:none;padding:7px 2px;color:#6b7280;font-size:11px}.navbtn b{display:block;font-size:20px;margin-bottom:2px}.navbtn.active{color:#111827;font-weight:800}.badge{display:inline-flex;min-width:18px;height:18px;align-items:center;justify-content:center;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;padding:0 4px;vertical-align:top}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.modaltop{display:flex;justify-content:space-between;align-items:center;gap:10px}.modaltop h2{margin:0}.close{border:0;background:#f3f4f6;border-radius:50%;width:38px;height:38px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#6b7280;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d7dbe2;border-radius:12px;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:10px}.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;background:#fff}.productdetail{display:grid;grid-template-columns:1fr 1fr;gap:20px}.bigpic{height:330px;background:#eef0f3;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.bigpic img{width:100%;height:100%;object-fit:cover}.bigpic span{font-size:80px}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:200;display:none}.toast.show{display:block}.hidden{display:none!important}.sellergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sellerprod{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}.sellerprod .pic{height:90px;border-radius:12px}.orderitems{font-size:13px;color:#4b5563;margin-top:6px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:14px;text-align:center}.stat strong{display:block;font-size:22px}.review{padding:10px 0;border-bottom:1px solid #eee}.stars{color:#f59e0b}.chatbox{height:330px;border:1px solid #ddd;border-radius:14px;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:12px;background:#f8fafc}.msg{max-width:80%;padding:9px 12px;border-radius:14px;margin:5px 0}.mine{margin-left:auto;background:#111827;color:#fff}.theirs{background:#fff;border:1px solid #ddd}.chatinput{display:flex;gap:8px;padding:8px;border-top:1px solid #ddd}.chatinput input{flex:1;border:1px solid #ddd;border-radius:12px;padding:11px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.topin{height:auto;flex-wrap:wrap;padding:8px 0}.logo{font-size:21px}.search{order:3;flex-basis:100%}.hero{padding:22px}.hero h1{font-size:26px}.pic{height:155px}.productdetail{grid-template-columns:1fr}.bigpic{height:260px}.row{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr 1fr}.sheet{max-height:94vh}}

<body>
<header class="top"><div class="wrap topin"><div class="logo">Satu<b>Go</b></div><div class="search"><input id="searchInput" placeholder="Тауар немесе дүкен іздеу" autocomplete="off"><button class="iconbtn" id="searchBtn">Іздеу</button></div><button class="iconbtn" id="cartBtn">🛒 <span id="cartCount">0</span></button></div></header>
<main class="wrap" id="app"></main>
<nav class="bottom"><button class="navbtn active" data-page="home"><b>⌂</b>Басты бет</button><button class="navbtn" data-page="search"><b>⌕</b>Іздеу</button><button class="navbtn" data-page="favorites"><b>♡</b>Таңдаулы <span id="favBadge" class="badge hidden">0</span></button><button class="navbtn" data-page="chats"><b>💬</b>Чаттар <span id="chatBadge" class="badge hidden">0</span></button><button class="navbtn" data-page="account"><b>♙</b>Аккаунт</button></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';

const firebaseConfig={apiKey:'AIzaSyCj7VBpb0u5YgFqz2Mm8NhvbytX_Fs5tJE',authDomain:'satugo-c3b7c.firebaseapp.com',projectId:'satugo-c3b7c',storageBucket:'satugo-c3b7c.firebasestorage.app',messagingSenderId:'32133349747',appId:'1:32133349747:web:8df062f6428b4eb7ed8506',measurementId:'G-4PF4DV016B'};
let fbReady=false,fbAuth=null,fbDb=null,phoneConfirmation=null,recaptchaVerifier=null;
try{firebase.initializeApp(firebaseConfig);fbAuth=firebase.auth();fbDb=firebase.firestore();fbReady=true;fbAuth.onAuthStateChanged(async u=>{if(!u)return;const ref=fbDb.collection('users').doc(u.uid);const snap=await ref.get();const d=snap.exists?snap.data():{};state.currentUser={id:u.uid,name:d.name||u.displayName||'Пайдаланушы',phone:u.phoneNumber||d.phone||'',firebase:true};if(!snap.exists)await ref.set({name:state.currentUser.name,phone:state.currentUser.phone,role:'buyer',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});save();render()})}catch(e){console.warn('Firebase:',e);fbReady=false}
async function syncFirebaseData(){
 if(!fbReady)return;
 try{const ps=await fbDb.collection('products').get();if(!ps.empty){state.products=ps.docs.map(d=>({id:d.id,...d.data(),name:d.data().name||d.data().title||'Тауар',price:Number(d.data().price||0),sellerName:d.data().sellerName||d.data().seller||'Сатушы'}));save();render()}
 }catch(e){console.warn('products load',e)}
}
const KEY='satugo_from_zero_v1';
const defaults=[
{id:'p1',name:'Nike Air Max',price:39990,cat:'Аяқ киім',image:'',sellerId:'platform',sellerName:'SatuGo'},
{id:'p2',name:'Oversize Hoodie',price:12990,cat:'Киім',image:'',sellerId:'platform',sellerName:'SatuGo'},
{id:'p3',name:'Әйелдер көйлегі',price:19990,cat:'Киім',image:'',sellerId:'platform',sellerName:'SatuGo'},
{id:'p4',name:'Ақ кроссовка',price:29990,cat:'Аяқ киім',image:'',sellerId:'platform',sellerName:'SatuGo'}
];
function fresh(){return {products:defaults.map(x=>({...x})),cart:[],favorites:[],orders:[],users:[],currentUser:null,chats:[],messages:[],reviews:[],store:null};}
let state=load(); let page='home'; let selectedProduct=null; let activeChat=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.products)return {...fresh(),...x};}catch(e){}return fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateBadges()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return Number(n||0).toLocaleString('kk-KZ')+' ₸'}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>x.classList.remove('show'),1800)}
function img(url,emoji='🛍️',cls='pic'){return url?`<div class="${cls}"><img src="${esc(url)}" alt=""></div>`:`<div class="${cls}"><span>${emoji}</span></div>`}
function getProduct(id){return state.products.find(p=>String(p.id)===String(id))}
function renderCard(p){const fav=state.favorites.includes(p.id);return `<article class="card"><button data-open="${esc(p.id)}" style="border:0;background:none;padding:0;width:100%;text-align:left">${img(p.image,p.cat==='Косметика'?'💄':p.cat==='Электрон'?'📱':p.cat==='Киім'?'👕':'👟')}<div class="cardbody"><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="muted">${esc(p.sellerName||'Сатушы')}</div></div></button><div class="actions" style="padding:0 13px 13px"><button class="secondary" data-cart="${esc(p.id)}">Себетке қосу</button><button class="iconbtn fav" data-fav="${esc(p.id)}">${fav?'♥':'♡'}</button></div></article>`}
function renderHome(){const cats=['Барлығы','Киім','Аяқ киім','Косметика','Электрон'];return `<section class="hero"><h1>Дүкеніңді аш та, сата баста!</h1><p>SatuGo — тауарды табу, сақтау, себетке салу және тапсырыс беру үшін қарапайым маркетплейс.</p></section><div class="cats">${cats.map(c=>`<button class="cat" data-cat="${c}">${c}</button>`).join('')}</div><div class="sectionhead"><h2>Танымал тауарлар</h2><span class="muted">${state.products.length} тауар</span></div><div class="grid">${state.products.map(renderCard).join('')}</div>`}
function renderSearch(){const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();const arr=state.products.filter(p=>!q||[p.name,p.cat,p.sellerName].join(' ').toLowerCase().includes(q));return `<div class="sectionhead"><h2>Іздеу</h2><span class="muted">${arr.length} нәтиже</span></div><div class="field"><input id="searchPageInput" value="${esc(q)}" placeholder="Тауар немесе дүкен іздеу"></div>${arr.length?`<div class="grid">${arr.map(renderCard).join('')}</div>`:'<div class="empty">Тауар табылмады</div>'}`}
function renderFav(){const arr=state.products.filter(p=>state.favorites.includes(p.id));return `<div class="sectionhead"><h2>Таңдаулы</h2></div>${arr.length?`<div class="grid">${arr.map(renderCard).join('')}</div>`:'<div class="empty">Таңдаулы тауар жоқ.<br>Ұнаған тауардағы ♡ батырмасын басыңыз.</div>'}`}
function renderChats(){const mine=state.currentUser?.id;const arr=state.chats.filter(c=>mine&&c.participants.includes(mine));return `<div class="sectionhead"><h2>Чаттар</h2></div>${arr.length?`<div class="list">${arr.map(c=>{const other=c.buyerId===mine?(c.sellerName||'Сатушы'):(c.buyerName||'Сатып алушы');const unread=c.unread?.[mine]||0;return `<button class="item" data-chat="${esc(c.id)}" style="text-align:left;border:1px solid #e5e7eb"><b>${esc(other)}</b><div class="muted">${esc(c.lastMessage||'Чат ашылды')}${unread?` <span class="badge">${unread}</span>`:''}</div></button>`}).join('')}</div>`:'<div class="empty">Әзірге чат жоқ.<br>Тауарды ашып, «Сатушымен чат» батырмасын басыңыз.</div>'}`}
function renderAccount(){if(!state.currentUser)return `<div class="sectionhead"><h2>Аккаунт</h2></div><div class="item"><h3>Кіру / тіркелу</h3><p class="muted">Firebase арқылы телефон нөмірімен кіріп, аккаунтыңызды телефонда да, ноутбукта да қолдана аласыз.</p><button class="primary" id="loginBtn">Кіру / тіркелу</button></div>`;const orders=state.orders.filter(o=>o.buyerId===state.currentUser.id);return `<div class="sectionhead"><h2>Аккаунт</h2><button class="secondary" id="logoutBtn">Шығу</button></div><div class="item"><b>${esc(state.currentUser.name)}</b><div class="muted">${esc(state.currentUser.phone||'')}</div><div class="actions"><button class="secondary" id="editProfile">Жеке мәліметтер</button><button class="secondary" id="sellerBtn">🏪 Менің дүкенім</button></div></div><div class="sectionhead"><h2>Менің тапсырыстарым</h2></div>${orders.length?`<div class="list">${orders.map(o=>`<div class="item"><b>Тапсырыс #${esc(o.id.slice(-6))}</b><div>${money(o.total)} · ${esc(o.status)}</div><div class="muted">${esc(o.address)}</div></div>`).join('')}</div>`:'<div class="empty">Тапсырыс әлі жоқ.</div>'}`}
function render(){const app=document.getElementById('app');if(page==='home')app.innerHTML=renderHome();if(page==='search')app.innerHTML=renderSearch();if(page==='favorites')app.innerHTML=renderFav();if(page==='chats')app.innerHTML=renderChats();if(page==='account')app.innerHTML=renderAccount();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));updateBadges()}
function updateBadges(){document.getElementById('cartCount').textContent=state.cart.reduce((s,x)=>s+x.qty,0);const f=document.getElementById('favBadge');f.textContent=state.favorites.length;f.classList.toggle('hidden',!state.favorites.length);const uid=state.currentUser?.id;const n=uid?state.chats.reduce((s,c)=>s+(c.unread?.[uid]||0),0):0;const b=document.getElementById('chatBadge');b.textContent=n;b.classList.toggle('hidden',!n)}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('sheet').innerHTML='';selectedProduct=null;activeChat=null}
function openProduct(id){const p=getProduct(id);if(!p){toast('Тауар дерегі табылмады');return}selectedProduct=p;const reviews=state.reviews.filter(r=>r.productId===p.id);openModal(`<div class="modaltop"><h2>${esc(p.name)}</h2><button class="close" id="close">×</button></div><div class="productdetail"><div>${img(p.image,'🛍️','bigpic')}</div><div><div class="price">${money(p.price)}</div><div class="muted">${esc(p.cat)} · ${esc(p.sellerName||'Сатушы')}</div><p>${esc(p.description||'Бұл тауар туралы толық ақпаратты сатушыдан сұрауға болады.')}</p><div class="actions"><button class="primary" id="detailCart">Себетке қосу</button><button class="secondary" id="detailChat">Сатушымен чат</button></div><div class="sectionhead"><h3>Пікірлер</h3></div>${reviews.length?reviews.map(r=>`<div class="review"><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span><br><b>${esc(r.userName)}</b><div>${esc(r.text)}</div></div>`).join(''):'<div class="muted">Пікір әзірге жоқ.</div>'}</div></div>`);document.getElementById('close').onclick=closeModal;document.getElementById('detailCart').onclick=()=>{addCart(p.id);closeModal()};document.getElementById('detailChat').onclick=()=>{if(p.sellerId==='platform'){toast('Бұл SatuGo платформасының тауары');return}startChat(p)} }
function addCart(id){const p=getProduct(id);if(!p)return;const x=state.cart.find(i=>i.productId===id);if(x)x.qty++;else state.cart.push({productId:id,qty:1});save();toast('Себетке қосылды')}
function toggleFav(id){const i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();render()}
function openCart(){const rows=state.cart.map(i=>({...i,p:getProduct(i.productId)})).filter(x=>x.p);const total=rows.reduce((s,x)=>s+x.p.price*x.qty,0);openModal(`<div class="modaltop"><h2>🛒 Себет</h2><button class="close" id="close">×</button></div>${rows.length?`<div class="list">${rows.map(x=>`<div class="item"><b>${esc(x.p.name)}</b><div>${money(x.p.price)} × ${x.qty}</div><div class="actions"><button class="secondary" data-minus="${x.p.id}">−</button><button class="secondary" data-plus="${x.p.id}">+</button><button class="danger" data-remove="${x.p.id}">Жою</button></div></div>`).join('')}</div><div class="sectionhead"><b>Барлығы</b><b>${money(total)}</b></div><button class="primary" id="checkoutBtn">Тапсырыс беру</button>`:'<div class="empty">Себет бос.</div>'}`);document.getElementById('close').onclick=closeModal;document.getElementById('checkoutBtn')?.addEventListener('click',checkout);document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(x=>x.productId!==b.dataset.remove);save();openCart()})}
function changeQty(id,d){const x=state.cart.find(i=>i.productId===id);if(!x)return;x.qty+=d;if(x.qty<1)state.cart=state.cart.filter(i=>i!==x);save();openCart()}
async function checkout(){
 if(!state.currentUser){closeModal();openLogin();return}
 const rows=state.cart.map(i=>({...i,p:getProduct(i.productId)})).filter(x=>x.p);
 if(!rows.length){toast('Себет бос');return}
 const total=rows.reduce((s,x)=>s+x.p.price*x.qty,0);
 openModal(`<div class="modaltop"><h2>Тапсырыс беру</h2><button class="close" id="close">×</button></div><div class="field"><label>Аты-жөніңіз</label><input id="ordName" value="${esc(state.currentUser.name)}"></div><div class="field"><label>Телефон</label><input id="ordPhone" value="${esc(state.currentUser.phone||'')}"></div><div class="field"><label>Мекенжай</label><textarea id="ordAddress" rows="3" placeholder="Қала, көше, үй, пәтер"></textarea></div><div class="sectionhead"><b>Төлем сомасы</b><b>${money(total)}</b></div><button class="primary" id="placeOrder">Тапсырысты растау</button>`);
 document.getElementById('close').onclick=closeModal;
 document.getElementById('placeOrder').onclick=async()=>{
   const name=document.getElementById('ordName').value.trim(),phone=document.getElementById('ordPhone').value.trim(),address=document.getElementById('ordAddress').value.trim();
   if(!name||!phone||!address){toast('Барлық өрісті толтырыңыз');return}
   const items=state.cart.map(i=>({...i,p:getProduct(i.productId)})).filter(x=>x.p);
   if(!items.length)return;
   const sellerIds=[...new Set(items.map(x=>x.p.sellerId).filter(x=>x&&x!=='platform'))];
   const order={buyerId:state.currentUser.id,buyerName:name,phone,address,items:items.map(x=>({productId:String(x.p.id),name:x.p.name,price:Number(x.p.price),qty:Number(x.qty),sellerId:x.p.sellerId||'platform',sellerName:x.p.sellerName||'SatuGo'})),sellerIds,total,status:'Жаңа тапсырыс',paymentMethod:'Қолма-қол/келісім',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
   try{
     if(fbReady&&state.currentUser.firebase){
       await fbDb.collection('orders').add(order);
       await fbDb.collection('users').doc(state.currentUser.id).set({name,phone,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
     }
     state.orders.unshift({...order,id:'local_'+Date.now(),createdAt:Date.now()});state.currentUser.name=name;state.currentUser.phone=phone;state.cart=[];save();closeModal();toast('Тапсырыс қабылданды');render();
   }catch(e){console.error(e);toast('Тапсырысты сақтау сәтсіз болды')}
 };
}

function normalizePhone(v){let x=String(v||'').replace(/[^0-9+]/g,'');if(x.startsWith('8'))x='+7'+x.slice(1);if(!x.startsWith('+7')&&x.startsWith('7'))x='+'+x;return x}
async function passHash(v){const data=new TextEncoder().encode(String(v));const buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function validPhone(v){return /^\+7\d{10}$/.test(normalizePhone(v))}
function openLogin(){
  if(!fbReady){toast('Firebase қосылмаған');return}
  let mode='login',step=1;
  const draw=()=>{
    openModal(`<div class="modaltop"><h2>${mode==='login'?'Кіру':'Тіркелу'}</h2><button class="close" id="close">×</button></div>
      <div class="actions"><button class="${mode==='login'?'primary':'secondary'}" id="modeLogin">Кіру</button><button class="${mode==='register'?'primary':'secondary'}" id="modeRegister">Тіркелу</button></div>
      ${step===1?`<div class="field"><label>Қазақстан телефоны</label><input id="authPhone" inputmode="tel" autocomplete="tel" placeholder="+7 700 000 00 00"></div><div id="recaptcha-container"></div><button class="primary" id="sendCode">SMS код жіберу</button>`:
      `<div class="field"><label>SMS код</label><input id="authCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6 таңбалы код"></div>${mode==='register'?`<div class="field"><label>Аты-жөніңіз</label><input id="authName" autocomplete="name" placeholder="Аты-жөніңіз"></div>`:''}<button class="primary" id="verifyCode">Растау және ${mode==='login'?'кіру':'тіркелу'}</button>`}
      <p class="muted">SMS арқылы Firebase аккаунтымен кіру. +7 нөмірі қажет.</p>`);
    document.getElementById('close').onclick=closeModal;
    document.getElementById('modeLogin').onclick=()=>{mode='login';step=1;draw()};
    document.getElementById('modeRegister').onclick=()=>{mode='register';step=1;draw()};
    if(step===1){
      const inp=document.getElementById('authPhone');
      inp.addEventListener('input',e=>{let v=e.target.value.replace(/[^0-9+]/g,'');if(v.startsWith('8'))v='+7'+v.slice(1);if(v.startsWith('7')&&!v.startsWith('+7'))v='+'+v;e.target.value=v});
      document.getElementById('sendCode').onclick=async()=>{
        const phone=normalizePhone(inp.value.trim());
        if(!validPhone(phone)){toast('Телефонды +7XXXXXXXXXX форматында енгізіңіз');return}
        try{
          if(recaptchaVerifier){try{recaptchaVerifier.clear()}catch(_) {}}
          recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'normal'});
          await recaptchaVerifier.render();
          phoneConfirmation=await fbAuth.signInWithPhoneNumber(phone,recaptchaVerifier);
          step=2;draw();toast('SMS код жіберілді');
        }catch(e){console.error(e);toast('SMS жіберілмеді: Firebase Phone Auth баптауын тексеріңіз')}
      };
    }else{
      document.getElementById('verifyCode').onclick=async()=>{
        const code=document.getElementById('authCode').value.trim();
        if(!/^\d{6}$/.test(code)){toast('6 таңбалы код енгізіңіз');return}
        try{
          const result=await phoneConfirmation.confirm(code),u=result.user;
          const name=mode==='register'?document.getElementById('authName').value.trim():(u.displayName||'Пайдаланушы');
          if(mode==='register'&&!name){toast('Аты-жөніңізді енгізіңіз');return}
          if(name&&u.displayName!==name)await u.updateProfile({displayName:name});
          await fbDb.collection('users').doc(u.uid).set({name:name||'Пайдаланушы',phone:u.phoneNumber||'',role:'buyer',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
          state.currentUser={id:u.uid,name:name||'Пайдаланушы',phone:u.phoneNumber||'',firebase:true};save();closeModal();render();toast(mode==='login'?'Сәтті кірдіңіз':'Аккаунт ашылды');
        }catch(e){console.error(e);toast('SMS коды қате немесе мерзімі өтті')}
      };
    }
  };
  draw();
}
function editProfile(){openModal(`<div class="modaltop"><h2>Жеке мәліметтер</h2><button class="close" id="close">×</button></div><div class="field"><label>Аты-жөніңіз</label><input id="pn" value="${esc(state.currentUser.name)}"></div><div class="field"><label>Телефон</label><input id="pp" value="${esc(state.currentUser.phone||'')}" disabled></div><button class="primary" id="saveProfile">Сақтау</button>`);document.getElementById('close').onclick=closeModal;document.getElementById('saveProfile').onclick=async()=>{const name=document.getElementById('pn').value.trim();if(!name){toast('Аты-жөніңізді енгізіңіз');return}state.currentUser.name=name;if(fbReady&&state.currentUser.firebase){try{await fbAuth.currentUser.updateProfile({displayName:name});await fbDb.collection('users').doc(state.currentUser.id).set({name,phone:state.currentUser.phone||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){toast('Профильді сақтау сәтсіз болды');return}}save();closeModal();render();toast('Сақталды')}}

async function openSeller(){
 if(!state.currentUser){openLogin();return}
 if(!fbReady||!state.currentUser.firebase){toast('Дүкен кабинеті үшін Firebase қажет');return}
 const uid=state.currentUser.id;
 try{
   const storeSnap=await fbDb.collection('stores').doc(uid).get();
   const store=storeSnap.exists?storeSnap.data():{};
   const prodSnap=await fbDb.collection('products').where('sellerId','==',uid).get();
   const mine=prodSnap.docs.map(d=>({id:d.id,...d.data()}));
   const orderSnap=await fbDb.collection('orders').where('sellerIds','array-contains',uid).get();
   const orders=orderSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
   state.products=[...state.products.filter(p=>p.sellerId!==uid),...mine];
   const totalStock=mine.reduce((s,p)=>s+Number(p.stock??p.quantity??0),0);
   const soldUnits=orders.reduce((s,o)=>s+o.items.filter(i=>i.sellerId===uid).reduce((a,i)=>a+Number(i.qty||0),0),0);
   const revenue=orders.filter(o=>o.status==='Жеткізілді').reduce((s,o)=>s+o.items.filter(i=>i.sellerId===uid).reduce((a,i)=>a+Number(i.price||0)*Number(i.qty||0),0),0);
   openModal(`<div class="modaltop"><h2>🏪 Менің дүкенім</h2><button class="close" id="close">×</button></div>
   <div class="statgrid"><div class="stat"><strong>${mine.length}</strong><span>Тауар</span></div><div class="stat"><strong>${totalStock}</strong><span>Қалдық</span></div><div class="stat"><strong>${orders.length}</strong><span>Тапсырыс</span></div><div class="stat"><strong>${soldUnits}</strong><span>Сатылған</span></div><div class="stat"><strong>${orders.filter(o=>o.status==='Жаңа тапсырыс').length}</strong><span>Жаңа</span></div><div class="stat"><strong>${money(revenue)}</strong><span>Түсім</span></div></div>
   <h3>Дүкен профилі</h3><div class="field"><label>Дүкен атауы</label><input id="storeName" value="${esc(store.name||'')}" placeholder="AIDANA FASHION"></div><div class="field"><label>Қала</label><input id="storeCity" value="${esc(store.city||'')}" placeholder="Тараз"></div><div class="field"><label>Сурет URL</label><input id="storeImage" value="${esc(store.image||'')}" placeholder="https://..."></div><div class="field"><label>Сипаттама</label><textarea id="storeDescription" rows="3">${esc(store.description||'')}</textarea></div><button class="secondary" id="saveStore">Дүкенді сақтау</button>
   <hr><h3>Тауар қосу</h3><div class="field"><input id="pnm" placeholder="Тауар атауы"></div><div class="row"><div class="field"><input id="pprice" type="number" min="1" placeholder="Бағасы"></div><div class="field"><input id="pstock" type="number" min="0" value="0" placeholder="Қойма саны"></div></div><div class="field"><input id="pcat" placeholder="Категория"></div><div class="field"><input id="pimg" placeholder="Сурет URL (міндетті емес)"></div><div class="field"><textarea id="pdesc" rows="3" placeholder="Тауар сипаттамасы"></textarea></div><button class="primary" id="addProduct">➕ Тауарды қосу</button>
   <h3>Менің тауарларым</h3>${mine.length?`<div class="list">${mine.map(p=>`<div class="item sellerprod">${img(p.image,'🛍️','pic')}<div><b>${esc(p.name||p.title)}</b><div>${money(p.price)}</div><div class="muted">Қойма: ${Number(p.stock??p.quantity??0)} · ${esc(p.cat||p.category||'Басқа')}</div><div class="actions"><button class="secondary" data-edit-product="${esc(p.id)}">Өзгерту</button><button class="danger" data-delete-product="${esc(p.id)}">Жою</button></div></div></div>`).join('')}</div>`:'<div class="muted">Тауар жоқ.</div>'}
   <h3>Менің тапсырыстарым</h3>${orders.length?`<div class="list">${orders.map(o=>`<div class="item"><b>#${esc(o.id.slice(-6))}</b><div>${money(o.total)} · ${esc(o.status||'Жаңа тапсырыс')}</div><div class="orderitems">${o.items.filter(i=>i.sellerId===uid).map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</div>${o.status==='Жаңа тапсырыс'?`<div class="actions"><button class="primary" data-status="${o.id}" data-next="Қабылданды">Қабылдау</button><button class="danger" data-status="${o.id}" data-next="Бас тартылды">Бас тарту</button></div>`:''}${o.status==='Қабылданды'?`<button class="secondary" data-status="${o.id}" data-next="Жеткізілді">Жеткізілді</button>`:''}</div>`).join('')}</div>`:'<div class="muted">Тапсырыс жоқ.</div>'}`);
   document.getElementById('close').onclick=closeModal;
   document.getElementById('saveStore').onclick=async()=>{const name=document.getElementById('storeName').value.trim();if(!name){toast('Дүкен атауын енгізіңіз');return}try{await fbDb.collection('stores').doc(uid).set({ownerId:uid,name,city:document.getElementById('storeCity').value.trim(),image:document.getElementById('storeImage').value.trim(),description:document.getElementById('storeDescription').value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});toast('Дүкен сақталды');openSeller()}catch(e){console.error(e);toast('Дүкенді сақтау сәтсіз болды')}};
   document.getElementById('addProduct').onclick=saveSellerProduct;
   document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editSellerProduct(b.dataset.editProduct));
   document.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>deleteSellerProduct(b.dataset.deleteProduct));
   document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>changeSellerOrder(b.dataset.status,b.dataset.next));
 }catch(e){console.error(e);toast('Сатушы кабинетін жүктеу сәтсіз болды')}
}
async function saveSellerProduct(){const uid=state.currentUser.id;const name=document.getElementById('pnm').value.trim(),price=Number(document.getElementById('pprice').value),stock=Math.max(0,Number(document.getElementById('pstock').value||0)),cat=document.getElementById('pcat').value.trim()||'Басқа',image=document.getElementById('pimg').value.trim(),description=document.getElementById('pdesc').value.trim();if(!name||!price){toast('Тауар атауы мен бағасын енгізіңіз');return}try{const st=await fbDb.collection('stores').doc(uid).get();if(!st.exists){toast('Алдымен дүкенді сақтаңыз');return}const sellerName=st.data().name||state.currentUser.name;await fbDb.collection('products').add({name,title:name,price,stock,quantity:stock,cat,category:cat,image,description,sellerId:uid,seller:sellerName,sellerName,rating:0,sales:0,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Тауар қосылды');openSeller();}catch(e){console.error(e);toast('Тауарды сақтау сәтсіз болды')}}
async function editSellerProduct(id){try{const ref=fbDb.collection('products').doc(id),snap=await ref.get();if(!snap.exists){toast('Тауар табылмады');return}const p=snap.data();const name=prompt('Тауар атауы:',p.name||p.title||'');if(name===null)return;const price=Number(prompt('Бағасы:',p.price||0));if(!price)return;const stock=Math.max(0,Number(prompt('Қойма саны:',p.stock??p.quantity??0)));const desc=prompt('Сипаттамасы:',p.description||'')??(p.description||'');await ref.update({name,title:name,price,stock,quantity:stock,description:desc,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Тауар өзгертілді');openSeller()}catch(e){console.error(e);toast('Тауарды өзгерту сәтсіз болды')}}
async function deleteSellerProduct(id){if(!confirm('Бұл тауарды өшіру керек пе?'))return;try{await fbDb.collection('products').doc(id).delete();state.cart=state.cart.filter(x=>String(x.productId)!==String(id));save();toast('Тауар өшірілді');openSeller()}catch(e){console.error(e);toast('Тауарды өшіру сәтсіз болды')}}
async function changeSellerOrder(id,next){try{const ref=fbDb.collection('orders').doc(id);const snap=await ref.get();if(!snap.exists){toast('Тапсырыс табылмады');return}const o=snap.data(),uid=state.currentUser.id;if(!(o.sellerIds||[]).includes(uid)){toast('Бұл тапсырыс сізге тиесілі емес');return}if(next==='Қабылданды'){await fbDb.runTransaction(async tx=>{const freshSnap=await tx.get(ref),ord=freshSnap.data();for(const item of (ord.items||[]).filter(i=>i.sellerId===uid)){const pr=fbDb.collection('products').doc(String(item.productId));const ps=await tx.get(pr);if(!ps.exists)throw new Error('PRODUCT_MISSING');const d=ps.data(),stock=Number(d.stock??d.quantity??0),qty=Number(item.qty||0);if(stock<qty)throw new Error('STOCK_LOW');tx.update(pr,{stock:stock-qty,quantity:stock-qty,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}tx.update(ref,{status:'Қабылданды',updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});}else{await ref.update({status:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}toast('Тапсырыс статусы өзгертілді');openSeller()}catch(e){console.error(e);toast(e.message==='STOCK_LOW'?'Қоймада тауар жетіспейді':e.message==='PRODUCT_MISSING'?'Тауар табылмады':'Статусты өзгерту сәтсіз болды')}}

function startChat(p){if(!state.currentUser){closeModal();openLogin();return}if(p.sellerId==='platform'){toast('Бұл тауардың жеке сатушысы жоқ');return}let c=state.chats.find(x=>x.buyerId===state.currentUser.id&&x.sellerId===p.sellerId);if(!c){c={id:'c_'+state.currentUser.id+'_'+p.sellerId,buyerId:state.currentUser.id,buyerName:state.currentUser.name,sellerId:p.sellerId,sellerName:p.sellerName||'Сатушы',participants:[state.currentUser.id,p.sellerId],lastMessage:'',unread:{[state.currentUser.id]:0,[p.sellerId]:0}};state.chats.unshift(c)}c.unread[state.currentUser.id]=0;save();closeModal();openChat(c.id)}
function openChat(id){const c=state.chats.find(x=>x.id===id);if(!c)return;activeChat=id;const uid=state.currentUser?.id;if(!uid||!c.participants.includes(uid)){toast('Чатқа рұқсат жоқ');return}c.unread[uid]=0;save();const msgs=state.messages.filter(m=>m.chatId===id);openModal(`<div class="modaltop"><h2>💬 ${esc(c.buyerId===uid?c.sellerName:c.buyerName)}</h2><button class="close" id="close">×</button></div><div class="chatbox"><div class="msgs" id="msgs">${msgs.length?msgs.map(m=>`<div class="msg ${m.senderId===uid?'mine':'theirs'}">${esc(m.text)}</div>`).join(''):'<div class="muted">Хабарлама жоқ.</div>'}</div><div class="chatinput"><input id="chatText" placeholder="Хабарлама..."><button class="primary" id="sendChat">Жіберу</button></div></div>`);document.getElementById('close').onclick=closeModal;document.getElementById('sendChat').onclick=sendChat;document.getElementById('chatText').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});setTimeout(()=>{const m=document.getElementById('msgs');m.scrollTop=m.scrollHeight},0)}
function sendChat(){const input=document.getElementById('chatText');const text=input?.value.trim();if(!text||!activeChat)return;const c=state.chats.find(x=>x.id===activeChat),uid=state.currentUser.id,other=c.participants.find(x=>x!==uid);state.messages.push({id:'m_'+Date.now(),chatId:c.id,senderId:uid,text,createdAt:Date.now()});c.lastMessage=text;c.lastAt=Date.now();c.unread[other]=(c.unread[other]||0)+1;save();input.value='';openChat(c.id)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b){openProduct(b.dataset.open);return}const c=e.target.closest('[data-cart]');if(c){addCart(c.dataset.cart);return}const f=e.target.closest('[data-fav]');if(f){toggleFav(f.dataset.fav);return}const cat=e.target.closest('[data-cat]');if(cat){if(cat.dataset.cat==='Барлығы'){page='home';render();return}const arr=state.products.filter(p=>p.cat===cat.dataset.cat);openModal(`<div class="modaltop"><h2>${esc(cat.dataset.cat)}</h2><button class="close" id="close">×</button></div>${arr.length?`<div class="grid">${arr.map(renderCard).join('')}</div>`:'<div class="empty">Бұл категорияда тауар жоқ.</div>'}`);document.getElementById('close').onclick=closeModal;return}const ch=e.target.closest('[data-chat]');if(ch){openChat(ch.dataset.chat);return}});
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));document.getElementById('cartBtn').onclick=openCart;document.getElementById('searchBtn').onclick=()=>{page='search';render()};document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){page='search';render()}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('app').addEventListener('click',e=>{if(e.target.id==='loginBtn')openLogin();if(e.target.id==='logoutBtn'){if(fbReady)fbAuth.signOut();state.currentUser=null;save();render();toast('Аккаунттан шықтыңыз')}if(e.target.id==='editProfile')editProfile();if(e.target.id==='sellerBtn')openSeller();if(e.target.id==='searchPageInput'){}}
);render(); if(fbReady) setTimeout(syncFirebaseData,300);
</script>
</body>
