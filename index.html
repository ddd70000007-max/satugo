<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SatuGo — Қазақстан маркетплейсі</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#111827
}

body{
  padding-bottom:82px
}

.wrap{
  width:min(1180px,calc(100% - 24px));
  margin:auto
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e5e7eb
}

.topin{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px
}

.logo{
  font-size:24px;
  font-weight:900;
  white-space:nowrap
}

.logo b{
  color:#f5b400
}

.search{
  flex:1;
  display:flex;
  gap:8px
}

.search input{
  width:100%;
  padding:12px 15px;
  border:1px solid #d7dbe2;
  border-radius:13px;
  outline:none
}

.iconbtn,
.primary,
.secondary,
.danger{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  cursor:pointer
}

.iconbtn{
  background:#f3f4f6
}

.primary{
  background:#111827;
  color:#fff
}

.secondary{
  background:#eef0f3
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.hero{
  margin:18px 0;
  background:linear-gradient(135deg,#111827,#374151);
  color:#fff;
  border-radius:22px;
  padding:28px
}

.hero h1{
  margin:0 0 8px;
  font-size:32px
}

.hero p{
  margin:0;
  color:#d1d5db
}

.cats{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0 16px
}

.cat{
  border:1px solid #ddd;
  background:#fff;
  border-radius:999px;
  padding:9px 14px;
  white-space:nowrap;
  cursor:pointer
}

.sectionhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 0
}

.sectionhead h2{
  margin:0
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 8px #00000008;
  position:relative
}

.card.special-card{
  border-color:#e5c82d
}

.pic{
  height:190px;
  background:#eef0f3;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover
}

.pic span{
  font-size:52px
}

.cardbody{
  padding:13px
}

.name{
  font-weight:700;
  min-height:40px
}

.price{
  font-size:19px;
  font-weight:900;
  margin:8px 0
}

.muted{
  color:#6b7280;
  font-size:13px
}

.actions{
  display:flex;
  gap:8px;
  margin-top:10px
}

.actions button{
  flex:1
}

.fav{
  width:44px
}

.empty{
  padding:30px;
  background:#fff;
  border-radius:18px;
  text-align:center;
  color:#6b7280
}


/* =========================================
   ✨ ЕРЕКШЕ ТАУАР
   ========================================= */

.special-section{
  margin:18px 0 24px;
  padding:17px;
  border-radius:22px;
  background:linear-gradient(135deg,#fff8c9,#fff);
  border:1px solid #e8d76d
}

.special-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px
}

.special-head h2{
  margin:0;
  font-size:23px
}

.special-sub{
  margin-top:5px;
  color:#766a00;
  font-size:13px
}

.special-more{
  border:0;
  background:#ffd400;
  color:#111827;
  border-radius:12px;
  padding:10px 14px;
  font-weight:900;
  cursor:pointer
}

.special-tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:13px 0 12px
}

.special-tabs button{
  border:1px solid #dfd06d;
  background:#fff;
  border-radius:999px;
  padding:9px 13px;
  white-space:nowrap;
  cursor:pointer
}

.special-tabs button.active{
  background:#111827;
  color:#fff;
  border-color:#111827
}

.special-label{
  position:absolute;
  left:8px;
  top:8px;
  z-index:5;
  background:#ffd400;
  color:#111827;
  padding:5px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:900
}

.special-empty{
  background:#fff;
  border-radius:15px;
  padding:25px 12px;
  text-align:center;
  color:#6b7280;
  line-height:1.6
}

.special-page-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:14px 0
}

.special-page-title button{
  border:0;
  background:#fff;
  border-radius:11px;
  padding:9px 12px;
  font-size:18px;
  cursor:pointer
}

.special-check{
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px;
  background:#fff9d8;
  border:1px solid #e6d66e;
  border-radius:12px
}

.special-check input{
  width:18px!important;
  height:18px!important
}


/* =========================================
   НАВИГАЦИЯ
   ========================================= */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:80;
  background:#fff;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:7px 5px calc(7px + env(safe-area-inset-bottom))
}

.navbtn{
  border:0;
  background:none;
  padding:7px 2px;
  color:#6b7280;
  font-size:11px;
  cursor:pointer
}

.navbtn b{
  display:block;
  font-size:20px;
  margin-bottom:2px
}

.navbtn.active{
  color:#111827;
  font-weight:800
}

.badge{
  display:inline-flex;
  min-width:18px;
  height:18px;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:#ef4444;
  color:#fff;
  font-size:10px;
  padding:0 4px;
  vertical-align:top
}


/* =========================================
   MODAL
   ========================================= */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center
}

.modal.show{
  display:flex
}

.sheet{
  background:#fff;
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:22px 22px 0 0;
  padding:20px
}

.modaltop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.modaltop h2{
  margin:0
}

.close{
  border:0;
  background:#f3f4f6;
  border-radius:50%;
  width:38px;
  height:38px;
  cursor:pointer
}

.field{
  margin:10px 0
}

.field label{
  display:block;
  font-size:13px;
  color:#6b7280;
  margin-bottom:5px
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #d7dbe2;
  border-radius:12px;
  outline:none
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.list{
  display:grid;
  gap:10px
}

.item{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:12px;
  background:#fff
}

.productdetail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}

.bigpic{
  height:330px;
  background:#eef0f3;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.bigpic img{
  width:100%;
  height:100%;
  object-fit:cover
}

.bigpic span{
  font-size:80px
}

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  z-index:200;
  display:none
}

.toast.show{
  display:block
}

.hidden{
  display:none!important
}

.sellergrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.sellerprod{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:10px;
  align-items:center
}

.sellerprod .pic{
  height:90px;
  border-radius:12px
}

.orderitems{
  font-size:13px;
  color:#4b5563;
  margin-top:6px
}

.statgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.stat{
  background:#f8fafc;
  border-radius:14px;
  padding:14px;
  text-align:center
}

.stat strong{
  display:block;
  font-size:22px
}

.review{
  padding:10px 0;
  border-bottom:1px solid #eee
}

.stars{
  color:#f59e0b
}


/* =========================================
   CHAT
   ========================================= */

.chatbox{
  height:330px;
  border:1px solid #ddd;
  border-radius:14px;
  display:flex;
  flex-direction:column
}

.msgs{
  flex:1;
  overflow:auto;
  padding:12px;
  background:#f8fafc
}

.msg{
  max-width:80%;
  padding:9px 12px;
  border-radius:14px;
  margin:5px 0
}

.mine{
  margin-left:auto;
  background:#111827;
  color:#fff
}

.theirs{
  background:#fff;
  border:1px solid #ddd
}

.chatinput{
  display:flex;
  gap:8px;
  padding:8px;
  border-top:1px solid #ddd
}

.chatinput input{
  flex:1;
  border:1px solid #ddd;
  border-radius:12px;
  padding:11px
}


/* =========================================
   MOBILE
   ========================================= */

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .topin{
    height:auto;
    flex-wrap:wrap;
    padding:8px 0
  }

  .logo{
    font-size:21px
  }

  .search{
    order:3;
    flex-basis:100%
  }

  .hero{
    padding:22px
  }

  .hero h1{
    font-size:26px
  }

  .pic{
    height:155px
  }

  .productdetail{
    grid-template-columns:1fr
  }

  .bigpic{
    height:260px
  }

  .row{
    grid-template-columns:1fr
  }

  .statgrid{
    grid-template-columns:1fr 1fr 1fr
  }

  .sheet{
    max-height:94vh
  }

}

@media(max-width:430px){

  .wrap{
    width:min(100% - 16px,1180px)
  }

  .grid{
    gap:9px
  }

  .cardbody{
    padding:10px
  }

  .name{
    font-size:14px
  }

  .price{
    font-size:17px
  }

  .actions{
    flex-wrap:wrap
  }

  .actions .fav{
    width:44px
  }

  .hero{
    margin-top:10px
  }

  .hero h1{
    font-size:23px
  }

  .navbtn{
    font-size:10px
  }

  .special-section{
    padding:13px
  }

  .special-head h2{
    font-size:19px
  }

  .special-more{
    padding:8px 10px;
    font-size:12px
  }

}
</style>
</head>

<body>

<header class="top">

  <div class="wrap topin">

    </div>

</header>

<main

></main>

</nav>

<div

<div
  class="modal"

>

  <div

</div>

<script>
'use strict';
 const firebaseConfig={
  apiKey:'AIzaSyCj7VBpb0uY5gFqz2Mm8NhvbytX_Fs5tJE',
  authDomain:'satugo-c3b7c.firebaseapp.com',
  projectId:'satugo-c3b7c',
  storageBucket:'satugo-c3b7c.firebasestorage.app',
  messagingSenderId:'32133349747',
  appId:'1:32133349747:web:8df062f6428b4eb7ed8506',
  measurementId:'G-4PF4DV016B'
};

let fbReady=false;
let fbAuth=null;
let fbDb=null;
let phoneConfirmation=null;
let recaptchaVerifier=null;


/* ==============================
   LOCAL STATE
   ============================== */

const KEY='satugo_from_zero_v1';


const defaults=[
  {
    id:'p1',
    name:'Nike Air Max',
    price:39990,
    cat:'Аяқ киім',
    image:'',
    sellerId:'platform',
    sellerName:'SatuGo',
    special:false,
    specialType:'interesting'
  },

  {
    id:'p2',
    name:'Oversize Hoodie',
    price:12990,
    cat:'Киім',
    image:'',
    sellerId:'platform',
    sellerName:'SatuGo',
    special:false,
    specialType:'interesting'
  },

  {
    id:'p3',
    name:'Әйелдер көйлегі',
    price:19990,
    cat:'Киім',
    image:'',
    sellerId:'platform',
    sellerName:'SatuGo',
    special:false,
    specialType:'interesting'
  },

  {
    id:'p4',
    name:'Ақ кроссовка',
    price:29990,
    cat:'Аяқ киім',
    image:'',
    sellerId:'platform',
    sellerName:'SatuGo',
    special:false,
    specialType:'interesting'
  }
];


function fresh(){

  return {
    products:defaults.map(
      x=>({...x})
    ),

    cart:[],
    favorites:[],
    orders:[],
    users:[],
    currentUser:null,
    chats:[],
    messages:[],
    reviews:[],
    store:null
  };

}


function load(){

  try{

    const x=
      JSON.parse(
        localStorage.getItem(KEY)
      );


    if(
      x &&
      x.products
    ){

      const result={
        ...fresh(),
        ...x
      };


      result.products=
        (result.products||[]).map(
          p=>({

            ...p,

            /* ✨ ЖАҢА */
            special:
              Boolean(
                p.special
              ),

            /* ✨ ЖАҢА */
            specialType:
              p.specialType||
              'interesting'

          })
        );


      return result;

    }

  }catch(e){

    console.warn(
      'Local data load error:',
      e
    );

  }


  return fresh();

}


let state=load();

let page='home';

let selectedProduct=null;

let activeChat=null;


/* ==============================
   SAVE
   ============================== */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

  updateBadges();

}


/* ==============================
   SECURITY TEXT
   ============================== */

function esc(v){

  return String(v??'')
    .replace(
      /[&<>"']/g,
      m=>({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[m])
    );

}


/* ==============================
   MONEY
   ============================== */

function money(n){

  return Number(n||0)
    .toLocaleString('kk-KZ')
    +' ₸';

}


/* ==============================
   TOAST
   ============================== */

function toast(t){

  const x=
    document.getElementById(
      'toast'
    );


  x.textContent=t;

  x.classList.add(
    'show'
  );


  clearTimeout(
    window._t
  );


  window._t=
    setTimeout(
      ()=>{
        x.classList.remove(
          'show'
        );
      },
      1800
    );

}


/* ==============================
   IMAGE
   ============================== */

function img(
  url,
  emoji='🛍️',
  cls='pic'
){

  if(url){

    return `
      <div class="${cls}">

        <img
          src="${esc(url)}"
          alt=""
          loading="lazy"
        >

      </div>
    `;

  }


  return `
    <div class="${cls}">

      <span>
        ${emoji}
      </span>

    </div>
  `;

}


/* ==============================
   PRODUCT FIND
   ============================== */

function getProduct(id){

  return state.products.find(
    p=>
      String(p.id)===
      String(id)
  );

}


/* ==============================
   FIREBASE INIT
   ============================== */

try{

  firebase.initializeApp(
    firebaseConfig
  );


  fbAuth=
    firebase.auth();

  fbDb=
    firebase.firestore();

  fbReady=true;


  fbAuth.onAuthStateChanged(
    async u=>{

      try{

        /* АНОНИМДІ ШЫҚҚАНДА */
        if(!u){

          if(
            state.currentUser?.firebase
          ){

            state.currentUser=null;

            save();
            render();

          }

          return;

        }


        const ref=
          fbDb
            .collection('users')
            .doc(u.uid);


        const snap=
          await ref.get();


        const d=
          snap.exists
          ?
          snap.data()
          :
          {};


        state.currentUser={

          id:u.uid,

          name:
            d.name||
            u.displayName||
            'Пайдаланушы',

          phone:
            u.phoneNumber||
            d.phone||
            '',

          firebase:true

        };


        if(!snap.exists){

          await ref.set({

            name:
              state.currentUser.name,

            phone:
              state.currentUser.phone,

            role:'buyer',

            createdAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          },{
            merge:true
          });

        }


        save();

        render();


      }catch(e){

        console.error(
          'Auth state error:',
          e
        );

      }

    }
  );


}catch(e){

  console.warn(
    'Firebase init error:',
    e
  );

  fbReady=false;

}


/* ==============================
   FIREBASE PRODUCTS LOAD
   ============================== */

async function syncFirebaseData(){

  if(!fbReady)
    return;


  try{

    const ps=
      await fbDb
        .collection('products')
        .get();


    if(
      ps.empty
    ){

      return;

    }


    state.products=
      ps.docs.map(
        d=>{

          const data=
            d.data();


          return {

            id:d.id,

            ...data,

            name:
              data.name||
              data.title||
              'Тауар',

            price:
              Number(
                data.price||0
              ),

            sellerName:
              data.sellerName||
              data.seller||
              'Сатушы',

            /* ✨ ЕРЕКШЕ */
            special:
              Boolean(
                data.special
              ),

            /* ✨ ТҮР */
            specialType:
              data.specialType||
              'interesting'

          };

        }
      );


    save();

    render();


  }catch(e){

    console.warn(
      'Firebase products:',
      e
    );

  }

}


/* ==============================
   ✨ SPECIAL PRODUCTS
   ============================== */

function getSpecialProducts(
  type='all'
){

  let products=
    (state.products||[])
      .filter(
        p=>p.special===true
      );


  if(
    type!=='all'
  ){

    products=
      products.filter(
        p=>
          (
            p.specialType||
            'interesting'
          )===type
      );

  }


  return products;

}
 function renderCard(p){

  const fav=
    state.favorites.includes(
      p.id
    );


  const emoji=
    p.cat==='Косметика'
    ?
    '💄'
    :
    p.cat==='Электрон'
    ?
    '📱'
    :
    p.cat==='Киім'
    ?
    '👕'
    :
    p.cat==='Аяқ киім'
    ?

function randomSpecialProduct(){

  const products=

      'all'
    );


  if(
    !products.length
  ){

    toast(
      '✨ Әзірге ерекше тауар жоқ'
    );

    return;
  }


  const randomIndex=
    Math.floor(
      Math.random()*
      products.length
    );


  const product=
    products[
      randomIndex
    ];


  openProduct(
    product.id
  );

}

function addCart(id){
  const p=state.products.find(x=>x.id===id);

  const item=state.cart.find(x=>x.productId===id);

  if(item){
    item.qty++;
  }else{
    state.cart.push({
      productId:id,
      qty:1
    });
  }

  save();
  updateBadges();
  toast('✅ Себетке қосылды');
}

  }else{
    state.favorites.push(id);

function changeQty(id,delta){
  const item=state.cart.find(x=>x.productId===id);
  if(!item)return;

  item.qty+=delta;

  if(item.qty<=0){
    state.cart=state.cart.filter(x=>x.productId!==id);
  }

  save();
  updateBadges();
  openCart();
}

async function checkout(){
  if(!state.cart.length){
    toast('Себет бос');
    return;
  }

  if(!state.currentUser){
    closeModal();
    openLogin();
    return;
  }

  const name=document.getElementById('orderName')?.value.trim();
  const phone=document.getElementById('orderPhone')?.value.trim();
  const address=document.getElementById('orderAddress')?.value.trim();

  if(!name || !phone || !address){
    toast('Барлық мәліметті толтырыңыз');
    return;
  }

  if(!validPhone(phone)){
    toast('Телефон нөмірін дұрыс енгізіңіз');
    return;
  }

  const cartItems=state.cart
    .map(x=>{
      const p=state.products.find(y=>y.id===x.productId);
      return p ? {
        productId:p.id,
        name:p.name,
        price:Number(p.price||0),
        qty:x.qty,
        sellerId:p.sellerId||'platform',
        sellerName:p.sellerName||'Сатушы'
      } : null;
    })
    .filter(Boolean);

  if(!cartItems.length){
    toast('Себеттегі тауарлар табылмады');
    return;
  }

  const total=cartItems.reduce(
    (sum,x)=>sum+x.price*x.qty,
    0
  );

  const sellerIds=[
    ...new Set(
      cartItems
        .map(x=>x.sellerId)
        .filter(x=>x && x!=='platform')
    )
  ];

  const order={
    id:'o_'+Date.now(),
    buyerId:state.currentUser.id,
    buyerName:name,
    phone,
    address,
    items:cartItems,
    total,
    sellerIds,
    status:'Жаңа тапсырыс',
    createdAt:Date.now()
  };

  try{
    if(fbReady && fbDb){
      const ref=fbDb.collection('orders').doc(order.id);

      await ref.set({
        ...order,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    state.orders.unshift(order);
    state.cart=[];
    save();
    updateBadges();

    closeModal();

    openModal(`
      <div class="modaltop">
        <h2>✅ Тапсырыс қабылданды</h2>
        <button class="close" id="close">×</button>
      </div>

      <div class="item">
        <div><b>Клиент:</b> ${esc(name)}</div>
        <div><b>Телефон:</b> ${esc(phone)}</div>
        <div><b>Мекенжай:</b> ${esc(address)}</div>
        <div style="margin-top:8px">
          <b>Сома:</b>
          ${total.toLocaleString('kk-KZ')} ₸
        </div>
      </div>

      <button class="primary"
              id="orderClose"
              style="width:100%;margin-top:10px">
        Жабу
      </button>
    `);

    document.getElementById('close').onclick=closeModal;
    document.getElementById('orderClose').onclick=closeModal;

    toast('Тапсырыс жіберілді');

  }catch(e){
    console.error(e);
    toast('Тапсырысты сақтау кезінде қате шықты');
  }
}
 function normalizePhone(v){
  let s=String(v||'').replace(/\D/g,'');

  if(s.startsWith('8')) s='7'+s.slice(1);
  if(!s.startsWith('7')) s='7'+s;

  return '+'+s.slice(0,11);
}

function validPhone(v){
  return /^\+7\d{10}$/.test(normalizePhone(v));
}

async function passHash(v){
  const data=new TextEncoder().encode(String(v||''));
  const hash=await crypto.subtle.digest('SHA-256',data);

  return Array.from(new Uint8Array(hash))
    .map(x=>x.toString(16).padStart(2,'0'))
    .join('');
}

function openLogin(){
  openModal(`
    <div class="modaltop">
      <h2>🔐 Кіру</h2>
      <button class="close" id="close">×</button>
    </div>

    <div class="field">
      <label>Телефон</label>
      <input id="loginPhone"
             type="tel"
             inputmode="tel"
             placeholder="+7 700 000 00 00">
    </div>

    <div class="field">
      <label>Құпия сөз</label>
      <input id="loginPassword"
             type="password"
             placeholder="Құпия сөз">
    </div>

    <button class="primary"
            id="doLogin"
            style="width:100%">
      Кіру
    </button>

    <button class="secondary"
            id="toRegister"
            style="width:100%;margin-top:8px">
      Жаңа аккаунт ашу
    </button>

    ${
      fbReady
      ? `
        <div class="muted" style="margin-top:14px;text-align:center">
          Firebase қосылған.
        </div>
      `
      : ''
    }
  `);

  document.getElementById('close').onclick=closeModal;

  document.getElementById('doLogin').onclick=async()=>{
    const phone=normalizePhone(
      document.getElementById('loginPhone')?.value
    );

    const password=
      document.getElementById('loginPassword')?.value||'';

    if(!validPhone(phone)){
      toast('Телефонды дұрыс енгізіңіз');
      return;
    }

    if(password.length<6){
      toast('Құпия сөз кемінде 6 таңба болуы керек');
      return;
    }

    try{
      if(fbReady && fbAuth){
        await fbAuth.signInWithEmailAndPassword(
          phone.replace('+','')+'@satugo.local',
          password
        );

        closeModal();
        toast('✅ Кіру сәтті орындалды');
        return;
      }

      const users=state.users||[];

      const hash=await passHash(password);

      const user=users.find(
        x=>x.phone===phone && x.passwordHash===hash
      );

      if(!user){
        toast('Телефон немесе құпия сөз қате');
        return;
      }

      state.currentUser={
        id:user.id,
        name:user.name,
        phone:user.phone
      };

      save();
      closeModal();
      render();
      toast('✅ Кіру сәтті орындалды');

    }catch(e){
      console.error(e);

      if(
        e.code==='auth/user-not-found' ||
        e.code==='auth/invalid-credential'
      ){
        toast('Аккаунт табылмады');
      }else{
        toast('Кіру кезінде қате шықты');
      }
    }
  };

  document.getElementById('toRegister').onclick=()=>{
    openRegister();
  };
}

function openRegister(){
  openModal(`
    <div class="modaltop">
      <h2>📝 Тіркелу</h2>
      <button class="close" id="close">×</button>
    </div>

    <div class="field">
      <label>Аты-жөніңіз</label>
      <input id="regName"
             placeholder="Аты-жөніңіз">
    </div>

    <div class="field">
      <label>Телефон</label>
      <input id="regPhone"
             type="tel"
             inputmode="tel"
             placeholder="+7 700 000 00 00">
    </div>

    <div class="field">
      <label>Құпия сөз</label>
      <input id="regPassword"
             type="password"
             placeholder="Кемінде 6 таңба">
    </div>

    <div class="field">
      <label>Құпия сөзді қайталау</label>
      <input id="regPassword2"
             type="password"
             placeholder="Қайта енгізіңіз">
    </div>

    <button class="primary"
            id="doRegister"
            style="width:100%">
      📝 Аккаунт ашу
    </button>

    <button class="secondary"
            id="toLogin"
            style="width:100%;margin-top:8px">
      🔐 Кіруге оралу
    </button>
  `);

  document.getElementById('close').onclick=closeModal;

  document.getElementById('toLogin').onclick=()=>{
    openLogin();
  };

  document.getElementById('doRegister').onclick=async()=>{
    const name=
      document.getElementById('regName')?.value.trim();

    const phone=normalizePhone(
      document.getElementById('regPhone')?.value
    );

    const p1=
      document.getElementById('regPassword')?.value||'';

    const p2=
      document.getElementById('regPassword2')?.value||'';

    if(!name){
      toast('Атыңызды енгізіңіз');
      return;
    }

    if(!validPhone(phone)){
      toast('Телефон нөмірін дұрыс енгізіңіз');
      return;
    }

    if(p1.length<6){
      toast('Құпия сөз кемінде 6 таңба болуы керек');
      return;
    }

    if(p1!==p2){
      toast('Құпия сөздер сәйкес емес');
      return;
    }

    try{
      if(fbReady && fbAuth){

        const email=
          phone.replace('+','')+'@satugo.local';

        const cred=
          await fbAuth.createUserWithEmailAndPassword(
            email,
            p1
          );

        await fbDb.collection('users')
          .doc(cred.user.uid)
          .set({
            name,
            phone,
            role:'buyer',
            createdAt:
              firebase.firestore.FieldValue.serverTimestamp()
          },{
            merge:true
          });

        state.currentUser={
          id:cred.user.uid,
          name,
          phone,
          firebase:true
        };

        save();
        closeModal();
        render();
        toast('✅ Аккаунт ашылды');

        return;
      }

      state.users=state.users||[];

      if(state.users.some(x=>x.phone===phone)){
        toast('Бұл нөмірмен аккаунт бұрын тіркелген');
        return;
      }

      const passwordHash=await passHash(p1);

      const user={
        id:'u_'+Date.now(),
        name,
        phone,
        passwordHash,
        createdAt:Date.now()
      };

      state.users.push(user);

      state.currentUser={
        id:user.id,
        name:user.name,
        phone:user.phone
      };

      save();
      closeModal();
      render();
      toast('✅ Аккаунт ашылды');

    }catch(e){
      console.error(e);

      if(e.code==='auth/email-already-in-use'){
        toast('Бұл нөмір бұрын тіркелген');
      }else{
        toast('Тіркелу кезінде қате шықты');
      }
    }
  };
}

async function saveSellerProduct(){
  if(!state.currentUser){
    openLogin();
    return;
  }

  const name=
    document.getElementById('pName')?.value.trim();

  const price=
    Number(document.getElementById('pPrice')?.value||0);

  const category=
    document.getElementById('pCategory')?.value||'Басқа';

  const image=
    document.getElementById('pImage')?.value.trim()||'';

  const description=
    document.getElementById('pDescription')?.value.trim()||'';

  const special=
    Boolean(
      document.getElementById('pSpecial')?.checked
    );

  const specialType=
    document.getElementById('pSpecialType')?.value||'interesting';

  if(!name){
    toast('Тауар атауын енгізіңіз');
    return;
  }

  if(!price || price<0){
    toast('Бағаны дұрыс енгізіңіз');
    return;
  }

  const p={
    id:'p_'+Date.now(),
    name,
    price,
    category,
    image,
    description,
    emoji:'🛍️',
    sellerId:state.currentUser.id,
    sellerName:
      state.store?.name ||
      state.currentUser.name ||
      'Сатушы',
    special,
    specialType,
    createdAt:Date.now()
  };

  try{
    if(fbReady && fbDb){

      await fbDb.collection('products')
        .doc(p.id)
        .set({
          ...p,
          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    state.products.unshift(p);
    save();

    toast(
      special
      ? '✨ Ерекше тауар Firebase-ке сақталды'
      : '✅ Тауар қосылды'
    );

    openSeller();

  }catch(e){
    console.error(e);
    toast('Тауарды сақтау кезінде қате шықты');
  }
}

async function editSellerProduct(id){
  const p=state.products.find(x=>x.id===id);
  if(!p)return;

  if(p.sellerId!==state.currentUser?.id){
    toast('Бұл тауарды өзгертуге рұқсат жоқ');
    return;
  }

  const name=prompt('Тауар атауы:',p.name);
  if(name===null)return;

  const price=prompt('Бағасы:',p.price);
  if(price===null)return;

  const image=prompt('Сурет URL:',p.image||'');
  if(image===null)return;

  const special=confirm(
    'Бұл тауар «✨ Ерекше тауарлар» бөліміне шықсын ба?'
  );

  let specialType=p.specialType||'interesting';

  if(special){
    const t=prompt(
      'Ерекше түрі:\ninteresting = Қызық зат\neye = Көзге түсетін\ngift = Сыйлық',
      specialType
    );

    if(t==='interesting'||t==='eye'||t==='gift'){
      specialType=t;
    }
  }

  p.name=name.trim();
  p.price=Number(price)||0;
  p.image=image.trim();
  p.special=special;
  p.specialType=specialType;

  try{
    if(fbReady && fbDb){
      await fbDb.collection('products')
        .doc(p.id)
        .set({
          name:p.name,
          price:p.price,
          image:p.image,
          special:p.special,
          specialType:p.specialType
        },{
          merge:true
        });
    }

    save();
    toast(
      p.special
      ? '✨ Ерекше тауар жаңартылды'
      : '✅ Тауар жаңартылды'
    );

    openSeller();

  }catch(e){
    console.error(e);
    toast('Тауарды өзгерту кезінде қате шықты');
  }
}

async function deleteSellerProduct(id){
  const p=state.products.find(x=>x.id===id);
  if(!p)return;

  if(p.sellerId!==state.currentUser?.id){
    toast('Бұл тауарды өшіруге рұқсат жоқ');
    return;
  }

  if(!confirm(
    `«${p.name}» тауарын өшіру керек пе?`
  )){
    return;
  }

  try{
    if(fbReady && fbDb){
      await fbDb.collection('products')
        .doc(id)
        .delete();
    }

    state.products=
      state.products.filter(x=>x.id!==id);

    state.cart=
      state.cart.filter(x=>x.productId!==id);

    state.favorites=
      state.favorites.filter(x=>x!==id);

    save();
    updateBadges();
    toast('🗑 Тауар өшірілді');
    openSeller();

  }catch(e){
    console.error(e);
    toast('Тауарды өшіру кезінде қате шықты');
  }
}

async function changeSellerOrder(id,status){
  const o=state.orders.find(x=>x.id===id);
  if(!o)return;

  const uid=state.currentUser?.id;

  if(!uid || !(o.sellerIds||[]).includes(uid)){
    toast('Бұл тапсырысты өзгертуге рұқсат жоқ');
    return;
  }

  o.status=status;

  try{
    if(fbReady && fbDb){
      await fbDb.collection('orders')
        .doc(id)
        .update({
          status
        });
    }

    save();
    toast(
      status==='Қабылданды'
      ? '✅ Тапсырыс қабылданды'
      : '❌ Тапсырыс тоқтатылды'
    );

    openSeller();

  }catch(e){
    console.error(e);
    toast('Тапсырыс статусын өзгерту кезінде қате шықты');
  }
}

function startChat(p){
  if(!state.currentUser){
    closeModal();
    openLogin();
    return;
  }

  if(p.sellerId==='platform'){
    toast('Бұл тауардың жеке сатушысы жоқ');
    return;
  }

  let c=state.chats.find(
    x=>
      x.buyerId===state.currentUser.id &&
      x.sellerId===p.sellerId
  );

  if(!c){
    c={
      id:'c_'+state.currentUser.id+'_'+p.sellerId,
      buyerId:state.currentUser.id,
      buyerName:state.currentUser.name,
      sellerId:p.sellerId,
      sellerName:p.sellerName||'Сатушы',
      participants:[
        state.currentUser.id,
        p.sellerId
      ],
      lastMessage:'',
      unread:{
        [state.currentUser.id]:0,
        [p.sellerId]:0
      }
    };

    state.chats.unshift(c);
  }

  c.unread[state.currentUser.id]=0;

  save();
  closeModal();
  openChat(c.id);
}

function openChat(id){
  const c=state.chats.find(x=>x.id===id);
  if(!c)return;

  activeChat=id;

  const uid=state.currentUser?.id;

  if(!uid || !c.participants.includes(uid)){
    toast('Чатқа рұқсат жоқ');
    return;
  }

  c.unread[uid]=0;

  save();

  const msgs=state.messages.filter(
    m=>m.chatId===id
  );

  openModal(`
    <div class="modaltop">
      <h2>💬 ${
        esc(
          c.buyerId===uid
          ? c.sellerName
          : c.buyerName
        )
      }</h2>

      <button class="close" id="close">×</button>
    </div>

    <div class="chatbox">

      <div class="msgs" id="msgs">
        ${
          msgs.length
          ? msgs.map(m=>`
              <div class="msg ${
                m.senderId===uid
                ? 'mine'
                : 'theirs'
              }">
                ${esc(m.text)}
              </div>
            `).join('')
          : `
            <div class="muted">
              Хабарлама жоқ.
            </div>
          `
        }
      </div>

      <div class="chatinput">
        <input
          id="chatText"
          placeholder="Хабарлама..."
          autocomplete="off"
        >

        <button
          class="primary"
          id="sendChat">
          Жіберу
        </button>
      </div>

    </div>
  `);

  document.getElementById('close').onclick=closeModal;

  document.getElementById('sendChat').onclick=sendChat;

  document.getElementById('chatText')
    .addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        sendChat();
      }
    });

  setTimeout(()=>{
    const m=document.getElementById('msgs');

    if(m){
      m.scrollTop=m.scrollHeight;
    }
  },0);
}

function sendChat(){
  const input=
    document.getElementById('chatText');

  const text=input?.value.trim();

  if(!text || !activeChat)return;

  const c=state.chats.find(
    x=>x.id===activeChat
  );

  if(!c || !state.currentUser)return;

  const uid=state.currentUser.id;

  const other=
    c.participants.find(x=>x!==uid);

  state.messages.push({
    id:'m_'+Date.now(),
    chatId:c.id,
    senderId:uid,
    text,
    createdAt:Date.now()
  });

  c.lastMessage=text;
  c.lastAt=Date.now();

  c.unread[other]=
    (c.unread[other]||0)+1;

  save();

  input.value='';

  openChat(c.id);
}

function render(){
  const app=document.getElementById('app');
  if(!app)return;

  let html='';

  if(state.page==='home'){
    html=renderHome();
  }

  else if(state.page==='search'){
    html=renderSearch();
  }

  else if(state.page==='favorites'){
    html=renderFav();
  }

  else if(state.page==='chats'){
    html=renderChats();
  }

  else if(state.page==='account'){
    html=renderAccount();
  }

  app.innerHTML=html;

  updateBadges();

  bindPageEvents();
}

function bindPageEvents(){

  const loginBtn=
    document.getElementById('loginBtn');

  if(loginBtn){
    loginBtn.onclick=openLogin;
  }

  const registerBtn=
    document.getElementById('registerBtn');

  if(registerBtn){
    registerBtn.onclick=openRegister;
  }

  const profileEdit=
    document.getElementById('profileEdit');

  if(profileEdit){
    profileEdit.onclick=editProfile;
  }

  const myOrdersBtn=
    document.getElementById('myOrdersBtn');

  if(myOrdersBtn){
    myOrdersBtn.onclick=openMyOrders;
  }

  const sellerBtn=
    document.getElementById('sellerBtn');

  if(sellerBtn){
    sellerBtn.onclick=openSeller;
  }

  const logoutBtn=
    document.getElementById('logoutBtn');

  if(logoutBtn){
    logoutBtn.onclick=async()=>{
      try{
        if(fbReady && fbAuth){
          await fbAuth.signOut();
        }
      }catch(e){
        console.warn(e);
      }

      state.currentUser=null;
      save();
      render();
      toast('🚪 Аккаунттан шықтыңыз');
    };
  }

  const chatLoginBtn=
    document.getElementById('chatLoginBtn');

  if(chatLoginBtn){
    chatLoginBtn.onclick=openLogin;
  }

  document
    .querySelectorAll('[data-product]')
    .forEach(btn=>{
      btn.onclick=()=>{
        openProduct(btn.dataset.product);
      };
    });

  document
    .querySelectorAll('[data-fav]')
    .forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        toggleFav(btn.dataset.fav);
      };
    });

  document
    .querySelectorAll('[data-add]')
    .forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        addCart(btn.dataset.add);
      };
    });

  document
    .querySelectorAll('[data-special]')
    .forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        openSpecialProducts(btn.dataset.special||'all');
      };
    });
}

function updateBadges(){
  const cartCount=
    state.cart.reduce(
      (sum,x)=>sum+(Number(x.qty)||0),
      0
    );

  const cart=document.getElementById('cartCount');

  if(cart){
    cart.textContent=cartCount;
  }

  const favBadge=
    document.getElementById('favBadge');

  if(favBadge){

    const count=
      state.favorites.length;

    favBadge.textContent=count;

    favBadge.classList.toggle(
      'hidden',
      count===0
    );
  }

  const chatBadge=
    document.getElementById('chatBadge');

  if(chatBadge){

    const uid=state.currentUser?.id;

    const unread=
      uid
      ? state.chats
          .filter(c=>
            (c.participants||[]).includes(uid)
          )
          .reduce(
            (sum,c)=>
              sum+(Number(c.unread?.[uid])||0),
            0
          )
      : 0;

    chatBadge.textContent=unread;

    chatBadge.classList.toggle(
      'hidden',
      unread===0
    );
  }
}

function setPage(page){
  state.page=page;

  document
    .querySelectorAll('.navbtn')
    .forEach(btn=>{
      btn.classList.toggle(
        'active',
        btn.dataset.page===page
      );
    });

  render();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}
 function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function toast(message){
  const el=document.getElementById('toast');
  if(!el)return;

  el.textContent=message;
  el.classList.add('show');

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(()=>{
    el.classList.remove('show');
  },2400);
}

function openModal(html){
  const modal=document.getElementById('modal');
  const sheet=document.getElementById('sheet');

  if(!modal || !sheet)return;

  sheet.innerHTML=html;
  modal.classList.add('show');

  document.body.style.overflow='hidden';
}

function closeModal(){
  const modal=document.getElementById('modal');

  if(modal){
    modal.classList.remove('show');
  }

  document.body.style.overflow='';
  activeChat=null;
}

async function syncFirebaseData(){
  if(!fbReady || !fbDb)return;

  try{
    const snap=
      await fbDb.collection('products')
        .orderBy('createdAt','desc')
        .get();

    state.products=snap.docs.map(doc=>{
      const data=doc.data()||{};

      return {
        id:doc.id,
        name:data.name||'Тауар',
        price:Number(data.price||0),
        category:data.category||'Басқа',
        image:data.image||'',
        description:data.description||'',
        emoji:data.emoji||'🛍️',
        sellerId:data.sellerId||'platform',
        sellerName:data.sellerName||'Сатушы',

        /* ✨ Ерекше тауар */
        special:Boolean(data.special),
        specialType:data.specialType||'interesting',

        createdAt:data.createdAt||Date.now()
      };
    });

    save();
    render();

  }catch(e){
    console.warn('Firebase products:',e);
  }
}

async function loadFirebaseOrders(){
  if(!fbReady || !fbDb || !state.currentUser)return;

  try{
    const uid=state.currentUser.id;

    const buyerSnap=
      await fbDb.collection('orders')
        .where('buyerId','==',uid)
        .get();

    const sellerSnap=
      await fbDb.collection('orders')
        .where('sellerIds','array-contains',uid)
        .get();

    const map=new Map();

    buyerSnap.docs.forEach(d=>{
      map.set(d.id,{
        id:d.id,
        ...d.data()
      });
    });

    sellerSnap.docs.forEach(d=>{
      map.set(d.id,{
        id:d.id,
        ...d.data()
      });
    });

    state.orders=[
      ...map.values()
    ].sort(
      (a,b)=>
        (Number(b.createdAt)||0)-
        (Number(a.createdAt)||0)
    );

    save();

  }catch(e){
    console.warn('Firebase orders:',e);
  }
}

function save(){
  try{
    localStorage.setItem(
      'satugo_state',
      JSON.stringify(state)
    );
  }catch(e){
    console.warn('save:',e);
  }
}

function load(){
  try{
    const raw=
      localStorage.getItem('satugo_state');

    if(!raw){
      return fresh();
    }

    const x=JSON.parse(raw);

    const base=fresh();

    const stateData={
      ...base,
      ...x
    };

    stateData.products=
      Array.isArray(stateData.products)
      ? stateData.products.map(p=>({
          ...p,
          special:Boolean(p.special),
          specialType:p.specialType||'interesting'
        }))
      : base.products;

    stateData.cart=
      Array.isArray(stateData.cart)
      ? stateData.cart
      : [];

    stateData.favorites=
      Array.isArray(stateData.favorites)
      ? stateData.favorites
      : [];

    stateData.orders=
      Array.isArray(stateData.orders)
      ? stateData.orders
      : [];

    stateData.users=
      Array.isArray(stateData.users)
      ? stateData.users
      : [];

    stateData.chats=
      Array.isArray(stateData.chats)
      ? stateData.chats
      : [];

    stateData.messages=
      Array.isArray(stateData.messages)
      ? stateData.messages
      : [];

    return stateData;

  }catch(e){
    console.warn('load:',e);
    return fresh();
  }
}

let activeChat=null;

function goHome(){

}

document.getElementById('cartBtn').onclick=()=>{

};

  const input=
    document.getElementById('searchInput');

  state.query=
    input?.value.trim()||'';

  setPage('search');
};

document.getElementById('searchInput')
  .addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();

      state.query=
        e.target.value.trim();

      setPage('search');
    }
  });

document.getElementById('modal')
  .addEventListener('click',e=>{
    if(e.target.id==='modal'){
      closeModal();
    }
  });

document.querySelectorAll('.navbtn')
  .forEach(btn=>{
    btn.addEventListener('click',()=>{
      setPage(btn.dataset.page);
    });
  });

window.addEventListener('popstate',()=>{
  render();
});

window.addEventListener('storage',()=>{
  const freshState=load();

  state={
    ...state,
    ...freshState
  };

  render();
});

async function start(){
  render();

  updateBadges();

  if(fbReady){

    await syncFirebaseData();

    if(state.currentUser){
      await loadFirebaseOrders();
    }
  }

  render();
}

start();
