<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SatuGo — Қазақстан маркетплейсі</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#fff;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#111;
}

.logo span{
  color:#ff4d00;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.header-btn{
  border:0;
  background:#f1f1f1;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

.cart-btn{
  background:#ff4d00;
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
  margin-bottom:15px;
}

.search:focus{
  border-color:#ff4d00;
}

.banner{
  background:linear-gradient(135deg,#ff4d00,#ff8a00);
  color:white;
  padding:25px 20px;
  border-radius:16px;
  margin-bottom:20px;
}

.banner h1{
  font-size:28px;
  margin-bottom:8px;
}

.banner p{
  font-size:15px;
}

.seller-banner{
  background:#111;
  color:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.seller-banner button{
  background:#ff4d00;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
}

.section-title{
  font-size:22px;
  margin:20px 0 12px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}

.category{
  border:0;
  background:white;
  padding:11px 15px;
  border-radius:12px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.category:hover{
  background:#ff4d00;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:12px;
}

.product-name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:7px;
}

.product-category{
  color:#777;
  font-size:13px;
  margin-bottom:8px;
}

.product-price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.add-btn{
  width:100%;
  border:0;
  background:#ff4d00;
  color:white;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
}

.empty{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:15px;
  color:#777;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  padding:15px;
  overflow-y:auto;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:30px auto;
  border-radius:18px;
  padding:20px;
  position:relative;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-header h2{
  font-size:22px;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:10px;
  font-size:15px;
  outline:none;
}

.input:focus{
  border-color:#ff4d00;
}

.main-btn{
  width:100%;
  background:#ff4d00;
  color:white;
  border:0;
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  margin-bottom:10px;
}

.gray-btn{
  width:100%;
  background:#eee;
  color:#222;
  border:0;
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  margin-bottom:10px;
}

.danger-btn{
  background:#e53935;
  color:white;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#eee;
  cursor:pointer;
}

.tab.active{
  background:#ff4d00;
  color:white;
}

.account-info{
  background:#f7f7f7;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-item-name{
  font-weight:bold;
}

.cart-item-price{
  font-size:14px;
  color:#555;
}

.remove-btn{
  border:0;
  background:#ffe5e5;
  color:#d00;
  padding:7px 9px;
  border-radius:8px;
  cursor:pointer;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:19px;
  font-weight:bold;
  padding:15px 0;
}

.product-admin{
  background:#f7f7f7;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.order-card{
  background:#f7f7f7;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  background:#fff0e8;
  color:#ff4d00;
  font-size:13px;
  margin-top:8px;
}

@media(max-width:800px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-image{
    height:150px;
  }

  .banner h1{
    font-size:23px;
  }

  .seller-banner{
    flex-direction:column;
    align-items:flex-start;
  }

  .seller-banner button{
    width:100%;
  }

  .modal-box{
    margin:10px auto;
  }
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

</head>

<body>

<header>
  <div class="logo">
    Satu<span>Go</span>
  </div>

  <div class="header-buttons">
    <button class="header-btn" onclick="openAccount()">
      👤 Кіру
    </button>

    <button class="header-btn cart-btn" onclick="openCart()">
      🛒 Себет <span id="cartCount">0</span>
    </button>
  </div>
</header>

<div class="container">

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Тауар немесе дүкен іздеу..."
    oninput="searchProducts()"
  >

  <div class="banner">
    <h1>SatuGo</h1>
    <p>Қазақстандағы жаңа онлайн маркетплейс</p>
  </div>

  <div class="seller-banner">
    <div>
      <h3>Өз тауарыңды сат!</h3>
      <p>Дүкен ашып, клиенттерге тауарларыңды ұсын.</p>
    </div>

    <button onclick="openSeller()">
      Дүкен ашу
    </button>
  </div>

  <h2 class="section-title">Категориялар</h2>

  <div class="categories">

    <button
      class="category"
      onclick="showProducts()">
      Барлығы
    </button>

    <button
      class="category"
      onclick="categoryFilter('Киім')">
      👕 Киім
    </button>

    <button
      class="category"
      onclick="categoryFilter('Аяқ киім')">
      👟 Аяқ киім
    </button>

    <button
      class="category"
      onclick="categoryFilter('Косметика')">
      💄 Косметика
    </button>

    <button
      class="category"
      onclick="categoryFilter('Электрон')">
      📱 Электроника
    </button>

  </div>

  <h2 class="section-title">Тауарлар</h2>

  <div id="products" class="products">
    <div class="empty">
      Тауарлар жүктелуде...
    </div>
  </div>

</div>


<!-- ACCOUNT MODAL -->

<div id="accountModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Аккаунт</h2>

      <button
        class="close"
        onclick="closeAccount()">
        ×
      </button>
    </div>

    <div id="accountContent"></div>

  </div>

</div>


<!-- SELLER MODAL -->

<div id="sellerModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Менің дүкенім</h2>

      <button
        class="close"
        onclick="closeSeller()">
        ×
      </button>
    </div>

    <div id="sellerContent"></div>

  </div>

</div>


<!-- CART MODAL -->

<div id="cartModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>🛒 Себет</h2>

      <button
        class="close"
        onclick="closeCart()">
        ×
      </button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      <span>Барлығы:</span>
      <span id="cartTotal">0 ₸</span>
    </div>

    <h3 style="margin-bottom:12px;">
      Тапсырыс беру
    </h3>

    <input
      id="customerName"
      class="input"
      placeholder="Аты-жөніңіз"
    >

    <input
      id="customerPhone"
      class="input"
      placeholder="Телефон нөмірі"
      type="tel"
    >

    <input
      id="customerAddress"
      class="input"
      placeholder="Жеткізу мекенжайы"
    >

    <button
      class="main-btn"
      onclick="makeOrder()">
      Тапсырыс беру
    </button>

  </div>

</div>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCj7VBpb0u5YgFqz2Mm8NhvbytX_Fs5tJE",
  authDomain: "satugo-c3b7c.firebaseapp.com",
  projectId: "satugo-c3b7c",
  storageBucket: "satugo-c3b7c.firebasestorage.app",
  messagingSenderId: "32133349747",
  appId: "1:32133349747:web:8df062f6428b4eb7ed8506",
  measurementId: "G-4PF4DV016B"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================
   GLOBAL VARIABLES
========================= */

var products = [];
var cart = [];
var currentUser = null;
var currentProfile = null;


/* =========================
   DEMO PRODUCTS
========================= */

var demoProducts = [

  {
    id: "demo1",
    name: "Nike Air Max",
    price: 39990,
    category: "Аяқ киім",
    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80",
    sellerId: "",
    sellerName: "SatuGo"
  },

  {
    id: "demo2",
    name: "Oversize Hoodie",
    price: 12990,
    category: "Киім",
    image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=600&q=80",
    sellerId: "",
    sellerName: "SatuGo"
  },

  {
    id: "demo3",
    name: "Әйелдер көйлегі",
    price: 19990,
    category: "Киім",
    image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=600&q=80",
    sellerId: "",
    sellerName: "SatuGo"
  },

  {
    id: "demo4",
    name: "Ақ кроссовка",
    price: 29990,
    category: "Аяқ киім",
    image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=600&q=80",
    sellerId: "",
    sellerName: "SatuGo"
  }

];


/* =========================
   SECURITY
========================= */

function safe(text){

  if(text === null || text === undefined){
    return "";
  }

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    var snapshot = await db
      .collection("products")
      .get();

    products = [];

    snapshot.forEach(function(doc){

      var data = doc.data();

      products.push({
        id: doc.id,
        name: data.name || "",
        price: Number(data.price) || 0,
        category: data.category || "",
        image: data.image || "",
        sellerId: data.sellerId || "",
        sellerName: data.sellerName || "Дүкен"
      });

    });

    /*
      Егер Firebase-та нақты тауар жоқ болса,
      demo тауарларды көрсетеміз.
    */

    if(products.length === 0){

      products = demoProducts.slice();

    }else{

      products = demoProducts.concat(products);

    }

    showProducts();

  }catch(error){

    console.error(error);

    products = demoProducts.slice();

    showProducts();

  }

}


/* =========================
   SHOW PRODUCTS
========================= */

function showProducts(list){

  var container = document.getElementById("products");

  var data = list || products;

  if(!data || data.length === 0){

    container.innerHTML =
      '<div class="empty">Тауар табылмады.</div>';

    return;

  }

  var html = "";

  data.forEach(function(p){

    html += `
      <div class="product">

        <img
          class="product-image"
          src="${safe(p.image)}"
          alt="${safe(p.name)}"
          onerror="this.src='https://via.placeholder.com/600x400?text=SatuGo'"
        >

        <div class="product-info">

          <div class="product-name">
            ${safe(p.name)}
          </div>

          <div class="product-category">
            ${safe(p.category)}
          </div>

          <div class="product-price">
            ${Number(p.price).toLocaleString("ru-RU")} ₸
          </div>

          <button
            class="add-btn"
            onclick="addCart('${safe(p.id)}')">
            🛒 Себетке қосу
          </button>

        </div>

      </div>
    `;

  });

  container.innerHTML = html;

}


/* =========================
   FIND PRODUCT
========================= */

function findProduct(id){

  return products.find(function(p){

    return p.id === id;

  });

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

  var input = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  if(!input){

    showProducts();

    return;

  }

  var result = products.filter(function(p){

    return (
      String(p.name).toLowerCase().includes(input) ||
      String(p.category).toLowerCase().includes(input) ||
      String(p.sellerName).toLowerCase().includes(input)
    );

  });

  showProducts(result);

}


/* =========================
   CATEGORY
========================= */

function categoryFilter(category){

  var result = products.filter(function(p){

    return p.category === category;

  });

  showProducts(result);

}


/* =========================
   CART
========================= */

function addCart(id){

  var product = findProduct(id);

  if(!product){

    alert("Тауар табылмады.");

    return;

  }

  cart.push(product);

  updateCartCount();

  alert("Тауар себетке қосылды ✅");

}


function updateCartCount(){

  document.getElementById("cartCount").textContent =
    cart.length;

}


function openCart(){

  document.getElementById("cartModal").style.display = "block";

  showCart();

}


function closeCart(){

  document.getElementById("cartModal").style.display = "none";

}


function showCart(){

  var box = document.getElementById("cartItems");

  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">Себет бос.</div>';

    document.getElementById("cartTotal").textContent = "0 ₸";

    return;

  }

  var html = "";
  var total = 0;

  cart.forEach(function(item,index){

    total += Number(item.price) || 0;

    html += `
      <div class="cart-item">

        <div>
          <div class="cart-item-name">
            ${safe(item.name)}
          </div>

          <div class="cart-item-price">
            ${Number(item.price).toLocaleString("ru-RU")} ₸
          </div>
        </div>

        <button
          class="remove-btn"
          onclick="removeCart(${index})">
          Өшіру
        </button>

      </div>
    `;

  });

  box.innerHTML = html;

  document.getElementById("cartTotal").textContent =
    total.toLocaleString("ru-RU") + " ₸";

}


function removeCart(index){

  cart.splice(index,1);

  updateCartCount();

  showCart();

}


/* =========================
   ORDER
========================= */

async function makeOrder(){

  if(!currentUser){

    alert("Алдымен аккаунтқа кіріңіз.");

    openAccount();

    return;

  }

  if(cart.length === 0){

    alert("Себет бос.");

    return;

  }

  var name =
    document.getElementById("customerName").value.trim();

  var phone =
    document.getElementById("customerPhone").value.trim();

  var address =
    document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address){

    alert("Барлық мәліметті толтырыңыз.");

    return;

  }

  var grouped = {};

  cart.forEach(function(item){

    var sellerId = item.sellerId || "satugo";

    if(!grouped[sellerId]){

      grouped[sellerId] = [];

    }

    grouped[sellerId].push(item);

  });

  try{

    for(var sellerId in grouped){

      var items = grouped[sellerId];

      var total = items.reduce(function(sum,item){

        return sum + (Number(item.price) || 0);

      },0);

      await db.collection("orders").add({

        customerId: currentUser.uid,

        customerName: name,

        customerPhone: phone,

        customerAddress: address,

        sellerId: sellerId,

        items: items,

        total: total,

        status: "Жаңа",

        createdAt: firebase.firestore.FieldValue.serverTimestamp()

      });

    }

    cart = [];

    updateCartCount();

    showCart();

    document.getElementById("customerName").value = "";
    document.getElementById("customerPhone").value = "";
    document.getElementById("customerAddress").value = "";

    alert("Тапсырыс сәтті қабылданды! ✅");

  }catch(error){

    console.error(error);

    alert("Тапсырыс жіберу кезінде қате болды.");

  }

}

</script>
<!-- =========================
     ACCOUNT
========================= -->

<script>

function openAccount(){

  document.getElementById("accountModal").style.display = "block";

  showAccount();

}


function closeAccount(){

  document.getElementById("accountModal").style.display = "none";

}


function showAccount(){

  var box = document.getElementById("accountContent");

  if(currentUser){

    var name = "Пайдаланушы";

    var email = currentUser.email || "";

    if(currentProfile && currentProfile.name){

      name = currentProfile.name;

    }

    box.innerHTML = `

      <div class="account-info">

        <h3 style="margin-bottom:8px;">
          👤 ${safe(name)}
        </h3>

        <p>
          ${safe(email)}
        </p>

      </div>

      <button
        class="main-btn"
        onclick="openSeller(); closeAccount();">
        🏪 Менің дүкенім
      </button>

      <button
        class="gray-btn danger-btn"
        onclick="logout()">
        Шығу
      </button>

    `;

    return;

  }


  box.innerHTML = `

    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        onclick="showLoginForm()">
        Кіру
      </button>

      <button
        id="registerTab"
        class="tab"
        onclick="showRegisterForm()">
        Тіркелу
      </button>

    </div>

    <div id="authForm"></div>

  `;

  showLoginForm();

}


function showLoginForm(){

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("registerTab").classList.remove("active");

  document.getElementById("authForm").innerHTML = `

    <input
      id="loginEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="Құпия сөз"
    >

    <button
      class="main-btn"
      onclick="loginUser()">
      Кіру
    </button>

  `;

}


function showRegisterForm(){

  document.getElementById("registerTab").classList.remove("active");
  document.getElementById("loginTab").classList.remove("active");

  document.getElementById("authForm").innerHTML = `

    <input
      id="registerName"
      class="input"
      placeholder="Аты-жөніңіз"
    >

    <input
      id="registerEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="registerPassword"
      class="input"
      type="password"
      placeholder="Құпия сөз (кемінде 6 таңба)"
    >

    <button
      class="main-btn"
      onclick="registerUser()">
      Тіркелу
    </button>

  `;

}


async function registerUser(){

  var name =
    document.getElementById("registerName").value.trim();

  var email =
    document.getElementById("registerEmail").value.trim();

  var password =
    document.getElementById("registerPassword").value;

  if(!name || !email || !password){

    alert("Барлық жолды толтырыңыз.");

    return;

  }

  if(password.length < 6){

    alert("Құпия сөз кемінде 6 таңбадан тұруы керек.");

    return;

  }

  try{

    var result =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );

    var user = result.user;

    await db.collection("users")
      .doc(user.uid)
      .set({

        name: name,

        email: email,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    alert("Аккаунт сәтті құрылды! ✅");

    showAccount();

  }catch(error){

    console.error(error);

    alert(translateFirebaseError(error));

  }

}


async function loginUser(){

  var email =
    document.getElementById("loginEmail").value.trim();

  var password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    alert("Email және құпия сөзді енгізіңіз.");

    return;

  }

  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

    alert("Сәтті кірдіңіз! ✅");

    closeAccount();

  }catch(error){

    console.error(error);

    alert(translateFirebaseError(error));

  }

}


function translateFirebaseError(error){

  var code = error && error.code
    ? error.code
    : "";

  if(code === "auth/invalid-email")
    return "❌ Email дұрыс емес.";

  if(code === "auth/user-not-found")
    return "❌ Мұндай аккаунт табылмады.";

  if(code === "auth/wrong-password")
    return "❌ Құпия сөз қате.";

  if(code === "auth/invalid-credential")
    return "❌ Email немесе құпия сөз қате.";

  if(code === "auth/email-already-in-use")
    return "❌ Бұл Email бұрын тіркелген.";

  if(code === "auth/weak-password")
    return "❌ Құпия сөз тым әлсіз.";

  if(code === "auth/too-many-requests")
    return "❌ Тым көп әрекет жасалды. Біраз уақыттан кейін қайталаңыз.";

  return "❌ Қате орын алды. Қайта көріңіз.";

}


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(async function(user){

  currentUser = user;

  if(user){

    await loadProfile();

  }else{

    currentProfile = null;

  }

  updateAccountButton();

});


async function loadProfile(){

  if(!currentUser){

    return;

  }

  try{

    var doc =
      await db.collection("users")
        .doc(currentUser.uid)
        .get();

    if(doc.exists){

      currentProfile = doc.data();

    }else{

      currentProfile = {
        name: "Пайдаланушы",
        email: currentUser.email || ""
      };

    }

  }catch(error){

    console.error(error);

    currentProfile = {
      name: "Пайдаланушы",
      email: currentUser.email || ""
    };

  }

}


function updateAccountButton(){

  var buttons =
    document.querySelectorAll(".header-btn");

  if(buttons.length > 0){

    if(currentUser){

      buttons[0].innerHTML = "👤 Аккаунт";

    }else{

      buttons[0].innerHTML = "👤 Кіру";

    }

  }

}


async function logout(){

  try{

    await auth.signOut();

    currentUser = null;
    currentProfile = null;

    closeAccount();

    alert("Аккаунттан шықтыңыз.");

    updateAccountButton();

  }catch(error){

    console.error(error);

    alert("Шығу кезінде қате болды.");

  }

}


/* =========================
   SELLER
========================= */

        .get();

    if(doc.exists){

      storeName = data.name || "";

    }

    box.innerHTML = `

      <h3 style="margin-bottom:10px;">
        🏪 Дүкен туралы
      </h3>

      <input
        id="storeName"
        class="input"
        placeholder="Дүкен атауы"

      >

      <button
        class="main-btn"

      </button>

      </h3>

      <input
        id="productName"
        class="input"

      >

      <input
        id="productPrice"
        class="input"
        type="number"
        placeholder="Бағасы, ₸"
      >

        id="productCategory"
        class="input">

        <option value="Аяқ киім">Аяқ киім</option>
        <option value="Косметика">Косметика</option>
        <option value="Электрон">Электроника</option>

async function saveStore(){

  if(!currentUser){

    alert("Алдымен аккаунтқа кіріңіз.");

    return;

  }

  var name =
    document.getElementById("storeName").value.trim();

  if(!name){

    alert("Дүкен атауын енгізіңіз.");

    return;

  }

  try{

    await db.collection("stores")
      .doc(currentUser.uid)
      .set({

        name: name,

        ownerId: currentUser.uid,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    alert("Дүкен сақталды! ✅");

  }catch(error){

    console.error(error);

    alert("Дүкенді сақтау кезінде қате болды.");

  }

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

  if(!currentUser){

    alert("Алдымен аккаунтқа кіріңіз.");

    return;

  }

  var name =
    document.getElementById("productName").value.trim();

  var price =
    Number(document.getElementById("productPrice").value);

  var category =
    document.getElementById("productCategory").value;

  var image =
    document.getElementById("productImage").value.trim();

  if(!name || !price){

    alert("Тауар атауы мен бағасын енгізіңіз.");

    return;

  }

  if(price <= 0){

    alert("Баға 0-ден үлкен болуы керек.");

    return;

  }

  try{

    var storeDoc =
      await db.collection("stores")
        .doc(currentUser.uid)
        .get();

    var sellerName = "Дүкен";

    if(storeDoc.exists){

      sellerName =
        storeDoc.data().name || "Дүкен";

    }

    await db.collection("products").add({

      name: name,

      price: price,

      category: category,

      image: image,

      sellerId: currentUser.uid,

      sellerName: sellerName,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productImage").value = "";

    alert("Тауар қосылды! ✅");

    await loadProducts();

  }catch(error){

    console.error(error);

    alert("Тауар қосу кезінде қате болды.");

  }

}


/* =========================
   MY PRODUCTS
========================= */

async function showMyProducts(){

  if(!currentUser){

    alert("Аккаунтқа кіріңіз.");

    return;

  }

  var extra =
    document.getElementById("sellerExtra");

  extra.innerHTML =
    "<div class='empty'>Жүктелуде...</div>";

  try{

    var snapshot =
      await db.collection("products")
        .where("sellerId","==",currentUser.uid)
        .get();

    if(snapshot.empty){

      extra.innerHTML =
        "<div class='empty'>Әзірге тауар жоқ.</div>";

      return;

    }

    var html =
      "<h3 style='margin:20px 0 10px;'>📦 Менің тауарларым</h3>";

    snapshot.forEach(function(doc){

      var p = doc.data();

      html += `

        <div class="product-admin">

          <strong>
            ${safe(p.name)}
          </strong>

          <div style="margin:6px 0;">
            ${Number(p.price).toLocaleString("ru-RU")} ₸
          </div>

          <div style="font-size:13px;color:#777;margin-bottom:8px;">
            ${safe(p.category)}
          </div>

          <button
            class="remove-btn"
            onclick="deleteProduct('${doc.id}')">
            🗑 Өшіру
          </button>

        </div>

      `;

    });

    extra.innerHTML = html;

  }catch(error){

    console.error(error);

    extra.innerHTML =
      "<div class='empty'>Тауарларды жүктеу мүмкін болмады.</div>";

  }

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  if(!currentUser){

    alert("Аккаунтқа кіріңіз.");

    return;

  }

  var ok =
    confirm("Бұл тауарды өшіруге сенімдісіз бе?");

  if(!ok){

    return;

  }

  try{

    await db.collection("products")
      .doc(id)
      .delete();

    alert("Тауар өшірілді.");

    await loadProducts();

    await showMyProducts();

  }catch(error){

    console.error(error);

    alert("Тауарды өшіру кезінде қате болды.");

  }

}


/* =========================
   MY ORDERS
========================= */

async function showMyOrders(){

  if(!currentUser){

    alert("Аккаунтқа кіріңіз.");

    return;

  }

  var extra =
    document.getElementById("sellerExtra");

  extra.innerHTML =
    "<div class='empty'>Тапсырыстар жүктелуде...</div>";

  try{

    var snapshot =
      await db.collection("orders")
        .where("sellerId","==",currentUser.uid)
        .get();

    if(snapshot.empty){

      extra.innerHTML =
        "<div class='empty'>Әзірге тапсырыс жоқ.</div>";

      return;

    }

    var orders = [];

    snapshot.forEach(function(doc){

      var data = doc.data();

      orders.push({

        id: doc.id,

        data: data

      });

    });

    orders.sort(function(a,b){

      var aTime =
        a.data.createdAt &&
        a.data.createdAt.toMillis
          ? a.data.createdAt.toMillis()
          : 0;

      var bTime =
        b.data.createdAt &&
        b.data.createdAt.toMillis
          ? b.data.createdAt.toMillis()
          : 0;

      return bTime - aTime;

    });

    var html =
      "<h3 style='margin:20px 0 10px;'>🧾 Менің тапсырыстарым</h3>";

    orders.forEach(function(order){

      var data = order.data;

      var items = data.items || [];

      var itemsHtml = "";

      items.forEach(function(item){

        itemsHtml += `
          <div style="margin:4px 0;">
            ${safe(item.name)}
            — ${Number(item.price || 0).toLocaleString("ru-RU")} ₸
          </div>
        `;

      });

      var status =
        data.status || "Жаңа";

      html += `

        <div class="order-card">

          <strong>
            👤 ${safe(data.customerName || "")}
          </strong>

          <div style="margin-top:6px;">
            📞 ${safe(data.customerPhone || "")}
          </div>

          <div style="margin-top:6px;">
            📍 ${safe(data.customerAddress || "")}
          </div>

          <div style="margin-top:10px;">
            ${itemsHtml}
          </div>

          <div style="font-weight:bold;margin-top:10px;">
            Жалпы:
            ${Number(data.total || 0).toLocaleString("ru-RU")} ₸
          </div>

          <div class="status">
            ${safe(status)}
          </div>

          <div style="margin-top:10px;">

            <button
              class="main-btn"
              onclick="updateOrderStatus('${order.id}','Қабылданды')">
              Қабылдау
            </button>

            <button
              class="gray-btn"
              onclick="updateOrderStatus('${order.id}','Жолда')">
              Жолда
            </button>

            <button
              class="gray-btn"
              onclick="updateOrderStatus('${order.id}','Жеткізілді')">
              Жеткізілді
            </button>

          </div>

        </div>

      `;

    });

    extra.innerHTML = html;

  }catch(error){

    console.error(error);

    extra.innerHTML =
      "<div class='empty'>Тапсырыстарды жүктеу кезінде қате болды.</div>";

  }

}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(id,status){

  if(!currentUser){

    alert("Аккаунтқа кіріңіз.");

    return;

  }

  try{

    await db.collection("orders")
      .doc(id)
      .update({

        status: status,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    alert("Статус өзгертілді: " + status);

    await showMyOrders();

  }catch(error){

    console.error(error);

    alert("Статусты өзгерту кезінде қате болды.");

  }

}
