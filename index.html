<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SatuGo — Қазақстан маркетплейсі</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#171717;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #eee;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#111;
  white-space:nowrap;
}

.search{
  flex:1;
  padding:12px 15px;
  border:1px solid #ddd;
  border-radius:12px;
}

.nav button{
  padding:10px 12px;
  border-radius:10px;
  background:#f2f3f5;
}

.primary{
  background:#111!important;
  color:#fff;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  padding:35px 25px;
  border-radius:22px;
  background:#fff;
  margin-bottom:18px;
}

.hero h1{
  font-size:36px;
  margin:0 0 10px;
}

.hero p{
  color:#666;
}

.categories,
.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:12px 0;
}

.filter{
  padding:10px 12px;
  border-radius:10px;
  background:#eee;
  white-space:nowrap;
}

.filter.active{
  background:#111;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  border:1px solid #eee;
  position:relative;
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.card-body{
  padding:13px;
}

.price{
  font-size:19px;
  font-weight:800;
}

.muted{
  color:#777;
  font-size:13px;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.actions button{
  padding:9px;
  border-radius:9px;
  background:#eee;
  flex:1;
}

.actions .primary{
  background:#111;
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  background:#fff;
  border-radius:20px;
  width:min(900px,96vw);
  max-height:92vh;
  overflow:auto;
  padding:22px;
}

.close{
  float:right;
  background:#eee;
  border-radius:10px;
  padding:8px 12px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin:9px 0;
}

.field label{
  display:block;
  font-size:13px;
  margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
}

.wide{
  grid-column:1/-1;
}

.product-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.product-detail img{
  width:100%;
  max-height:430px;
  object-fit:cover;
  border-radius:16px;
}

.table-wrap{
  overflow:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
  white-space:nowrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  padding:17px;
  background:#f5f5f5;
  border-radius:14px;
}

.stat b{
  font-size:22px;
  display:block;
  margin-top:6px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  z-index:100;
  display:none;
}

footer{
  text-align:center;
  padding:35px;
  color:#777;
}

@media(max-width:850px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .nav{
    flex-wrap:wrap;
  }

  .search{
    order:5;
    flex-basis:100%;
  }

  .product-detail{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){

  .grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:28px;
  }

  .row{
    grid-template-columns:1fr;
  }
}
</style>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="nav">

    <div class="logo">
      SatuGo
    </div>

    <input
      id="search"
      class="search"
      placeholder="Тауар немесе дүкен іздеу"
      oninput="renderProducts()"
    >

    <button onclick="showFavorites()">
      ❤️ <span id="favCount">0</span>
    </button>

    <button onclick="showCart()">
      🛒 <span id="cartCount">0</span>
    </button>

    <button onclick="showAccount()">
      👤 Аккаунт
    </button>

    <button
      id="sellerBtn"
      onclick="openSeller()"
      style="display:none">
      🏪 Seller
    </button>

    <button
      id="adminBtn"
      onclick="openAdmin()"
      style="display:none">
      🛡️ Admin
    </button>

  </div>

</header>


<!-- ================= MAIN ================= -->

<main class="container">

  <section class="hero">

    <h1>
      Қазақстандағы ыңғайлы маркетплейс
    </h1>

    <p>
      Сатып ал • Сат • Дүкеніңді дамыт
    </p>

    <button
      class="primary"
      style="padding:12px 18px;border-radius:11px"
      onclick="showAccount()">
      Аккаунтқа кіру
    </button>

  </section>


  <!-- CATEGORIES -->

  <div
    id="categories"
    class="categories">
  </div>


  <!-- FILTERS -->

  <div class="filters">

    <input
      id="minPrice"
      class="search"
      style="max-width:150px"
      type="number"
      placeholder="Мин ₸"
      oninput="renderProducts()"
    >

    <input
      id="maxPrice"
      class="search"
      style="max-width:150px"
      type="number"
      placeholder="Макс ₸"
      oninput="renderProducts()"
    >

    <select
      id="sort"
      class="filter"
      onchange="renderProducts()">

      <option value="new">
        Жаңа
      </option>

      <option value="cheap">
        Арзан
      </option>

      <option value="expensive">
        Қымбат
      </option>

      <option value="rating">
        Рейтинг
      </option>

    </select>

  </div>


  <h2>
    Тауарлар
  </h2>


  <div
    id="products"
    class="grid">
  </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

  SatuGo © 2026

</footer>


<!-- ================= MODAL ================= -->

<div
  id="modalOverlay"
  class="modal-overlay"
  onclick="outsideClose(event)">

  <div
    id="modal"
    class="modal">
  </div>

</div>


<!-- ================= TOAST ================= -->

<div
  id="toast"
  class="toast">
</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCj7VBpb0u5YgFqz2Mm8NhvbytX_Fs5tJE",

  authDomain:
    "satugo-c3b7c.firebaseapp.com",

  projectId:
    "satugo-c3b7c",

  storageBucket:
    "satugo-c3b7c.firebasestorage.app",

  messagingSenderId:
    "32133349747",

  appId:
    "1:32133349747:web:8df062f6428b4eb7ed8506",

  measurementId:
    "G-4PF4DV016"
};


firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.firestore();


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let user = null;

let profile = null;

let products = [];

let category = "Барлығы";

let cart =
  JSON.parse(
    localStorage.getItem("satugoCart") || "[]"
  );

let favs =
  JSON.parse(
    localStorage.getItem("satugoFavs") || "[]"
  );


/* =========================================================
   DEMO PRODUCTS
========================================================= */

const demo = [

  {
    id:"demo1",
    name:"Oversize Hoodie",
    price:15990,
    category:"Киім",
    rating:4.8,
    sellerName:"SatuGo Demo",
    sellerId:"demo",

    image:
      "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80",

    active:true
  },

  {
    id:"demo2",
    name:"Nike Style Sneakers",
    price:24990,
    category:"Аяқ киім",
    rating:4.7,
    sellerName:"SatuGo Demo",
    sellerId:"demo",

    image:
      "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80",

    active:true
  },

  {
    id:"demo3",
    name:"Smartphone",
    price:89990,
    category:"Электроника",
    rating:4.6,
    sellerName:"SatuGo Demo",
    sellerId:"demo",

    image:
      "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80",

    active:true
  },

  {
    id:"demo4",
    name:"Face Cream",
    price:12990,
    category:"Косметика",
    rating:4.9,
    sellerName:"SatuGo Demo",
    sellerId:"demo",

    image:
      "https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=800&q=80",

    active:true
  }

];


/* =========================================================
   HELPERS
========================================================= */

function esc(x=""){

  return String(x).replace(
    /[&<>"']/g,

    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );
}


function money(n){

  return Number(n || 0)
    .toLocaleString("kk-KZ");
}


function toast(message){

  const element =
    document.getElementById("toast");

  element.textContent =
    message;

  element.style.display =
    "block";

  setTimeout(
    () => {
      element.style.display =
        "none";
    },
    2200
  );
}


function openModal(html){

  document.getElementById("modal")
    .innerHTML = html;

  document.getElementById(
    "modalOverlay"
  ).style.display = "flex";
}


function closeModal(){

  document.getElementById(
    "modalOverlay"
  ).style.display = "none";
}


function outsideClose(event){

  if(
    event.target.id ===
    "modalOverlay"
  ){

    closeModal();

  }
}


function badges(){

  document.getElementById(
    "cartCount"
  ).textContent =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );

  document.getElementById(
    "favCount"
  ).textContent =
    favs.length;
}


function saveLocal(){

  localStorage.setItem(
    "satugoCart",
    JSON.stringify(cart)
  );

  localStorage.setItem(
    "satugoFavs",
    JSON.stringify(favs)
  );

  badges();
}


function requireLogin(){

  if(!user){

    showAccount();

    return false;
  }

  return true;
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function load(){

  try{

    const snapshot =
      await db
        .collection("products")
        .get();

    products = [

      ...demo,

      ...snapshot.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      )

    ];

  }catch(error){

    console.error(error);

    products =
      [...demo];

  }

  renderCategories();

  renderProducts();

  badges();
}


/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories(){

  const cats = [

    "Барлығы",
    "Киім",
    "Аяқ киім",
    "Косметика",
    "Электроника",
    "Үй"

  ];


  document.getElementById(
    "categories"
  ).innerHTML =

    cats.map(
      c => `

        <button
          class="filter ${
            category === c
              ? "active"
              : ""
          }"
          onclick="
            category='${c}';
            renderCategories();
            renderProducts();
          ">

          ${c}

        </button>

      `
    ).join("");

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

  const q =
    (
      document.getElementById(
        "search"
      ).value || ""
    ).toLowerCase();


  const min =
    Number(
      document.getElementById(
        "minPrice"
      ).value || 0
    );


  const max =
    Number(
      document.getElementById(
        "maxPrice"
      ).value ||
      Infinity
    );


  const sort =
    document.getElementById(
      "sort"
    ).value;


  let array =

    products.filter(

      p =>

        p.active !== false &&

        (
          !q ||

          `${p.name}
           ${p.category}
           ${p.sellerName}`
            .toLowerCase()
            .includes(q)
        ) &&

        (
          category === "Барлығы" ||
          p.category === category
        ) &&

        Number(p.price || 0)
          >= min &&

        Number(p.price || 0)
          <= max

    );


  if(sort === "cheap"){

    array.sort(
      (a,b) =>
        Number(a.price || 0) -
        Number(b.price || 0)
    );

  }


  if(sort === "expensive"){

    array.sort(
      (a,b) =>
        Number(b.price || 0) -
        Number(a.price || 0)
    );

  }


  if(sort === "rating"){

    array.sort(
      (a,b) =>
        Number(b.rating || 0) -
        Number(a.rating || 0)
    );

  }


  document.getElementById(
    "products"
  ).innerHTML =

    array.length

      ?

      array
        .map(card)
        .join("")

      :

      `<div class="muted">
        Тауар табылмады
       </div>`;

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function card(p){

  const liked =
    favs.includes(p.id);


  return `

    <div class="card">

      <img
        src="${
          esc(
            p.image ||
            "https://via.placeholder.com/800x600?text=SatuGo"
          )
        }"
        alt=""
      >


      <button
        style="
          position:absolute;
          right:10px;
          top:10px;
          border-radius:50%;
          padding:9px;
        "
        onclick="
          toggleFav('${p.id}')
        ">

        ${liked ? "❤️" : "🤍"}

      </button>


      <div class="card-body">

        <h3>
          ${esc(p.name)}
        </h3>


        <div class="muted">

          ${esc(p.category || "")}

          • ⭐ ${p.rating || "—"}

        </div>


        <div class="price">

          ${money(p.price)} ₸

        </div>


        <div class="muted">

          ${esc(
            p.sellerName ||
            "Дүкен"
          )}

        </div>


        <div class="actions">

          <button
            onclick="
              showProduct('${p.id}')
            ">

            Көру

          </button>


          <button
            class="primary"
            onclick="
              addCart('${p.id}')
            ">

            Себетке

          </button>

        </div>

      </div>

    </div>

  `;
}


/* =========================================================
   FIND PRODUCT
========================================================= */

function findProduct(id){

  return products.find(
    p => p.id === id
  );

}


/* =========================================================
   FAVORITES
========================================================= */

function toggleFav(id){

  if(favs.includes(id)){

    favs =
      favs.filter(
        x => x !== id
      );

  }else{

    favs.push(id);

  }

  saveLocal();

  renderProducts();
}


function showFavorites(){

  const array =
    products.filter(
      p => favs.includes(p.id)
    );


  openModal(`

    <button
      class="close"
      onclick="closeModal()">

      ✕

    </button>


    <h2>
      ❤️ Таңдаулылар
    </h2>


    <div class="grid">

      ${
        array
          .map(card)
          .join("")

        ||

        "<p>Таңдаулылар бос.</p>"
      }

    </div>

  `);

}


/* =========================================================
   CART
========================================================= */

function addCart(id){

  const product =
    findProduct(id);


  if(!product)
    return;


  const existing =
    cart.find(
      item =>
        item.id === id
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      id,

      name:
        product.name,

      price:
        Number(
          product.price || 0
        ),

      qty:1,

      sellerId:
        product.sellerId || "",

      sellerName:
        product.sellerName || ""

    });

  }


  saveLocal();

  toast(
    "🛒 Себетке қосылды"
  );

}


function showCart(){

  const total =
    cart.reduce(
      (sum,item) =>
        sum +
        item.price *
        item.qty,

      0
    );


  openModal(`

    <button
      class="close"
      onclick="closeModal()">

      ✕

    </button>


    <h2>
      🛒 Себет
    </h2>


    ${
      cart.length

      ?

      cart.map(
        (item,index) => `

          <div
            style="
              padding:12px 0;
              border-bottom:1px solid #eee
            ">

            <b>
              ${esc(item.name)}
            </b>

            <br>

            ${money(item.price)}
            ₸ × ${item.qty}


            <button
              onclick="
                cartQty(${index},-1)
              ">

              −

            </button>


            <button
              onclick="
                cartQty(${index},1)
              ">

              +

            </button>


            <button
              onclick="
                removeCart(${index})
              ">

              🗑️

            </button>

          </div>

        `
      ).join("")

      :

      "<p>Себет бос.</p>"
    }


    <h3>

      Барлығы:
      ${money(total)} ₸

    </h3>


    ${
      cart.length

      ?

      `

        <button
          class="primary"
          style="
            padding:12px;
            border-radius:10px;
            width:100%
          "
          onclick="checkout()">

          Тапсырыс беру

        </button>

      `

      :

      ""

    }

  `);

}


function cartQty(index,number){

  cart[index].qty +=
    number;


  if(cart[index].qty <= 0){

    cart.splice(
      index,
      1
    );

  }


  saveLocal();

  showCart();

}


function removeCart(index){

  cart.splice(
    index,
    1
  );

  saveLocal();

  showCart();

}


/* =========================================================
   PRODUCT
========================================================= */

function showProduct(id){

  const p =
    findProduct(id);


  if(!p)
    return;


  openModal(`

    <button
      class="close"
      onclick="closeModal()">

      ✕

    </button>


    <div class="product-detail">

      <img
        src="${esc(
          p.image || ""
        )}"
      >


      <div>

        <h2>
          ${esc(p.name)}
        </h2>


        <p>

          ${esc(
            p.description ||
            "Сапалы тауар."
          )}

        </p>


        <h2>

          ${money(p.price)} ₸

        </h2>


        <p>

          ⭐ ${p.rating || "—"}

          •

          ${esc(
            p.sellerName ||
            "Дүкен"
          )}

        </p>


        <button
          class="primary"
          style="
            padding:12px;
            border-radius:10px
          "
          onclick="
            addCart('${p.id}')
          ">

          🛒 Себетке

        </button>

      </div>

    </div>

  `);

}


/* =========================================================
   CHECKOUT
========================================================= */

function checkout(){

  if(!requireLogin())
    return;


  openModal(`

    <button
      class="close"
      onclick="closeModal()">

      ✕

    </button>


    <h2>
      📦 Тапсырыс
    </h2>


    <div class="row">


      <div class="field">

        <label>
          Аты-жөні
        </label>

        <input
          id="oName"
          value="${esc(
            profile?.name ||
            user.displayName ||
            ""
          )}"
        >

      </div>


      <div class="field">

        <label>
          Телефон
        </label>

        <input
          id="oPhone"
          value="${esc(
            profile?.phone ||
            ""
          )}"
        >

      </div>


      <div class="field wide">

        <label>
          Мекенжай
        </label>

        <textarea
          id="oAddress"
        ></textarea>

      </div>


      <div class="field">

        <label>
          Жеткізу
        </label>

        <select id="oDelivery">

          <option>
            Курьер
          </option>

          <option>
            Сам алып кету
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Төлем
        </label>

        <select id="oPayment">

          <option>
            Kaspi / онлайн
          </option>

          <option>
            Қолма-қол
          </option>

        </select>

      </div>

    </div>


    <button
      class="primary"
      style="
        padding:12px;
        border-radius:10px;
        width:100%
      "
      onclick="placeOrder()">

      Тапсырыс жасау

    </button>

  `);

}


/* =========================================================
   PLACE ORDER
========================================================= */

async function placeOrder(){

  if(!user || !cart.length)
    return;


  const name =
    document.getElementById(
      "oName"
    ).value.trim();


  const phone =
    document.getElementById(
      "oPhone"
    ).value.trim();


  const address =
    document.getElementById(
      "oAddress"
    ).value.trim();


  if(
    !name ||
    !phone ||
    !address
  ){

    toast(
      "Барлық жолды толтырыңыз"
    );

    return;
  }


  const total =
    cart.reduce(
      (sum,item) =>
        sum +
        item.price *
        item.qty,

      0
    );


  const sellerIds =
    [
      ...new Set(
        cart
          .map(
            item =>
              item.sellerId
          )
          .filter(Boolean)
      )
    ];


  try{

    await db
      .collection("orders")
      .add({

        userId:
          user.uid,

        sellerIds,

        customer:{

          name,

          phone,

          address

        },

        items:

          cart.map(
            item => ({

              productId:
                item.id,

              name:
                item.name,

              price:
                item.price,

              qty:
                item.qty,

              sellerId:
                item.sellerId,

              sellerName:
                item.sellerName

            })
          ),

        total,

        delivery:
          document.getElementById(
            "oDelivery"
          ).value,

        payment:
          document.getElementById(
            "oPayment"
          ).value,

        status:
          "pending",

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


    cart = [];

    saveLocal();

    closeModal();

    toast(
      "✅ Тапсырыс қабылданды"
    );


  }catch(error){

    console.error(error);

    toast(
      "❌ Тапсырыс қатесі"
    );

  }

}


/* =========================================================
   ACCOUNT
========================================================= */

function showAccount(){

  if(user){

    openModal(`

      <button
        class="close"
        onclick="closeModal()">

        ✕

      </button>


      <h2>
        👤 ${
          esc(
            profile?.name ||
            user.email
          )
        }
      </h2>


      <p>

        ${esc(
          user.email || ""
        )}

      </p>


      <button
        class="filter"
        onclick="showOrders()">

        📦 Тапсырыстар

      </button>


      <button
        class="filter"
        onclick="
          auth.signOut();
          closeModal();
        ">

        Шығу

      </button>

    `);

    return;
  }


  openModal(`

    <button
      class="close"

      ✕

    </button>


    <h2>
      Кіру / Тіркелу
    </h2>


    <div class="field">

      <input
        id="aEmail"
        placeholder="Email"
      >

    </div>


    <div class="field">

      >

    </div>

      </button>

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  try{

    await auth
      .signInWithEmailAndPassword(

        document.getElementById(
          "aEmail"
        ).value,

        document.getElementById(
          "aPass"
        ).value

      );


    closeModal();

    toast(
      "✅ Кірдіңіз"
    );


  }catch(error){

    console.error(error);

    toast(
      "❌ Email немесе пароль қате"
    );

  }

}


/* =========================================================
   REGISTER
========================================================= */

async function register(){

  try{

    const email =
      document.getElementById(
        "aEmail"
      ).value;


    const password =
      document.getElementById(
        "aPass"
      ).value;


    if(
      password.length < 6
    ){

      toast(
        "Пароль кемі 6 таңба"
      );

      return;
    }


    const credential =
      await auth
        .createUserWithEmailAndPassword(
          email,
          password
        );


    await db
      .collection("users")
      .doc(
        credential.user.uid
      )
      .set({

        email,

        role:
          "buyer",

        banned:
          false,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


    closeModal();

    toast(
      "✅ Аккаунт құрылды"
    );


  }catch(error){

    console.error(error);

    toast(
      "❌ Тіркелу қатесі"
    );

  }

}


/* =========================================================
   BUYER ORDERS
========================================================= */

async function showOrders(){

  if(!requireLogin())
    return;


  try{

    const snapshot =
      await db
        .collection("orders")
        .where(
          "userId",
          "==",
          user.uid
        )
        .get();


    const orders =
      snapshot.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


    openModal(`

      <button
        class="close"
        onclick="closeModal()">

        ✕

      </button>


      <h2>
        📦 Тапсырыстар
      </h2>


      ${
        orders.map(
          order => `

            <div
              style="
                padding:12px;
                border-bottom:1px solid #eee
              ">

              <b>
                #${order.id.slice(0,8)}
              </b>

              —

              ${money(
                order.total
              )} ₸


              <br>


              Статус:

              ${esc(
                order.status ||
                "pending"
              )}

            </div>

          `
        ).join("")

        ||

        "<p>Тапсырыс жоқ.</p>"
      }

    `);


  }catch(error){

    console.error(error);

    toast(
      "❌ Тапсырыстарды жүктеу қатесі"
    );

  }

}


/* =========================================================
   SELLER
========================================================= */

async function openSeller(){

  if(!user){

    showAccount();

    return;
  }


  try{

    const token =
      await user.getIdTokenResult(
        true
      );


    if(
      token.claims.role !==
        "seller" &&

      token.claims.admin !==
        true
    ){

      toast(
        "❌ Seller рұқсаты жоқ"
      );

      return;
    }


    await renderSeller();


  }catch(error){

    console.error(error);

    toast(
      "❌ Seller қатесі"
    );

  }

}


async function renderSeller(){

  const sellerProducts =
    products.filter(
      product =>
        product.sellerId ===
        user.uid
    );


  let orders = [];


  try{

    const snapshot =
      await db
        .collection("orders")
        .where(
          "sellerIds",
          "array-contains",
          user.uid
        )
        .get();


    orders =
      snapshot.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


  }catch(error){

    console.error(error);

  }


  const revenue =
    orders.reduce(
      (sum,order) =>
        sum +
        Number(
          order.total || 0
        ),

      0
    );


  openModal(`

    <button
      class="close"
      onclick="closeModal()">

      ✕

    </button>


    <h2>
      🏪 Seller кабинеті
    </h2>


    <div class="stats">

      <div class="stat">

        Тауар

        <b>
          ${sellerProducts.length}
        </b>

      </div>


      <div class="stat">

        Тапсырыс

        <b>
          ${orders.length}
        </b>

      </div>


      <div class="stat">

        Айналым

        <b>
          ${money(revenue)} ₸
        </b>

      </div>


      <div class="stat">

        Статус

        <b>
          Seller
        </b>

      </div>

    </div>


    <h3>
      Тауар қосу
    </h3>


    <div class="row">

      <input
        id="spName"
        placeholder="Тауар атауы"
      >


      <input
        id="spPrice"
        type="number"
        placeholder="Баға"
      >


      <input
        id="spCat"
        placeholder="Категория"
      >


      <input
        id="spImg"
        placeholder="Сурет URL"
      >

    </div>


    <br>


    <button
      class="primary"
      style="
        padding:11px;
        border-radius:10px
      "
      onclick="addSellerProduct()">

      + Тауар қосу

    </button>


    <h3>
      Менің тауарларым
    </h3>


    <div class="table-wrap">

      <table class="table">

        <tr>

          <th>
            Атауы
          </th>

          <th>
            Баға
          </th>

          <th>
            Әрекет
          </th>

        </tr>


        ${
          sellerProducts.map(
            p => `

              <tr>

                <td>
                  ${esc(p.name)}
                </td>

                <td>
                  ${money(p.price)} ₸
                </td>

                <td>

                  <button
                    onclick="
                      deleteSellerProduct(
                        '${p.id}'
                      )
                    ">

                    🗑️

                  </button>

                </td>

              </tr>

            `
          ).join("")
        }

      </table>

    </div>

  `);

}


async function addSellerProduct(){

  try{

    const name =
      document.getElementById(
        "spName"
      ).value.trim();


    const price =
      Number(
        document.getElementById(
          "spPrice"
        ).value
      );


    const cat =
      document.getElementById(
        "spCat"
      ).value.trim();


    const image =
      document.getElementById(
        "spImg"
      ).value.trim();


    if(
      !name ||
      !price
    ){

      toast(
        "Атау мен бағаны енгіз"
      );

      return;
    }


    await db
      .collection("products")
      .add({

        name,

        price,

        category:
          cat || "Басқа",

        image,

        sellerId:
          user.uid,

        sellerName:
          profile?.storeName ||
          profile?.name ||
          user.email,

        active:
          true,

        rating:
          0,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


    toast(
      "✅ Тауар қосылды"
    );


    await load();

    renderSeller();


  }catch(error){

    console.error(error);

    toast(
      "❌ Тауар қосу қатесі"
    );

  }

}


async function deleteSellerProduct(id){

  if(
    !confirm(
      "Тауарды өшіру керек пе?"
    )
  ){

    return;
  }


  try{

    await db
      .collection("products")
      .doc(id)
      .update({

        active:
          false

      });


    toast(
      "Өшірілді"
    );


    await load();

    renderSeller();


  }catch(error){

    console.error(error);

    toast(
      "❌ Қате"
    );

  }

}


/* =========================================================
   ADMIN
========================================================= */

async function openAdmin(){

  if(!user){

    showAccount();

    return;
  }


  try{

    const token =
      await user.getIdTokenResult(
        true
      );


    if(
      token.claims.admin !==
      true
    ){

      toast(
        "❌ Admin рұқсаты жоқ"
      );

      return;
    }


    const [

      usersSnapshot,

      storesSnapshot,

      productsSnapshot,

      ordersSnapshot

    ] =

      await Promise.all([

        db
          .collection("users")
          .get(),

        db
          .collection("stores")
          .get(),

        db
          .collection("products")
          .get(),

        db
          .collection("orders")
          .limit(300)
          .get()

      ]);


    const users =
      usersSnapshot.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


    const stores =
      storesSnapshot.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


    const prods =
      productsSnapshot.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


    const orders =
      ordersSnapshot.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


    openModal(`

      <button
        class="close"
        onclick="closeModal()">

        ✕

      </button>


      <h2>
        🛡️ SatuGo Admin
      </h2>


      <div class="stats">

        <div class="stat">

          Users

          <b>
            ${users.length}
          </b>

        </div>


        <div class="stat">

          Stores

          <b>
            ${stores.length}
          </b>

        </div>


        <div class="stat">

          Products

          <b>
            ${prods.length}
          </b>

        </div>


        <div class="stat">

          Orders

          <b>
            ${orders.length}
          </b>

        </div>

      </div>


      <h3>
        👤 Қолданушылар
      </h3>


      <div class="table-wrap">

        <table class="table">

          <tr>

            <th>
              Email
            </th>

            <th>
              Рөл
            </th>

            <th>
              Статус
            </th>

            <th>
              Әрекет
            </th>

          </tr>


          ${
            users.map(
              u => `

                <tr>

                  <td>
                    ${esc(
                      u.email || "-"
                    )}
                  </td>

                  <td>
                    ${esc(
                      u.role ||
                      "buyer"
                    )}
                  </td>

                  <td>

                    ${
                      u.banned
                      ? "🚫"
                      : "✅"
                    }

                  </td>

                  <td>

                    <button
                      onclick="
                        adminBan(
                          '${u.id}',
                          ${!u.banned}
                        )
                      ">

                      ${
                        u.banned
                        ? "Unban"
                        : "Ban"
                      }

                    </button>


                    <button
                      onclick="
                        adminSeller(
                          '${u.id}'
                        )
                      ">

                      Seller

                    </button>

                  </td>

                </tr>

              `
            ).join("")
          }

        </table>

      </div>


      <h3>
        🏪 Дүкендер
      </h3>


      <div class="table-wrap">

        <table class="table">

          <tr>

            <th>
              Дүкен
            </th>

            <th>
              Owner
            </th>

            <th>
              Verified
            </th>

            <th>
              Әрекет
            </th>

          </tr>


          ${
            stores.map(
              s => `

                <tr>

                  <td>
                    ${esc(
                      s.name || "-"
                    )}
                  </td>

                  <td>
                    ${esc(
                      s.ownerId || "-"
                    )}
                  </td>

                  <td>

                    ${
                      s.verified
                      ? "✅"
                      : "⏳"
                    }

                  </td>

                  <td>

                    <button
                      onclick="
                        verifyStore(
                          '${s.id}',
                          ${!s.verified}
                        )
                      ">

                      ${
                        s.verified
                        ? "Алу"
                        : "Растау"
                      }

                    </button>

                  </td>

                </tr>

              `
            ).join("")
          }

        </table>

      </div>

    `);


  }catch(error){

    console.error(error);

    toast(
      "❌ Admin қатесі"
    );

  }

}


/* =========================================================
   ADMIN USER ACTIONS
========================================================= */

async function adminBan(
  id,
  value
){

  try{

    await db
      .collection("users")
      .doc(id)
      .update({

        banned:
          value

      });


    toast(
      value
      ? "🚫 Block"
      : "✅ Unblock"
    );


    openAdmin();


  }catch(error){

    console.error(error);

    toast(
      "❌ Қате"
    );

  }

}


async function adminSeller(id){

  try{

    await db
      .collection("users")
      .doc(id)
      .update({

        role:
          "seller",

        sellerApproved:
          true

      });


    toast(
      "🏪 Seller берілді"
    );


    openAdmin();


  }catch(error){

    console.error(error);

    toast(
      "❌ Қате"
    );

  }

}


/* =========================================================
   STORE VERIFICATION
========================================================= */

async function verifyStore(
  id,
  value
){

  try{

    await db
      .collection("stores")
      .doc(id)
      .update({

        verified:
          value

      });


    toast(
      value
      ? "✅ Расталды"
      : "Растау алынды"
    );


    openAdmin();


  }catch(error){

    console.error(error);

    toast(
      "❌ Қате"
    );

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

auth.onAuthStateChanged(
  async currentUser => {

    user =
      currentUser;

    profile =
      null;


    if(user){

      try{

        const snapshot =
          await db
            .collection("users")
            .doc(user.uid)
            .get();


        profile =
          snapshot.exists
          ? snapshot.data()
          : null;


        const token =
          await user
            .getIdTokenResult(
              true
            );


        const isSeller =
          token.claims.role ===
          "seller";


        const isAdmin =
          token.claims.admin ===
          true;


        document.getElementById(
          "sellerBtn"
        ).style.display =

          (
            isSeller ||
            isAdmin
          )

          ? "block"
          : "none";


        document.getElementById(
          "adminBtn"
        ).style.display =

          isAdmin
          ? "block"
          : "none";


      }catch(error){

        console.error(error);

      }


    }else{

      document.getElementById(
        "sellerBtn"
      ).style.display =
        "none";


      document.getElementById(
        "adminBtn"
      ).style.display =
        "none";

    }

  }
);


/* =========================================================
   START

load();

badges();

</script>
