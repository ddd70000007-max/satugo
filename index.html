function normalizeSearchText(v){
  return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/і/g,'и').replace(/ң/g,'н').replace(/ғ/g,'г').replace(/қ/g,'к').replace(/ұ/g,'у').replace(/ү/g,'у').replace(/һ/g,'х').replace(/[“”«»]/g,'"').replace(/[^a-zа-яәіңғқөұүһ0-9+\s-]/gi,' ').replace(/\s+/g,' ').trim();
}
function searchNumber(v){
  const x=String(v||'').replace(/\s/g,'').replace(',','.');
  const n=Number(x); return Number.isFinite(n)?n:0;
}
function parseSmartQuery(raw){
  const text=String(raw||'').trim();
  const ntext=normalizeSearchText(text);
  const upper=text.toUpperCase();
  let maxPrice=null;
  let priceLabel='';
  let priceMatch=text.match(/(\d[\d\s.,]*)\s*(мың|млн|k|K)?\s*(?:тг|₸|тенге)?\s*(?:дейін|дeиiн|аспасын|аспайды|қымбат\s*емес|артық\s*емес|максимум|<=)/i);
  if(priceMatch){
    let n=searchNumber(priceMatch[1]);
    const unit=(priceMatch[2]||'').toLowerCase();
    if(unit==='мың'||unit==='k')n*=1000;
    if(unit==='млн')n*=1000000;
    if(n>0){maxPrice=Math.round(n);priceLabel=maxPrice.toLocaleString('kk-KZ')+' ₸ дейін';}
  }
  if(maxPrice===null){
    const standalone=text.match(/(?:бағасы\s*)?(\d[\d\s]{3,})\s*(?:₸|тг|тенге)/i);
    if(standalone){const n=searchNumber(standalone[1]);if(n>0){maxPrice=n;priceLabel=maxPrice.toLocaleString('kk-KZ')+' ₸ дейін';}}
  }

  const sizePatterns=[/\b(XXXL|XXL|XL|XS|S|M|L)\s*(?:РАЗМЕР|ӨЛШЕМ)?\b/i,/(?:размер|өлшем|size)\s*[:\-]?\s*(XXXL|XXL|XL|XS|S|M|L|\d{2})\b/i];
  let size='';
  for(const re of sizePatterns){const m=upper.match(re);if(m){size=(m[1]||'').toUpperCase();break;}}
  if(!size){const m=upper.match(/\b(XXXL|XXL|XL|XS|S|M|L)\b/);if(m)size=m[1];}

  let shoeSize='';
  const shoeM=upper.match(/(?:аяқ\s*киім|кроссовка|кроссовка|ботинка|туфли|аяқ)\D{0,12}(\d{2})\s*(?:РАЗМЕР|ӨЛШЕМ)?/i) || upper.match(/(?:размер|өлшем)\s*(\d{2})\b/i);
  if(shoeM)shoeSize=shoeM[1];

  const colorMap={
    'қара':'қара','black':'қара',
    'ақ':'ақ','белый':'ақ','white':'ақ',
    'қызыл':'қызыл','красный':'қызыл','red':'қызыл',
    'көк':'көк','синий':'көк','blue':'көк',
    'жасыл':'жасыл','зеленый':'жасыл','green':'жасыл',
    'сары':'сары','желтый':'сары','yellow':'сары',
    'қоңыр':'қоңыр','коричневый':'қоңыр','brown':'қоңыр',
    'сұр':'сұр','серый':'сұр','gray':'сұр','grey':'сұр',
    'қызғылт':'қызғылт','розовый':'қызғылт','pink':'қызғылт'
  };
  let color='';
  for(const k of Object.keys(colorMap)){if(ntext.includes(k)){color=colorMap[k];break;}}

  const cats=[
    {name:'Аяқ киім',words:['аяк киім','аяқ киім','кроссовка','кроссовки','ботинка','туфли','сандал','бәтеңке','кеды']},
    {name:'Киім',words:['киім','худи','худи','футболка','жейде','көйлeк','көлек','көйлек','куртка','күрте','шалбар','джинсы','свитер','пальто','жакет']},
    {name:'Косметика',words:['косметика','парфюм','әтір','иіссу','крем','макияж','бьюти']},
    {name:'Электрон',words:['электрон','телефон','смартфон','ноутбук','құлаққап','наушник','сағат','планшет','проектор','принтер','блендер','шам','led','техника']}
  ];
  let category='';
  for(const c of cats){if(c.words.some(w=>ntext.includes(w))){category=c.name;break;}}

  let gender='';
  if(/әйел|қызға|әйелдер/.test(ntext))gender='әйелдер';
  else if(/ерлер|ер адам|жігітке|ұлға/.test(ntext))gender='ерлер';
  else if(/бала|балалар|ұл|қыз бала/.test(ntext))gender='балалар';

  const gift=/сыйлық|сыйга|сыйлыққа|подарок|gift/.test(ntext);
  const interesting=/ерекше|қызық|креатив|ерекше зат|необычный|прикол/.test(ntext);

  const stop=['маған','керек','ізде','іздеу','тауып','бер','тауар','тауарлар','зат','заттар','бағасы','баға','дейін','мыңға','мың','теңге','тг','₸','размер','өлшем','өлшемі','size','үшін','алып','алғым','келеді','деймін','бар','болсын','және','мен','ге','ға','қа','ке','дей','аспайды','артық','емес','қымбат','максимум','сыйлық','ерекше'];
  const rawTokens=ntext.split(' ');
  const keywords=[];
  for(const token of rawTokens){
    if(token.length<2)continue;
    if(stop.includes(token))continue;
    if(/^\d+$/.test(token))continue;
    if(['xs','s','m','l','xl','xxl','xxxl'].includes(token))continue;
    if(Object.keys(colorMap).includes(token))continue;
    if(cats.some(c=>c.words.includes(token)))continue;
    keywords.push(token);
  }

  return {raw:text,maxPrice,size,shoeSize,color,category,gender,gift,interesting,keywords};
}
function productSearchText(p){
  return normalizeSearchText([
    p.name,p.title,p.cat,p.category,p.sellerName,p.seller,p.description,
    p.brand,p.color,p.colors,p.size,p.sizes,p.tags,p.keywords,p.gender,p.sex,p.city
  ].flat().join(' '));
}
function productSizes(p){
  const a=[];
  const add=v=>{if(v===undefined||v===null)return;String(v).split(/[ ,;/]+/).forEach(x=>{const y=x.trim().toUpperCase();if(y)a.push(y)});};
  add(p.size);add(p.sizes);add(p.availableSizes);add(p.variants?.sizes);
  return [...new Set(a)];
}
function productColors(p){
  const a=[];
  const add=v=>{if(v===undefined||v===null)return;String(v).split(/[ ,;/]+/).forEach(x=>{const y=normalizeSearchText(x.trim());if(y)a.push(y)});};
  add(p.color);add(p.colors);add(p.availableColors);add(p.variants?.colors);
  return [...new Set(a)];
}
function smartRank(p,q){
  const text=productSearchText(p);
  let score=0;
  const hasCategory=!!q.category;
  if(hasCategory && normalizeSearchText(p.cat||p.category||'').includes(normalizeSearchText(q.category)))score+=60;
  if(q.color && productColors(p).some(c=>c.includes(q.color)))score+=25;
  if(q.size){if(productSizes(p).includes(q.size))score+=35;else if(!productSizes(p).length && text.includes(q.size.toLowerCase()))score+=5;}
  if(q.shoeSize){if(productSizes(p).includes(q.shoeSize))score+=40;else if(text.includes(q.shoeSize))score+=5;}
  if(q.gender && normalizeSearchText(p.gender||p.sex||'').includes(q.gender))score+=15;
  if(q.gift && p.specialType==='gift')score+=50;
  if(q.interesting && p.special)score+=25;
  for(const k of q.keywords){if(text.includes(k))score+=12;}
  if(q.maxPrice!==null){if(Number(p.price||0)<=q.maxPrice)score+=20;else score-=45;}
  return score;
}
function smartProductMatches(p,q){
  const text=productSearchText(p);
  if(q.maxPrice!==null && Number(p.price||0)>q.maxPrice)return false;
  if(q.category){const pc=normalizeSearchText(p.cat||p.category||'');if(!pc.includes(normalizeSearchText(q.category))){if(!(text.includes(normalizeSearchText(q.category))))return false;}}
  if(q.color){const colors=productColors(p);if(colors.length && !colors.some(c=>c.includes(q.color)))return false; if(!colors.length && !text.includes(q.color))return false;}
  if(q.size){const sizes=productSizes(p);if(sizes.length && !sizes.includes(q.size))return false; if(!sizes.length && !text.includes(q.size.toLowerCase()))return false;}
  if(q.shoeSize){const sizes=productSizes(p);if(sizes.length && !sizes.includes(q.shoeSize))return false; if(!sizes.length && !text.includes(q.shoeSize))return false;}
  if(q.gender){const pg=normalizeSearchText(p.gender||p.sex||'');if(pg && !pg.includes(q.gender) && !text.includes(q.gender))return false;}
  const meaningful=q.keywords.filter(k=>k.length>2);
  if(!q.category&&!q.maxPrice&& !q.size&&!q.shoeSize&&!q.color && !meaningful.length)return true;
  if(meaningful.length && !meaningful.some(k=>text.includes(k)) && !q.category && q.maxPrice===null && !q.size&&!q.shoeSize&&!q.color)return false;
  return true;
}

function renderFav(){const arr=state.products.filter(p=>state.favorites.includes(p.id));return `<div class="sectionhead"><h2>Таңдаулы</h2></div>${arr.length?`<div class="grid">${arr.map(renderCard).join('')}</div>`:'<div class="empty">Таңдаулы тауар жоқ.<br>Ұнаған тауардағы ♡ батырмасын басыңыз.</div>'}`}
function renderChats(){
  const app=document.getElementById('app'),uid=state.currentUser?.id;
  if(!uid){app.innerHTML='<div class="sectionhead"><h2>💬 Чаттар</h2></div><div class="empty">Чаттарды көру үшін аккаунтқа кіріңіз.</div>';return}
  if(!fbReady||!fbDb){app.innerHTML='<div class="sectionhead"><h2>💬 Чаттар</h2></div><div class="empty">Firebase қосылмаған.</div>';return}
  app.innerHTML='<div class="sectionhead"><h2>💬 Чаттар</h2></div><div class="empty">Чаттар жүктелуде...</div>';
  fbDb.collection('chats').where('participants','array-contains',uid).get().then(snap=>{
    const arr=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));
    state.chats=arr;save();
    app.innerHTML='<div class="sectionhead"><h2>💬 Чаттар</h2><span class="muted">'+arr.length+'</span></div>'+(arr.length?'<div class="list">'+arr.map(c=>{const otherId=(c.participants||[]).find(x=>x!==uid);const other=c.participantNames?.[otherId]||(c.buyerId===uid?c.sellerName:c.buyerName)||'Сатушы';const unread=c.unread?.[uid]||0;return '<button class="item" data-chat="'+esc(c.id)+'" style="text-align:left;border:1px solid #e5e7eb"><b>💬 '+esc(other)+'</b><div class="muted">'+esc(c.lastMessage||'Чат ашылды')+(unread?' <span class="badge">'+unread+'</span>':'')+'</div></button>'}).join('')+'</div>':'<div class="empty">Әзірге чат жоқ.<br>Тауарды ашып, «Сатушымен чат» батырмасын басыңыз.</div>');updateBadges();
  }).catch(e=>{console.error(e);app.innerHTML='<div class="sectionhead"><h2>💬 Чаттар</h2></div><div class="empty">Чаттарды жүктеу қатесі:<br>'+esc(e.code==='permission-denied'?'Firebase Rules тексеріңіз':e.message)+'</div>'});
}
async function startChat(p){
  const uid=state.currentUser?.id||fbAuth?.currentUser?.uid;
  if(!uid){closeModal();openLogin();return}
  if(!p||!p.sellerId||p.sellerId==='platform'){toast('Бұл тауардың жеке сатушысы жоқ');return}
  if(p.sellerId===uid){toast('Өз тауарыңызға чат аша алмайсыз');return}
  if(!fbReady||!fbDb){toast('Firebase Firestore қосылмаған');return}
  const id='chat_'+[uid,p.sellerId].sort().join('_');
  try{
    await fbDb.collection('chats').doc(id).set({participants:[uid,p.sellerId],participantNames:{[uid]:state.currentUser?.name||'Пайдаланушы',[p.sellerId]:p.sellerName||'Сатушы'},buyerId:uid,buyerName:state.currentUser?.name||'Пайдаланушы',sellerId:p.sellerId,sellerName:p.sellerName||'Сатушы',lastMessage:'',unread:{[uid]:0,[p.sellerId]:0},updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    closeModal();await openChat(id);
  }catch(e){console.error(e);toast('Чатты ашу қатесі: '+(e.code==='permission-denied'?'Firebase Rules тексеріңіз':e.message))}
}
let chatUnsubscribe=null;
async function openChat(id){
  const uid=state.currentUser?.id||fbAuth?.currentUser?.uid;
  if(!uid){openLogin();return}
  if(!fbReady||!fbDb){toast('Firebase Firestore қосылмаған');return}
  try{
    const ref=fbDb.collection('chats').doc(id),snap=await ref.get();
    if(!snap.exists){toast('Чат табылмады');return}
    const c={id:snap.id,...snap.data()};
    if(!(c.participants||[]).includes(uid)){toast('Чатқа рұқсат жоқ');return}
    activeChat=id;
    const otherId=c.participants.find(x=>x!==uid);
    const title=c.participantNames?.[otherId]||(c.buyerId===uid?c.sellerName:c.buyerName)||'Чат';
    await ref.set({unread:{...(c.unread||{}),[uid]:0}},{merge:true});
    openModal('<div class="modaltop"><h2>💬 '+esc(title)+'</h2><button class="close" id="close">×</button></div><div class="chatbox"><div class="msgs" id="msgs"><div class="muted">Жүктелуде...</div></div><div class="chatinput"><input id="chatText" placeholder="Хабарлама..." autocomplete="off"><button class="primary" id="sendChat">Жіберу</button></div></div>');
    document.getElementById('close').onclick=closeModal;
    document.getElementById('sendChat').onclick=sendChat;
    document.getElementById('chatText').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}});
    if(chatUnsubscribe)chatUnsubscribe();
    chatUnsubscribe=ref.collection('messages').orderBy('createdAt','asc').limitToLast(100).onSnapshot(s=>{const box=document.getElementById('msgs');if(!box)return;box.innerHTML=s.empty?'<div class="muted">Хабарлама жоқ.</div>':s.docs.map(d=>{const m=d.data()||{};return '<div class="msg '+(m.senderId===uid?'mine':'theirs')+'">'+esc(m.text||'')+'</div>'}).join('');box.scrollTop=box.scrollHeight},e=>{const box=document.getElementById('msgs');if(box)box.innerHTML='<div class="muted">Хабарламаларды ашу қатесі: '+esc(e.code==='permission-denied'?'Firebase Rules тексеріңіз':e.message)+'</div>'});
  }catch(e){console.error(e);toast('Чатты ашу қатесі: '+e.message)}
}
async function sendChat(){
  const input=document.getElementById('chatText'),text=input?.value.trim(),uid=state.currentUser?.id||fbAuth?.currentUser?.uid;
  if(!text||!activeChat||!uid||!fbReady||!fbDb)return;
  try{
    const ref=fbDb.collection('chats').doc(activeChat),snap=await ref.get();
    if(!snap.exists){toast('Чат табылмады');return}
    const c=snap.data();if(!(c.participants||[]).includes(uid)){toast('Чатқа рұқсат жоқ');return}
    await ref.collection('messages').add({senderId:uid,senderName:state.currentUser?.name||'Пайдаланушы',text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    const unread={...(c.unread||{})},other=(c.participants||[]).find(x=>x!==uid);if(other)unread[other]=(unread[other]||0)+1;
    await ref.set({lastMessage:text,lastSenderId:uid,unread,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});input.value='';
  }catch(e){console.error(e);toast('Хабарлама жіберу қатесі: '+(e.code==='permission-denied'?'Firebase Rules тексеріңіз':e.message))}
}

      <button id="accountFavorites"><span class="mi">♡</span><span><b>Таңдаулылар</b><br><span class="muted">Сақталған тауарлар</span></span></button>
      <button id="accountChats"><span class="mi">💬</span><span><b>Чаттар</b><br><span class="muted">Сатушылармен сөйлесу</span></span></button>
      <button id="accountSecurity"><span class="mi">🔐</span><span><b>Қауіпсіздік</b><br><span class="muted">Аккаунт және телефон арқылы кіру</span></span></button>
    </div>

    ${orders.length?`<div class="list">${orders.map(o=>`<div class="item"><b>Тапсырыс #${esc(o.id.slice(-6))}</b><div>${money(o.total)} · ${esc(o.status)}</div><div class="muted">${esc(o.address)}</div></div>`).join('')}</div>`:'<div class="empty">Тапсырыс әлі жоқ.</div>'}`;

function render(){const app=document.getElementById('app');if(page==='home')app.innerHTML=renderHome();if(page==='search')app.innerHTML=renderSearch();if(page==='favorites')app.innerHTML=renderFav();if(page==='chats'){renderChats();}if(page==='account')app.innerHTML=renderAccount();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));updateBadges();bindSmartSearchTools()};setTimeout(applyLanguage,0)
function updateBadges(){document.getElementById('cartCount').textContent=state.cart.reduce((s,x)=>s+x.qty,0);const f=document.getElementById('favBadge');f.textContent=state.favorites.length;f.classList.toggle('hidden',!state.favorites.length);const uid=state.currentUser?.id;const n=uid?state.chats.reduce((s,c)=>s+(c.unread?.[uid]||0),0):0;const b=document.getElementById('chatBadge');b.textContent=n;b.classList.toggle('hidden',!n)}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show');setTimeout(applyLanguage,0)}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('sheet').innerHTML='';selectedProduct=null;activeChat=null}
function openProduct(id){const p=getProduct(id);if(!p){toast('Тауар дерегі табылмады');return}selectedProduct=p;const reviews=state.reviews.filter(r=>r.productId===p.id);openModal(`<div class="modaltop"><h2>${esc(p.name)}</h2><button class="close" id="close">×</button></div><div class="productdetail"><div>${img(p.image,'🛍️','bigpic')}</div><div>${p.special?`<div class="special-label">✨ ${p.specialType==='eye'?'👀 Көзге түсетін':p.specialType==='gift'?'🎁 Сыйлық':'🤯 Қызық зат'}</div>`:''}<div class="price">${money(p.price)}</div><div class="muted">${esc(p.cat)} · ${esc(p.sellerName||'Сатушы')}</div><p>${esc(p.description||'Бұл тауар туралы толық ақпаратты сатушыдан сұрауға болады.')}</p><div class="actions"><button class="primary" id="detailCart">Себетке қосу</button><button class="secondary" id="detailChat">Сатушымен чат</button></div><div class="sectionhead"><h3>Пікірлер</h3></div>${reviews.length?reviews.map(r=>`<div class="review"><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span><br><b>${esc(r.userName)}</b><div>${esc(r.text)}</div></div>`).join(''):'<div class="muted">Пікір әзірге жоқ.</div>'}</div></div>`);document.getElementById('close').onclick=closeModal;document.getElementById('detailCart').onclick=()=>{addCart(p.id);closeModal()};document.getElementById('detailChat').onclick=()=>{if(p.sellerId==='platform'){toast('Бұл SatuGo платформасының тауары');return}startChat(p)} }
function addCart(id){const p=getProduct(id);if(!p)return;const x=state.cart.find(i=>i.productId===id);if(x)x.qty++;else state.cart.push({productId:id,qty:1});save();toast('Себетке қосылды')}
function toggleFav(id){const i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();render()}
function openCart(){const rows=state.cart.map(i=>({...i,p:getProduct(i.productId)})).filter(x=>x.p);const total=rows.reduce((s,x)=>s+x.p.price*x.qty,0);openModal(`<div class="modaltop"><h2>🛒 Себет</h2><button class="close" id="close">×</button></div>${rows.length?`<div class="list">${rows.map(x=>`<div class="item"><b>${esc(x.p.name)}</b><div>${money(x.p.price)} × ${x.qty}</div><div class="actions"><button class="secondary" data-minus="${x.p.id}">−</button><button class="secondary" data-plus="${x.p.id}">+</button><button class="danger" data-remove="${x.p.id}">Жою</button></div></div>`).join('')}</div><div class="sectionhead"><b>Барлығы</b><b>${money(total)}</b></div><button class="primary" id="checkoutBtn">Тапсырыс беру</button>`:'<div class="empty">Себет бос.</div>'}`);document.getElementById('close').onclick=closeModal;document.getElementById('checkoutBtn')?.addEventListener('click',checkout);document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(x=>x.productId!==b.dataset.remove);save();openCart()})}
function changeQty(id,d){const x=state.cart.find(i=>i.productId===id);if(!x)return;x.qty+=d;if(x.qty<1)state.cart=state.cart.filter(i=>i!==x);save();openCart()}
function checkout(){if(!state.currentUser){closeModal();openLogin();return}const rows=state.cart.map(i=>({...i,p:getProduct(i.productId)})).filter(x=>x.p);if(!rows.length)return;const total=rows.reduce((s,x)=>s+x.p.price*x.qty,0);openModal(`<div class="modaltop"><h2>Тапсырыс беру</h2><button class="close" id="close">×</button></div><div class="field"><label>Аты-жөніңіз</label><input id="ordName" value="${esc(state.currentUser.name)}"></div><div class="field"><label>Телефон</label><input id="ordPhone" value="${esc(state.currentUser.phone||'')}"></div><div class="field"><label>Мекенжай</label><textarea id="ordAddress" rows="3" placeholder="Қала, көше, үй, пәтер"></textarea></div><div class="sectionhead"><b>Төлем сомасы</b><b>${money(total)}</b></div><button class="primary" id="placeOrder">Тапсырысты растау</button>`);document.getElementById('close').onclick=closeModal;document.getElementById('placeOrder').onclick=placeOrder}
function placeOrder(){const name=document.getElementById('ordName').value.trim(),phone=document.getElementById('ordPhone').value.trim(),address=document.getElementById('ordAddress').value.trim();if(!name||!phone||!address){toast('Барлық өрісті толтырыңыз');return}const items=state.cart.map(i=>({...i,p:getProduct(i.productId)})).filter(x=>x.p);const total=items.reduce((s,x)=>s+x.p.price*x.qty,0);const sellerIds=[...new Set(items.map(x=>x.p.sellerId).filter(x=>x&&x!=='platform'))];const o={id:'o_'+Date.now(),buyerId:state.currentUser.id,buyerName:name,phone,address,items:items.map(x=>({productId:x.p.id,name:x.p.name,price:x.p.price,qty:x.qty,sellerId:x.p.sellerId})),sellerIds,total,status:'Жаңа тапсырыс',createdAt:Date.now()};state.orders.unshift(o);state.currentUser.name=name;state.currentUser.phone=phone;state.cart=[];save();closeModal();toast('Тапсырыс қабылданды');render()}
function normalizePhone(v){let x=String(v||'').replace(/[^0-9+]/g,'');if(x.startsWith('8'))x='+7'+x.slice(1);if(!x.startsWith('+7')&&x.startsWith('7'))x='+'+x;return x}
async function passHash(v){const data=new TextEncoder().encode(String(v));const buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function validPhone(v){return /^\+7\d{10}$/.test(normalizePhone(v))}
function openLogin(){
  if(!fbReady){toast('Firebase қосылмаған');return}
  let mode='login',step=1;
  const draw=()=>{
    openModal(`<div class="modaltop"><h2>${mode==='login'?'Кіру':'Тіркелу'}</h2><button class="close" id="close">×</button></div>
      <div class="actions"><button class="${mode==='login'?'primary':'secondary'}" id="modeLogin">Кіру</button><button class="${mode==='register'?'primary':'secondary'}" id="modeRegister">Тіркелу</button></div>
      ${step===1?`<div class="field"><label>Қазақстан телефоны</label><input id="authPhone" inputmode="tel" autocomplete="tel" placeholder="+7 700 000 00 00"></div><div id="recaptcha-container"></div><button class="primary" id="sendCode">SMS код жіберу</button>`:
      `<div class="field"><label>SMS код</label><input id="authCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6 таңбалы код"></div>${mode==='register'?`<div class="field"><label>Аты-жөніңіз</label><input id="authName" autocomplete="name" placeholder="Аты-жөніңіз"></div>`:''}<button class="primary" id="verifyCode">Растау және ${mode==='login'?'кіру':'тіркелу'}</button>`}
      <p class="muted">SMS арқылы Firebase аккаунтымен кіру. +7 нөмірі қажет.</p>`);
    document.getElementById('close').onclick=closeModal;
    document.getElementById('modeLogin').onclick=()=>{mode='login';step=1;draw()};
    document.getElementById('modeRegister').onclick=()=>{mode='register';step=1;draw()};
    if(step===1){
      const inp=document.getElementById('authPhone');
      inp.addEventListener('input',e=>{let v=e.target.value.replace(/[^0-9+]/g,'');if(v.startsWith('8'))v='+7'+v.slice(1);if(v.startsWith('7')&&!v.startsWith('+7'))v='+'+v;e.target.value=v});
      document.getElementById('sendCode').onclick=async()=>{
        const phone=normalizePhone(inp.value.trim());
        if(!validPhone(phone)){toast('Телефонды +7XXXXXXXXXX форматында енгізіңіз');return}
        try{
          if(recaptchaVerifier){try{recaptchaVerifier.clear()}catch(_) {}}
          recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'normal'});
          await recaptchaVerifier.render();
          phoneConfirmation=await fbAuth.signInWithPhoneNumber(phone,recaptchaVerifier);
          step=2;draw();toast('SMS код жіберілді');
        }catch(e){console.error(e);toast('SMS жіберілмеді: Firebase Phone Auth баптауын тексеріңіз')}
      };
    }else{
      document.getElementById('verifyCode').onclick=async()=>{
        const code=document.getElementById('authCode').value.trim();
        if(!/^\d{6}$/.test(code)){toast('6 таңбалы код енгізіңіз');return}
        try{
          const result=await phoneConfirmation.confirm(code),u=result.user;
          const name=mode==='register'?document.getElementById('authName').value.trim():(u.displayName||'Пайдаланушы');
          if(mode==='register'&&!name){toast('Аты-жөніңізді енгізіңіз');return}
          if(name&&u.displayName!==name)await u.updateProfile({displayName:name});
          await fbDb.collection('users').doc(u.uid).set({name:name||'Пайдаланушы',phone:u.phoneNumber||'',role:'buyer',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
          state.currentUser={id:u.uid,name:name||'Пайдаланушы',phone:u.phoneNumber||'',firebase:true};save();closeModal();render();toast(mode==='login'?'Сәтті кірдіңіз':'Аккаунт ашылды');
        }catch(e){console.error(e);toast('SMS коды қате немесе мерзімі өтті')}
      };
    }
  };
  draw();
}

/* =========================================================
   VOICE SEARCH
========================================================= */
let voiceRecognition=null;
let voiceListening=false;

function getVoiceRecognition(){
  return window.SpeechRecognition||window.webkitSpeechRecognition||null;
}

function startVoiceSearch(button=null){
  const SR=getVoiceRecognition();
  if(!SR){
    toast('Бұл браузерде дауыспен іздеу қолжетімсіз');
    return;
  }

  if(voiceListening){
    try{voiceRecognition?.stop()}catch(_){ }
    return;
  }

  voiceRecognition=new SR();
  voiceRecognition.lang='kk-KZ';
  voiceRecognition.interimResults=true;
  voiceRecognition.continuous=false;
  voiceListening=true;

  if(button)button.classList.add('listening');
  const topBtn=document.getElementById('voiceBtn');
  if(topBtn)topBtn.classList.add('listening');
  toast('🎤 Тыңдап тұрмын...');

  voiceRecognition.onresult=e=>{
    let text='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      text+=e.results[i][0].transcript+' ';
    }
    text=text.trim();
    const input=document.getElementById('searchInput');
    if(input)input.value=text;
    const pageInput=document.getElementById('searchPageInput');
    if(pageInput)pageInput.value=text;
  };

  voiceRecognition.onend=()=>{
    voiceListening=false;
    if(button)button.classList.remove('listening');
    const topBtn=document.getElementById('voiceBtn');
    if(topBtn)topBtn.classList.remove('listening');
    const text=(document.getElementById('searchInput')?.value||'').trim();
    if(text){
      page='search';
      render();
      toast('🔎 Дауыстық сұраныс бойынша ізделді');
    }
  };

  voiceRecognition.onerror=e=>{
    console.warn('Voice search:',e);
    voiceListening=false;
    if(button)button.classList.remove('listening');
    const topBtn=document.getElementById('voiceBtn');
    if(topBtn)topBtn.classList.remove('listening');
    toast(e.error==='not-allowed'?'Микрофонға рұқсат беріңіз':'Дауысты тану кезінде қате шықты');
  };

  try{
    voiceRecognition.start();
  }catch(e){
    console.warn(e);
    voiceListening=false;
    if(button)button.classList.remove('listening');
    const topBtn=document.getElementById('voiceBtn');
    if(topBtn)topBtn.classList.remove('listening');
  }
}

/* =========================================================
   PHOTO SEARCH
   Browser-only: filename keywords + dominant color.
   No API key is required. This keeps existing Firebase intact.
========================================================= */
let photoObjectUrl='';

function openPhotoPicker(){
  const input=document.getElementById('imageSearchInput');
  if(input)input.click();
}

function imageColorFromFile(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const imgEl=new Image();
      imgEl.onload=()=>{
        try{
          const canvas=document.createElement('canvas');
          const size=60;
          canvas.width=size;canvas.height=size;
          const ctx=canvas.getContext('2d',{willReadFrequently:true});
          ctx.drawImage(imgEl,0,0,size,size);
          const data=ctx.getImageData(0,0,size,size).data;
          let r=0,g=0,b=0,n=0;
          for(let i=0;i<data.length;i+=4){
            if(data[i+3]<50)continue;
            r+=data[i];g+=data[i+1];b+=data[i+2];n++;
          }
          resolve(n?{r:r/n,g:g/n,b:b/n}:null);
        }catch(e){resolve(null)}
      };
      imgEl.onerror=()=>resolve(null);
      imgEl.src=reader.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

function nearestColorName(rgb){
  if(!rgb)return '';
  const {r,g,b}=rgb;
  if(r>210&&g>210&&b>210)return 'ақ';
  if(r<75&&g<75&&b<75)return 'қара';
  if(b>r*1.2&&b>g*1.08)return 'көк';
  if(r>g*1.25&&r>b*1.25)return 'қызыл';
  if(g>r*1.2&&g>b*1.05)return 'жасыл';
  if(r>150&&g>120&&b<100)return 'сары';
  if(Math.abs(r-g)<18&&Math.abs(g-b)<18&&r<180)return 'сұр';
  if(r>140&&g<110&&b>110)return 'қызғылт';
  if(r>90&&g>55&&b<60)return 'қоңыр';
  return '';
}

function colorDistance(a,b){
  return Math.sqrt(
    Math.pow(a.r-b.r,2)+
    Math.pow(a.g-b.g,2)+
    Math.pow(a.b-b.b,2)
  );
}

async function searchByPhoto(file){
  if(!file||!file.type.startsWith('image/')){
    toast('Сурет файлын таңдаңыз');
    return;
  }

  const status=document.getElementById('smartPhotoStatus');
  const box=document.getElementById('smartPhotoBox');
  const preview=document.getElementById('smartPhotoPreview');

  if(photoObjectUrl)URL.revokeObjectURL(photoObjectUrl);
  photoObjectUrl=URL.createObjectURL(file);

  if(box)box.classList.add('show');
  if(preview)preview.src=photoObjectUrl;
  if(status)status.textContent='📷 Сурет талдануда...';

  const rgb=await imageColorFromFile(file);
  const color=nearestColorName(rgb);

  const filename=normalizeSearchText(file.name.replace(/\.[^.]+$/,''));
  const stopWords=['img','image','photo','фото','сурет','dsc','px','screenshot','скриншот'];
  const keys=filename.split(/[^a-zа-яәіңқөұүһё0-9]+/i)
    .filter(x=>x.length>2&&!stopWords.includes(x));

  const tempQuery={
    raw:keys.join(' '),
    maxPrice:null,
    size:'',
    shoeSize:'',
    color,
    category:'',
    gender:'',
    gift:false,
    interesting:false,
    keywords:keys
  };

  let arr=state.products.map(p=>{
    let score=0;
    const text=productSearchText(p);
    if(color){
      const colors=productColors(p);
      if(colors.some(c=>c.includes(color)))score+=45;
      else if(text.includes(color))score+=18;
    }
    for(const k of keys){if(text.includes(k))score+=25;}
    return {p,score};
  });

  arr.sort((a,b)=>b.score-a.score);

  /* Keep useful results even when the uploaded filename has no words. */
  if(!keys.length && !color){
    arr=state.products.map((p,i)=>({p,score:100-i}));
  }

  arr=arr.slice(0,24);

  state.photoSearch={
    fileName:file.name,
    color,
    keywords:keys,
    at:Date.now()
  };
  save();

  page='search';

  if(color){
    const input=document.getElementById('searchInput');
    if(input && !input.value.trim())input.value=color;
  }

  render();

  const afterStatus=document.getElementById('smartPhotoStatus');
  if(afterStatus){
    afterStatus.textContent=
      '📷 Сурет іздеуі: '+
      (color?('негізгі түс — '+color):'түсі анықталмады')+
      (keys.length?' · файл атауы: '+keys.slice(0,4).join(', '):'')+
      ' · '+arr.length+' ұқсас нәтиже.';
  }
}

function translateTextNode(node){
  if(!node || !node.nodeValue)return;
  const raw=node.nodeValue;
  const trimmed=raw.trim();
  if(!trimmed)return;
  if(!node.__kkText) node.__kkText=trimmed;
  const kk=node.__kkText;
  let out=kk;
  if(currentLanguage==='ru'){
    out=RU_TEXTS[kk]||kk;
    out=out.replace(/^(\d+)\s+тауар$/,'$1 товар(ов)');
    out=out.replace(/^(\d+)\s+нәтиже$/,'$1 результат(ов)');
    out=out.replace(/^(\d+)\s+ұқсас нәтиже\.$/,'$1 похожих результатов.');
    out=out.replace(/^Тапсырыс #/,'Заказ #');
  }
  if(raw.startsWith(' ') ) out=' '+out;
  if(raw.endsWith(' ') ) out=out+' ';
  if(node.nodeValue!==out) node.nodeValue=out;
}
function applyLanguage(){
  document.documentElement.lang=currentLanguage==='ru'?'ru':'kk';
  document.title=currentLanguage==='ru'?'SatuGo — маркетплейс Казахстана':'SatuGo — Қазақстан маркетплейсі';
  const root=document.body;
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(translateTextNode);
  root.querySelectorAll('input,textarea').forEach(el=>{
    if(!el.dataset.kkPlaceholder)el.dataset.kkPlaceholder=el.getAttribute('placeholder')||'';
    const kk=el.dataset.kkPlaceholder;
    if(currentLanguage==='ru')el.setAttribute('placeholder',RU_TEXTS[kk]||kk);
    else el.setAttribute('placeholder',kk);
  });
  root.querySelectorAll('[title],[aria-label]').forEach(el=>{
    if(el.hasAttribute('title')){
      if(!el.dataset.kkTitle)el.dataset.kkTitle=el.getAttribute('title')||'';
      const kk=el.dataset.kkTitle;
      el.setAttribute('title',currentLanguage==='ru'?(RU_TEXTS[kk]||kk):kk);
    }
    if(el.hasAttribute('aria-label')){
      if(!el.dataset.kkAria)el.dataset.kkAria=el.getAttribute('aria-label')||'';
      const kk=el.dataset.kkAria;
      el.setAttribute('aria-label',currentLanguage==='ru'?(RU_TEXTS[kk]||kk):kk);
    }
  });
  const lb=document.getElementById('languageBtn');
  if(lb)lb.textContent=currentLanguage==='ru'?'Қазақша':'Русский';
}
function toggleLanguage(){
  currentLanguage=currentLanguage==='kk'?'ru':'kk';
  localStorage.setItem(LANG_KEY,currentLanguage);
  render();
  setTimeout(applyLanguage,0);
}

(function(){

    if(e){
      try{if(e.cancelable)e.preventDefault();}catch(_){ }

      page='account';
      render();
      var app=document.getElementById('app');
      if(app) app.scrollIntoView({block:'start',behavior:'auto'});
    }catch(err){console.error('SatuGo account:',err);}
    return false;
  }
  window.__satugoAccountClick=openAccountDirect;
  function bindAccount(){
    var b=document.getElementById('satugoAccountBtn');
    if(!b || b.dataset.accountBound==='1') return;
    b.dataset.accountBound='1';
    b.style.setProperty('pointer-events','auto','important');
    b.style.setProperty('touch-action','manipulation','important');
    b.addEventListener('pointerup',openAccountDirect,true);
    b.addEventListener('click',openAccountDirect,true);
    b.addEventListener('touchend',openAccountDirect,{capture:true,passive:false});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bindAccount);else bindAccount();
  setTimeout(bindAccount,100);setTimeout(bindAccount,500);setTimeout(bindAccount,1500);
})();

async function syncFirebaseData(){
 if(!fbReady)return;
 try{
  const ps=await fbDb.collection('products').get();
  const remote=ps.docs.map(d=>{const x=d.data()||{};return {id:d.id,...x,name:x.name||x.title||'Тауар',price:Number(x.price||0),cat:x.cat||x.category||'Басқа',category:x.category||x.cat||'Басқа',sellerName:x.sellerName||x.seller||'Сатушы',special:Boolean(x.special),specialType:x.specialType||'interesting',sizes:x.sizes||x.sizesText||'',colors:x.colors||x.colorsText||'',gender:x.gender||''};});
  const ids=new Set(remote.map(x=>String(x.id)));
  const localSpecial=specialStarter.filter(x=>!ids.has(String(x.id)));
  state.products=[...localSpecial,...remote];
  save();
  render();
 }catch(e){console.warn('products load',e.message)}
}
if(fbReady) setTimeout(syncFirebaseData,300);
