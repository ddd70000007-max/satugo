  else if(/бала|балалар|ұл|қыз бала/.test(ntext))gender='балалар';

  const gift=/сыйлық|сыйга|сыйлыққа|подарок|gift/.test(ntext);
  const interesting=/ерекше|қызық|креатив|ерекше зат|необычный|прикол/.test(ntext);

  const stop=['маған','керек','ізде','іздеу','тауып','бер','тауар','тауарлар','зат','заттар','бағасы','баға','дейін','мыңға','мың','теңге','тг','₸','размер','өлшем','өлшемі','size','үшін','алып','алғым','келеді','деймін','бар','болсын','және','мен','ге','ға','қа','ке','дей','аспайды','артық','емес','қымбат','максимум','сыйлық','ерекше'];
  const rawTokens=ntext.split(' ');
  const keywords=[];
  for(const token of rawTokens){
    if(token.length<2)continue;
    if(stop.includes(token))continue;
    if(/^\d+$/.test(token))continue;
    if(['xs','s','m','l','xl','xxl','xxxl'].includes(token))continue;
    if(Object.keys(colorMap).includes(token))continue;
    if(cats.some(c=>c.words.includes(token)))continue;
    keywords.push(token);
  }

  return {raw:text,maxPrice,size,shoeSize,color,category,gender,gift,interesting,keywords};
}
function productSearchText(p){
  return normalizeSearchText([
    p.name,p.title,p.cat,p.category,p.sellerName,p.seller,p.description,
    p.brand,p.color,p.colors,p.size,p.sizes,p.tags,p.keywords,p.gender,p.sex,p.city
  ].flat().join(' '));
}
function productSizes(p){
  const a=[];
  const add=v=>{if(v===undefined||v===null)return;String(v).split(/[ ,;/]+/).forEach(x=>{const y=x.trim().toUpperCase();if(y)a.push(y)});};
  add(p.size);add(p.sizes);add(p.availableSizes);add(p.variants?.sizes);
  return [...new Set(a)];
}
function productColors(p){
  const a=[];
  const add=v=>{if(v===undefined||v===null)return;String(v).split(/[ ,;/]+/).forEach(x=>{const y=normalizeSearchText(x.trim());if(y)a.push(y)});};
  add(p.color);add(p.colors);add(p.availableColors);add(p.variants?.colors);
  return [...new Set(a)];
}
function smartRank(p,q){
  const text=productSearchText(p);
  let score=0;
  const hasCategory=!!q.category;
  if(hasCategory && normalizeSearchText(p.cat||p.category||'').includes(normalizeSearchText(q.category)))score+=60;
  if(q.color && productColors(p).some(c=>c.includes(q.color)))score+=25;
  if(q.size){if(productSizes(p).includes(q.size))score+=35;else if(!productSizes(p).length && text.includes(q.size.toLowerCase()))score+=5;}
  if(q.shoeSize){if(productSizes(p).includes(q.shoeSize))score+=40;else if(text.includes(q.shoeSize))score+=5;}
  if(q.gender && normalizeSearchText(p.gender||p.sex||'').includes(q.gender))score+=15;
  if(q.gift && p.specialType==='gift')score+=50;
  if(q.interesting && p.special)score+=25;
  for(const k of q.keywords){if(text.includes(k))score+=12;}
  if(q.maxPrice!==null){if(Number(p.price||0)<=q.maxPrice)score+=20;else score-=45;}
  return score;
}
function smartProductMatches(p,q){
  const text=productSearchText(p);
  if(q.maxPrice!==null && Number(p.price||0)>q.maxPrice)return false;
  if(q.category){const pc=normalizeSearchText(p.cat||p.category||'');if(!pc.includes(normalizeSearchText(q.category))){if(!(text.includes(normalizeSearchText(q.category))))return false;}}
  if(q.color){const colors=productColors(p);if(colors.length && !colors.some(c=>c.includes(q.color)))return false; if(!colors.length && !text.includes(q.color))return false;}
  if(q.size){const sizes=productSizes(p);if(sizes.length && !sizes.includes(q.size))return false; if(!sizes.length && !text.includes(q.size.toLowerCase()))return false;}
  if(q.shoeSize){const sizes=productSizes(p);if(sizes.length && !sizes.includes(q.shoeSize))return false; if(!sizes.length && !text.includes(q.shoeSize))return false;}
  if(q.gender){const pg=normalizeSearchText(p.gender||p.sex||'');if(pg && !pg.includes(q.gender) && !text.includes(q.gender))return false;}
  const meaningful=q.keywords.filter(k=>k.length>2);
  if(!q.category&&!q.maxPrice&& !q.size&&!q.shoeSize&&!q.color && !meaningful.length)return true;
  if(meaningful.length && !meaningful.some(k=>text.includes(k)) && !q.category && q.maxPrice===null && !q.size&&!q.shoeSize&&!q.color)return false;
  return true;
}

function resizeChatImage(file,max=900,quality=.76){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const sc=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*sc));
        c.height=Math.max(1,Math.round(im.height*sc));
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(im,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      im.onerror=reject;im.src=r.result;
    };
    r.onerror=reject;r.readAsDataURL(file);
  });
}

async function sendChat(forcedText='',forcedImage='',forcedVoice=''){
  const input=document.getElementById('chatText');
  const text=String(forcedText||input?.value||'').trim();
  const uid=state.currentUser?.id||fbAuth?.currentUser?.uid;
  if((!text&&!forcedImage&&!forcedVoice)||!activeChat||!uid||!fbReady||!fbDb)return;
  try{
    const ref=fbDb.collection('chats').doc(activeChat),snap=await ref.get();
    if(!snap.exists){toast('Чат табылмады');return}
    const c=snap.data()||{};
    if(!(c.participants||[]).includes(uid)){toast('Чатқа рұқсат жоқ');return}
    const message={senderId:uid,senderName:state.currentUser?.name||'Пайдаланушы',text:text||'',image:forcedImage||'',voice:forcedVoice||'',read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(chatReply)message.replyTo={id:chatReply.id,text:chatReply.text||'',hasImage:!!chatReply.image};
    await ref.collection('messages').add(message);
    const unread={...(c.unread||{}),[uid]:0},other=(c.participants||[]).find(x=>x!==uid);
    if(other)unread[other]=(unread[other]||0)+1;
    await ref.set({lastMessage:forcedVoice?'🎙️ Дауыстық хабарлама':(text||'📷 Фото'),lastSenderId:uid,unread,typing:{[uid]:false},updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    chatReply=null;setChatReply(null);
    if(input){input.value='';input.focus()}
    if(chatTypingTimer)clearTimeout(chatTypingTimer);
  }catch(e){console.error(e);toast('Хабарлама жіберу қатесі: '+(e.code==='permission-denied'?'Firebase Rules тексеріңіз':e.message))}
}

async function placeOrder(){const name=document.getElementById('ordName').value.trim(),phone=document.getElementById('ordPhone').value.trim(),address=document.getElementById('ordAddress').value.trim();if(!name||!phone||!address){toast('Барлық өрісті толтырыңыз');return}const items=state.cart.map(i=>({...i,p:getProduct(i.productId)})).filter(x=>x.p);const total=items.reduce((s,x)=>s+x.p.price*x.qty,0);const sellerIds=[...new Set(items.map(x=>x.p.sellerId).filter(x=>x&&x!=='platform'))];if(!sellerIds.length){toast('Бұл тауарларда сатушы көрсетілмеген');return}const id='o_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);const payload={buyerId:state.currentUser.id,buyerName:name,phone,address,items:items.map(x=>({productId:x.p.id,name:x.p.name,price:Number(x.p.price||0),qty:Number(x.qty||1),sellerId:x.p.sellerId,sellerName:x.p.sellerName||'Сатушы'})),sellerIds,total,status:'Жаңа тапсырыс',statusHistory:[{status:'Жаңа тапсырыс',at:Date.now(),by:state.currentUser.id}],createdAt:fbReady&&state.currentUser.firebase?firebase.firestore.FieldValue.serverTimestamp():Date.now()};try{if(fbReady&&fbDb&&state.currentUser.firebase){await fbDb.collection('orders').doc(id).set(payload)}const o={id,...payload,createdAt:Date.now()};state.orders.unshift(o);state.currentUser.name=name;state.currentUser.phone=phone;state.cart=[];save();closeModal();toast('Тапсырыс қабылданды және сатушыға жіберілді');render()}catch(e){console.error(e);toast('Тапсырысты сақтау қатесі: '+(e.code==='permission-denied'?'Firebase Rules тексеріңіз':e.message))}}
function normalizePhone(v){let x=String(v||'').replace(/[^0-9+]/g,'');if(x.startsWith('8'))x='+7'+x.slice(1);if(!x.startsWith('+7')&&x.startsWith('7'))x='+'+x;return x}
async function passHash(v){const data=new TextEncoder().encode(String(v));const buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function validPhone(v){return /^\+7\d{10}$/.test(normalizePhone(v))}
function openLogin(){
  if(!fbReady){toast('Firebase қосылмаған');return}
  let mode='login',step=1;
  const draw=()=>{
    openModal(`<div class="modaltop"><h2>${mode==='login'?'Кіру':'Тіркелу'}</h2><button class="close" id="close8">×</button></div>
      <div class="actions"><button class="${mode==='login'?'primary':'secondary'}" id="modeLogin">Кіру</button><button class="${mode==='register'?'primary':'secondary'}" id="modeRegister">Тіркелу</button></div>
      ${step===1?`<div class="field"><label>Қазақстан телефоны</label><input id="authPhone" inputmode="tel" autocomplete="tel" placeholder="+7 700 000 00 00"></div><div id="recaptcha-container"></div><button class="primary" id="sendCode">SMS код жіберу</button>`:
      `<div class="field"><label>SMS код</label><input id="authCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6 таңбалы код"></div>${mode==='register'?`<div class="field"><label>Аты-жөніңіз</label><input id="authName" autocomplete="name" placeholder="Аты-жөніңіз"></div>`:''}<button class="primary" id="verifyCode">Растау және ${mode==='login'?'кіру':'тіркелу'}</button>`}
      <p class="muted">SMS арқылы Firebase аккаунтымен кіру. +7 нөмірі қажет.</p>`);
    document.querySelector('#sheet .close').onclick=closeModal;
    document.getElementById('modeLogin').onclick=()=>{mode='login';step=1;draw()};
    document.getElementById('modeRegister').onclick=()=>{mode='register';step=1;draw()};
    if(step===1){
      const inp=document.getElementById('authPhone');
      inp.addEventListener('input',e=>{let v=e.target.value.replace(/[^0-9+]/g,'');if(v.startsWith('8'))v='+7'+v.slice(1);if(v.startsWith('7')&&!v.startsWith('+7'))v='+'+v;e.target.value=v});
      document.getElementById('sendCode').onclick=async()=>{
        const phone=normalizePhone(inp.value.trim());
        if(!validPhone(phone)){toast('Телефонды +7XXXXXXXXXX форматында енгізіңіз');return}
        try{
          if(recaptchaVerifier){try{recaptchaVerifier.clear()}catch(_) {}}
          recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'normal'});
          await recaptchaVerifier.render();
          phoneConfirmation=await fbAuth.signInWithPhoneNumber(phone,recaptchaVerifier);
          step=2;draw();toast('SMS код жіберілді');
        }catch(e){console.error(e);toast('SMS жіберілмеді: Firebase Phone Auth баптауын тексеріңіз')}
      };
    }else{
      document.getElementById('verifyCode').onclick=async()=>{
        const code=document.getElementById('authCode').value.trim();
        if(!/^\d{6}$/.test(code)){toast('6 таңбалы код енгізіңіз');return}
        try{
          const result=await phoneConfirmation.confirm(code),u=result.user;
          const name=mode==='register'?document.getElementById('authName').value.trim():(u.displayName||'Пайдаланушы');
          if(mode==='register'&&!name){toast('Аты-жөніңізді енгізіңіз');return}
          if(name&&u.displayName!==name)await u.updateProfile({displayName:name});
          await fbDb.collection('users').doc(u.uid).set({name:name||'Пайдаланушы',phone:u.phoneNumber||'',role:'buyer',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
          state.currentUser={id:u.uid,name:name||'Пайдаланушы',phone:u.phoneNumber||'',firebase:true};save();closeModal();render();toast(mode==='login'?'Сәтті кірдіңіз':'Аккаунт ашылды');
        }catch(e){console.error(e);toast('SMS коды қате немесе мерзімі өтті')}
      };
    }
  };
  draw();
}

async function deleteSellerProduct(id){
  const p=state.products.find(x=>String(x.id)===String(id));
  const uid=state.currentUser?.id;
  if(!p||p.sellerId!==uid){toast('Тауар табылмады немесе рұқсат жоқ');return}
  if(!confirm('Осы тауарды өшіру керек пе?'))return;
  try{
    if(fbReady&&fbDb&&state.currentUser?.firebase) await fbDb.collection('products').doc(String(id)).delete();

/* =========================================================
   VOICE SEARCH
========================================================= */
let voiceRecognition=null;
let voiceListening=false;

function getVoiceRecognition(){
  return window.SpeechRecognition||window.webkitSpeechRecognition||null;
}

function startVoiceSearch(button=null){
  const SR=getVoiceRecognition();
  if(!SR){
    toast('Бұл браузерде дауыспен іздеу қолжетімсіз');
    return;
  }

  if(voiceListening){
    try{voiceRecognition?.stop()}catch(_){ }
    return;
  }

  voiceRecognition=new SR();
  voiceRecognition.lang='kk-KZ';
  voiceRecognition.interimResults=true;
  voiceRecognition.continuous=false;
  voiceListening=true;

  if(button)button.classList.add('listening');
  const topBtn=document.getElementById('voiceBtn');
  if(topBtn)topBtn.classList.add('listening');
  toast('🎤 Тыңдап тұрмын...');

  voiceRecognition.onresult=e=>{
    let text='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      text+=e.results[i][0].transcript+' ';
    }
    text=text.trim();
    const input=document.getElementById('searchInput');
    if(input)input.value=text;
    const pageInput=document.getElementById('searchPageInput');
    if(pageInput)pageInput.value=text;
  };

  voiceRecognition.onend=()=>{
    voiceListening=false;
    if(button)button.classList.remove('listening');
    const topBtn=document.getElementById('voiceBtn');
    if(topBtn)topBtn.classList.remove('listening');
    const text=(document.getElementById('searchInput')?.value||'').trim();
    if(text){
      page='search';
      render();
      toast('🔎 Дауыстық сұраныс бойынша ізделді');
    }
  };

  voiceRecognition.onerror=e=>{
    console.warn('Voice search:',e);
    voiceListening=false;
    if(button)button.classList.remove('listening');
    const topBtn=document.getElementById('voiceBtn');
    if(topBtn)topBtn.classList.remove('listening');
    if(e?.error==='not-allowed') toast('Микрофонға рұқсат беріңіз');
  };
}

  openModal(`<div class="modaltop"><h2>🏪 Менің дүкенім</h2><button class="close" id="close10">×</button></div><div class="field"><label>Дүкен атауы</label><input id="storeName" value="${esc(state.store?.ownerId===uid?state.store.name:'')}" placeholder="AIDANA FASHION"></div><button class="secondary" id="saveStore">Дүкенді сақтау</button><hr><h3>➕ Тауар қосу</h3><div class="field"><label>Тауар атауы</label><input id="pnm" placeholder="Мысалы: iPhone 15 Pro"></div><div class="row"><div class="field"><label>Бағасы ₸</label><input id="pprice" type="number" min="1" placeholder="399000"></div><div class="field"><label>Қойма саны</label><input id="pstock" type="number" min="0" value="1"></div></div><div class="field"><label>Категория</label><select id="pcat">${sgCategoryOptions('Телефон')}</select></div><div id="sgDynamicAttrs">${sgAttrForm('Телефон',{})}</div><div class="field"><label>Сурет URL</label><input id="pimg" placeholder="https://..."></div><div class="field"><label>Сипаттама</label><textarea id="pdesc" rows="3" placeholder="Тауар туралы толық сипаттама"></textarea></div><div class="row"><div class="field"><label>Размер / өлшемдер</label><input id="pSizes" placeholder="S, M, L, XL немесе 42"></div><div class="field"><label>Түс / түстер</label><input id="pColors" placeholder="Қара, Ақ, Көк"></div></div><div class="field"><label>Кімге арналған</label><select id="pGender"><option value="">Көрсетілмеген</option><option>Әйелдер</option><option>Ерлер</option><option>Балалар</option><option>Unisex</option></select></div><div class="field"><label class="special-check"><input id="pSpecial" type="checkbox"><span>✨ Ерекше заттарға шығару</span></label></div><div class="field"><label>Ерекше зат түрі</label><select id="pSpecialType"><option value="interesting">🤯 Қызық зат</option><option value="eye">👀 Көзге түсетін</option><option value="gift">🎁 Сыйлық</option></select></div><button class="primary" id="addProduct">➕ Тауарды қосу</button><h3>Менің тауарларым</h3>${mine.length?`<div class="list">${mine.map(p=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><b>${esc(p.name)}</b><div>${money(p.price)} · 📦 ${Number(p.stock??p.quantity??0)}</div>${p.attributes?sgRenderAttrs(p.cat||p.category,p.attributes):''}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="secondary" data-edit-product="${esc(p.id)}">✏️</button><button type="button" class="danger" data-delete-product="${esc(p.id)}">🗑️</button></div></div></div>`).join('')}</div>`:'<div class="muted">Тауар жоқ.</div>'}<h3>Менің тапсырыстарым</h3>${orders.length?`<div class="list">${orders.map(o=>`<div class="item"><b>#${esc(o.id.slice(-6))}</b><div>${money(o.total)} · <b>${esc(o.status||'Жаңа тапсырыс')}</b></div><div class="muted">${esc(o.buyerName||'Клиент')} · ${esc(o.phone||'')} · ${esc(o.address||'')}</div><div class="orderitems">${(o.items||[]).filter(i=>i.sellerId===uid).map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</div>${o.status==='Жаңа тапсырыс'?`<button class="primary" data-status="${esc(o.id)}">Қабылдау</button>`:''}</div>`).join('')}</div>`:'<div class="muted">Тапсырыс жоқ.</div>'}`);
  const root=document.querySelector('#sheet');root.querySelector('#close10').onclick=closeModal;root.querySelector('#saveStore').onclick=async()=>{const n=root.querySelector('#storeName').value.trim();if(!n){toast('Дүкен атауын енгізіңіз');return}try{if(fbReady&&fbDb&&state.currentUser.firebase)await fbDb.collection('stores').doc(uid).set({ownerId:uid,name:n,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});state.store={...(state.store||{}),ownerId:uid,name:n};save();toast('Дүкен сақталды')}catch(e){toast('Дүкенді сақтау сәтсіз болды: '+e.message)}};
  sgBindCategory(root);root.querySelector('#addProduct').onclick=saveSellerProductV2;root.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editSellerProductV2(b.dataset.editProduct));root.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>deleteSellerProduct(b.dataset.deleteProduct));root.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const o=state.orders.find(x=>x.id===b.dataset.status);if(!o)return;try{if(fbReady&&fbDb&&state.currentUser.firebase)await fbDb.collection('orders').doc(o.id).update({status:'Қабылданды',statusHistory:firebase.firestore.FieldValue.arrayUnion({status:'Қабылданды',at:Date.now(),by:uid}),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});o.status='Қабылданды';save();openSellerV2();toast('Тапсырыс қабылданды')}catch(e){toast('Тапсырыс статусын өзгерту қатесі: '+e.message)}});
}
openSeller=openSellerV2;editSellerProduct=editSellerProductV2;saveSellerProduct=saveSellerProductV2;
const _sgOldOpenProduct=openProduct;openProduct=function(id){const p=getProduct(id);if(!p)return _sgOldOpenProduct(id);selectedProduct=p;const reviews=state.reviews.filter(r=>r.productId===p.id);openModal(`<div class="modaltop"><h2>${esc(p.name)}</h2><button class="close" id="close5">×</button></div><div class="productdetail"><div>${img(p.image,'🛍️','bigpic')}</div><div>${p.special?`<div class="special-label">✨ ${p.specialType==='eye'?'👀 Көзге түсетін':p.specialType==='gift'?'🎁 Сыйлық':'🤯 Қызық зат'}</div>`:''}<div class="price">${money(p.price)}</div><div class="muted">${esc(p.cat||p.category||'')} · ${esc(p.sellerName||'Сатушы')}</div>${sgRenderAttrs(p.cat||p.category||'Басқа',p.attributes||{})}<p>${esc(p.description||'Бұл тауар туралы толық ақпаратты сатушыдан сұрауға болады.')}</p><div class="actions"><button class="primary" id="detailCart">Себетке қосу</button><button class="secondary" id="detailChat">Сатушымен чат</button></div><div class="sectionhead"><h3>Пікірлер</h3></div>${reviews.length?reviews.map(r=>`<div class="review"><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span><br><b>${esc(r.userName)}</b><div>${esc(r.text)}</div></div>`).join(''):'<div class="muted">Пікір әзірге жоқ.</div>'}</div></div>`);document.querySelector('#sheet .close').onclick=closeModal;document.getElementById('detailCart').onclick=()=>{addCart(p.id);closeModal()};document.getElementById('detailChat').onclick=()=>{if(p.sellerId==='platform'){toast('Бұл SatuGo платформасының тауары');return}startChat(p)};document.getElementById('detailStore')?.addEventListener('click',()=>openPublicStore(p.sellerId,p.sellerName||'Сатушы'))};

const _satugoRender=render;render=function(){_satugoRender();bindGlobalUi();if(page==='account')bindAccountContent();bindSmartSearchTools()};
bindGlobalUi();render();

</script>
