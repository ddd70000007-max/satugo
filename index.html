<!DOCTYPE html>
<html lang="kk">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SatuGo — Қазақстан маркетплейсі</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#fff;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#111;
}

.header-buttons{
  display:flex;
  gap:8px;
}

button{
  border:0;
  cursor:pointer;
}

.main-btn{
  background:#111;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
}

.secondary-btn{
  background:#eee;
  color:#111;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
}

.cart-btn{
  background:#111;
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:18px;
}

.banner{
  background:linear-gradient(135deg,#111,#444);
  color:white;
  padding:30px;
  border-radius:18px;
  margin-bottom:18px;
}

.banner h1{
  margin:0 0 8px;
  font-size:30px;
}

.banner p{
  margin:0;
  opacity:.85;
}

.seller-banner{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:20px;
}

.category-btn{
  white-space:nowrap;
  background:#fff;
  border:1px solid #ddd;
  padding:11px 16px;
  border-radius:30px;
}

.category-btn.active{
  background:#111;
  color:#fff;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.product{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.product-img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.product-body{
  padding:15px;
}

.product-name{
  font-weight:bold;
  font-size:17px;
  margin-bottom:7px;
}

.product-category{
  color:#777;
  font-size:13px;
  margin-bottom:8px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.product-buttons{
  display:flex;
  gap:7px;
}

.product-buttons button{
  flex:1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  padding:15px;
  overflow:auto;
}

.modal-box{
  background:#fff;
  max-width:550px;
  margin:40px auto;
  border-radius:18px;
  padding:20px;
}

.close{
  float:right;
  font-size:25px;
  background:none;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0;
  font-size:15px;
}

textarea.input{
  min-height:100px;
  resize:vertical;
}

.modal-title{
  font-size:23px;
  font-weight:bold;
  margin-bottom:15px;
}

.cart-item{
  background:#f5f5f5;
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.detail-image{
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:14px;
  background:#eee;
}

.detail-price{
  font-size:28px;
  font-weight:bold;
  margin:12px 0;
}

.detail-category{
  color:#777;
  margin-bottom:10px;
}

.detail-seller{
  background:#f5f5f5;
  padding:12px;
  border-radius:12px;
  margin:12px 0;
}

.stars{
  font-size:24px;
  letter-spacing:2px;
}

.rating-number{
  font-weight:bold;
  font-size:18px;
}

.review{
  background:#f5f5f5;
  padding:12px;
  border-radius:12px;
  margin-top:8px;
}

.review-name{
  font-weight:bold;
}

.review-date{
  color:#888;
  font-size:12px;
}

.store-header{
  background:#111;
  color:#fff;
  padding:25px;
  border-radius:16px;
  margin-bottom:18px;
}

.store-name{
  font-size:28px;
  font-weight:bold;
}

.store-products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.store-product{
  background:#f5f5f5;
  border-radius:12px;
  padding:10px;
}

.store-product img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:10px;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#777;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:900px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  header{
    padding:12px;
  }

  .logo{
    font-size:21px;
  }

  .header-buttons{
    gap:5px;
  }

  .header-buttons button{
    padding:9px 10px;
    font-size:12px;
  }

  .container{
    padding:12px;
  }

  .banner{
    padding:22px;
  }

  .banner h1{
    font-size:24px;
  }

  .seller-banner{
    display:block;
  }

  .seller-banner button{
    margin-top:10px;
    width:100%;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-img{
    height:145px;
  }

  .product-body{
    padding:10px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .product-buttons{
    display:block;
  }

  .product-buttons button{
    width:100%;
    margin-top:5px;
  }

  .modal-box{
    margin:15px auto;
    padding:15px;
  }

}

@media(max-width:380px){

  .products{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<!-- ACCOUNT MODAL -->

<div

  class="modal">

    </div>

        id="loginEmail"

      <input
        id="loginPassword"

        type="password"

</div>


<!-- SELLER MODAL -->

<div

  <div class="modal-box">

    <button
      class="close"

    </button>

    <div class="modal-title">
      🏪 Менің дүкенім

    <div id="sellerContent">

      <p>
        Дүкен ашу үшін аккаунтқа кіріңіз.

      <button
        class="main-btn"
        onclick="openAccount()">
        Аккаунтқа кіру
      </button>

    </div>

  </div>

</div>


<!-- CART MODAL -->

<div
  id="cartModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('cartModal')">
      ×
    </button>

    <div class="modal-title">
      🛒 Себет
    </div>

    <div id="cartItems"></div>

    <div id="cartTotal"
         style="font-size:20px;font-weight:bold;margin:15px 0">
    </div>

    <div id="checkout">

      <input
        id="customerName"

        placeholder="Аты-жөніңіз"

      <input

        class="input"

      <button

</div>


<!-- PRODUCT DETAIL MODAL -->

<div
  id="productDetailModal"

  <div class="modal-box">

    <button

      ×

</div>


<!-- STORE DETAIL MODAL -->

<div
  id="storeDetailModal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('storeDetailModal')">
      ×

    <div id="storeDetailContent"></div>

  </div>

</div>

<script>

const firebaseConfig = {

  apiKey:
  "AIzaSyCj7VBpb0u5YgFqz2Mm8NhvbytX_Fs5tJE",

  authDomain:
  "satugo-c3b7c.firebaseapp.com",

  projectId:

  storageBucket:

  messagingSenderId:
  "32133349747",

  appId:
  "1:32133349747:web:8df062f6428b4eb7ed8506",

  measurementId:
  "G-4PF4DV016B"

};


firebase.initializeApp(firebaseConfig);


var auth =
  firebase.auth();

var db =
  firebase.firestore();


var products = [];

var cart = [];

var currentUser = null;

var currentProfile = null;

var currentCategory = "Барлығы";


var demoProducts = [

  {
    id:"demo1",
    name:"Классикалық футболка",
    price:7990,
    category:"Киім",
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80",
    sellerId:"",
    sellerName:"SatuGo"
  },

  {
    id:"demo2",
    name:"Спорттық аяқ киім",
    price:24990,
    category:"Аяқ киім",
    image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80",
    sellerId:"",
    sellerName:"SatuGo"
  },

  {
    id:"demo3",
    name:"Косметика жинағы",
    price:15990,
    category:"Косметика",
    image:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=800&q=80",
    sellerId:"",
    sellerName:"SatuGo"
  },

  {
    id:"demo4",
    name:"Сымсыз құлаққап",
    price:18990,
    category:"Электрон",
    image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80",
    sellerId:"",
    sellerName:"SatuGo"
  }

];


function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  return Number(value || 0)
    .toLocaleString("kk-KZ") + " ₸";

}


function imageUrl(image){

  if(!image){

    return "https://via.placeholder.com/600x400?text=SatuGo";

  }

  return image;

}


async function loadProducts(){

  try{

    var snapshot =
      await db.collection("products")
        .orderBy("createdAt","desc")
        .get();

    products =
      snapshot.docs.map(function(doc){

        return {

          id:doc.id,

          ...doc.data()

        };

      });

  }catch(error){

    console.log(
      "Firebase products:",
      error
    );

    products = [];

  }


  /*
    Firebase-та тауар болмаса,
    демо тауарларды көрсетеміз.
  */

  if(products.length === 0){

    products =
      demoProducts.slice();

  }else{

    products =
      demoProducts.concat(products);

  }


  showProducts();

}


function showProducts(){

  var container =
    document.getElementById("products");

  var search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  var filtered =
    products.filter(function(p){

      var matchSearch =
        !search ||
        String(p.name || "")
          .toLowerCase()
          .includes(search) ||

        String(p.category || "")
          .toLowerCase()
          .includes(search) ||

        String(p.sellerName || "")
          .toLowerCase()
          .includes(search);


      var matchCategory =
        currentCategory === "Барлығы" ||
        p.category === currentCategory;


      return matchSearch && matchCategory;

    });


  if(filtered.length === 0){

    container.innerHTML =
      '<div class="empty">' +
      'Тауар табылмады 😔' +
      '</div>';

    return;

  }


  container.innerHTML =
    filtered.map(function(p){

      var img =
        imageUrl(p.image);


      return `

        <div class="product">

          <img
            class="product-img"
            src="${safe(img)}"
            onerror="this.src='https://via.placeholder.com/600x400?text=SatuGo'"
          >

          <div class="product-body">

            <div class="product-name">
              ${safe(p.name)}
            </div>

            <div class="product-category">
              ${safe(p.category || "Тауар")}
            </div>

            <div class="price">
              ${money(p.price)}
            </div>

            <div style="font-size:13px;color:#777;margin-bottom:10px">
              🏪 ${safe(p.sellerName || "Дүкен")}
            </div>

            <div class="product-buttons">

              <button
                class="secondary-btn"
                onclick="openProduct('${safe(p.id)}')">
                Толық көру
              </button>

              <button
                class="main-btn"
                onclick="addCart('${safe(p.id)}')">
                🛒 Қосу
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


function findProduct(id){

  return products.find(function(p){

    return String(p.id) === String(id);

  });

}


function searchProducts(){

  showProducts();

}


function categoryFilter(category,button){

  currentCategory =
    category;


  document
    .querySelectorAll(".category-btn")
    .forEach(function(btn){

      btn.classList.remove("active");

    });


  if(button){

    button.classList.add("active");

  }


  showProducts();

}


/* =========================
   CART
========================= */


function addCart(id){

  var product =
    findProduct(id);

  if(!product){

    alert("Тауар табылмады.");

    return;

  }


  var existing =
    cart.find(function(item){

      return item.id === id;

    });


  if(existing){

    existing.qty += 1;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(product.price || 0),

      image:product.image || "",

      sellerId:product.sellerId || "",

      sellerName:product.sellerName || "Дүкен",

      qty:1

    });

  }


  saveCart();

  updateCartCount();

  alert("Тауар себетке қосылды! 🛒");

}


function saveCart(){

  localStorage.setItem(
    "satugo_cart",
    JSON.stringify(cart)
  );

}


function loadCart(){

  try{

    cart =
      JSON.parse(
        localStorage.getItem("satugo_cart") || "[]"
      );

    if(!Array.isArray(cart)){

      cart = [];

    }

  }catch(error){

    cart = [];

  }


  updateCartCount();

}


function updateCartCount(){

  var count =
    cart.reduce(function(total,item){

      return total + Number(item.qty || 0);

    },0);


  document.getElementById("cartCount")
    .textContent = count;

}


function openCart(){

  renderCart();

  document.getElementById("cartModal")
    .style.display = "block";

}


function renderCart(){

  var box =
    document.getElementById("cartItems");

  var totalBox =
    document.getElementById("cartTotal");


  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">' +
      'Себет бос 🛒' +
      '</div>';

    totalBox.innerHTML = "";

    return;

  }


  var total = 0;


  box.innerHTML =
    cart.map(function(item){

      var itemTotal =
        Number(item.price) *
        Number(item.qty);


      total += itemTotal;


      return `

        <div class="cart-item">

          <div>

            <b>
              ${safe(item.name)}
            </b>

            <div style="margin-top:5px">
              ${money(item.price)}
            </div>

            <div style="margin-top:5px">
              Саны: ${item.qty}
            </div>

          </div>

          <button
            class="secondary-btn"
            onclick="removeCart('${safe(item.id)}')">
            Өшіру
          </button>

        </div>

      `;

    }).join("");


  totalBox.innerHTML =
    "Жалпы: " + money(total);

}


function removeCart(id){

  cart =
    cart.filter(function(item){

      return String(item.id) !== String(id);

    });


  saveCart();

  updateCartCount();

  renderCart();

}


async function makeOrder(){

  if(cart.length === 0){

    alert("Себет бос.");

    return;

  }


  if(!currentUser){

    alert(
      "Тапсырыс беру үшін алдымен аккаунтқа кіріңіз."
    );

    openAccount();

    return;

  }


  var name =
    document.getElementById("customerName")
      .value.trim();

  var phone =
    document.getElementById("customerPhone")
      .value.trim();

  var address =
    document.getElementById("customerAddress")
      .value.trim();


  if(!name || !phone || !address){

    alert(
      "Аты-жөніңізді, телефонды және мекенжайды енгізіңіз."
    );

    return;

  }


  try{

    var groups = {};


    cart.forEach(function(item){

      var seller =
        item.sellerId || "satugo";

      if(!groups[seller]){

        groups[seller] = [];

      }

      groups[seller].push(item);

    });


    for(var sellerId in groups){

      var items =
        groups[sellerId];


      var total =
        items.reduce(function(sum,item){

          return sum +
            Number(item.price) *
            Number(item.qty);

        },0);

/* =========================
   REGISTER
========================= */


async function registerUser(){

  var email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  var password =
    document.getElementById(
      "loginPassword"
    ).value;


  if(!email || !password){

    alert(
      "Email және құпия сөзді енгізіңіз."
    );

    return;

  }


  if(password.length < 6){

    alert(
      "Құпия сөз кемінде 6 таңба болуы керек."
    );

    return;

  }


  try{

    var result =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );


    currentUser =
      result.user;


    await db.collection("users")
      .doc(currentUser.uid)
      .set({

        email:
          currentUser.email,

        name:
          currentUser.email.split("@")[0],

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    alert(
      "Аккаунт сәтті құрылды! ✅"
    );


    await loadProfile();

    updateAccountUI();

    updateSellerUI();


  }catch(error){

    console.error(error);

    alert(
      translateFirebaseError(error)
    );

  }

}

async function loginUser(){

    ).value;


  if(!email || !password){

    );

  }


  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );


    alert(
      "Сәтті кірдіңіз! ✅"
    );


    updateAccountUI();

    updateSellerUI();


  }catch(error){

    console.error(error);

    alert(
      translateFirebaseError(error)
    );

  }

}


function translateFirebaseError(error){

  var code =
    error &&
    error.code
    ?
    error.code
    :
    "";


  if(code === "auth/invalid-credential"){

    return "Email немесе құпия сөз қате.";

  }


  if(code === "auth/user-not-found"){

    return "Мұндай аккаунт табылмады.";

  }


  if(code === "auth/wrong-password"){

    return "Құпия сөз қате.";

  }


  if(code === "auth/email-already-in-use"){

    return "Бұл email бұрын тіркелген.";

  }


  if(code === "auth/invalid-email"){

    return "Email дұрыс жазылмаған.";

  }


  if(code === "auth/weak-password"){

    return "Құпия сөз тым әлсіз.";

  }


  return "Қате болды. Қайта көріңіз.";

}

async function loadProfile(){

      null;

    return;

  }


  try{

    var doc =
      await db.collection("users")
        .doc(currentUser.uid)
        .get();


    if(doc.exists){

      currentProfile =
        doc.data();

    }else{

      currentProfile = {

        email:
          currentUser.email,

        name:
          currentUser.email.split("@")[0]

      };

    }

  }catch(error){

    console.error(error);

    currentProfile = {

      email:
        currentUser.email,

      name:
        currentUser.email.split("@")[0]

    };

  }

}

        .doc(currentUser.uid)
        .get();

        doc.data();


      var nameInput =
        document.getElementById(
          "storeName"
        );

        document.getElementById(

        );


      if(nameInput){

async function saveStore(){

  if(!currentUser){

    alert(
      "Алдымен аккаунтқа кіріңіз."
    );

    return;

  }


  var name =
    document.getElementById(
      "storeName"
    ).value.trim();


  var description =
    document.getElementById(
      "storeDescription"
    ).value.trim();


  if(!name){

    alert(
      "Дүкен атауын енгізіңіз."
    );

    return;

  }


  try{

    await db.collection("stores")
      .doc(currentUser.uid)
      .set({

        name:
          name,

        description:
          description,

        ownerId:
          currentUser.uid,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    alert(
      "Дүкен сақталды! 🏪"
    );


  }catch(error){

/* =========================
   SAVE PRODUCT
========================= */


async function saveProduct(){

  if(!currentUser){

    alert(
      "Алдымен аккаунтқа кіріңіз."
    );

    return;

  }


  var name =
    document.getElementById(
      "productName"
    ).value.trim();


  var price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );


  var category =
    document.getElementById(
      "productCategory"
    ).value;


  var image =
    document.getElementById(
      "productImage"
    ).value.trim();


  if(!name || !price){

    alert(
      "Тауар атауы мен бағасын енгізіңіз."
    );

    return;

  }


  if(price <= 0){

    alert(
      "Баға 0-ден үлкен болуы керек."
    );

    return;

  }


  try{

    var storeDoc =
      await db.collection("stores")
        .doc(currentUser.uid)
        .get();


    var sellerName =
      "Дүкен";


    if(storeDoc.exists){

      sellerName =
        storeDoc.data().name ||
        "Дүкен";

    }


    await db.collection("products")
      .add({

        name:
          name,

        price:
          price,

        category:
          category,

        image:
          image,

        sellerId:
          currentUser.uid,

        sellerName:
          sellerName,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    document.getElementById(
      "productName"
    ).value = "";


    document.getElementById(
      "productPrice"
    ).value = "";


    document.getElementById(
      "productImage"
    ).value = "";


    alert(
      "Тауар қосылды! ✅"
    );


    await loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "Тауар қосу кезінде қате болды."
    );

  }

}

/* =========================
   MY ORDERS
========================= */


async function loadMyOrders(){

  if(!currentUser){

    return;

  }


  var result =
    document.getElementById(
      "sellerResult"
    );


  result.innerHTML =
    "Тапсырыстар жүктелуде...";


  try{

    var snapshot =
      await db.collection("orders")
        .where(
          "sellerId",
          "==",
          currentUser.uid
        )
        .get();


    if(snapshot.empty){

      result.innerHTML =
        '<div class="empty">' +
        'Әзірге тапсырыс жоқ.' +
        '</div>';

      return;

    }


    var orders =
      [];


    snapshot.forEach(
      function(doc){

        orders.push({

          id:
            doc.id,

          ...doc.data()

        });

      }
    );


    orders.sort(
      function(a,b){

        var at =
          a.createdAt &&
          a.createdAt.seconds
          ?
          a.createdAt.seconds
          :
          0;


        var bt =
          b.createdAt &&
          b.createdAt.seconds
          ?
          b.createdAt.seconds
          :
          0;


        return bt-at;

      }
    );


    result.innerHTML = `

      <h3>
        🧾 Тапсырыстар
      </h3>

    `;


    orders.forEach(
      function(order){

        var box =
          document.createElement(
            "div"
          );


        box.style.cssText =
          "background:#f5f5f5;padding:12px;border-radius:12px;margin-top:10px";


        var itemsText =
          (order.items || [])
            .map(function(item){

              return safe(item.name) +
                " × " +
                item.qty;

            })
            .join("<br>");


        box.innerHTML = `

          <b>
            👤 ${safe(order.customerName || "")}
          </b>

          <div style="margin-top:5px">
            📞 ${safe(order.customerPhone || "")}
          </div>

          <div style="margin-top:5px">
            📍 ${safe(order.customerAddress || "")}
          </div>

          <div style="margin-top:8px">
            ${itemsText}
          </div>

          <div style="
            font-weight:bold;
            margin-top:8px;
          ">
            ${money(order.total)}
          </div>

          <select
            class="input"
            style="margin-top:8px"
            onchange="changeOrderStatus('${safe(order.id)}',this.value)">

            <option
              ${order.status==="Жаңа тапсырыс" ? "selected" : ""}>
              Жаңа тапсырыс
            </option>

            <option
              ${order.status==="Қабылданды" ? "selected" : ""}>
              Қабылданды
            </option>

            <option
              ${order.status==="Жолда" ? "selected" : ""}>
              Жолда
            </option>

            <option
              ${order.status==="Жеткізілді" ? "selected" : ""}>
              Жеткізілді
            </option>

            <option
              ${order.status==="Бас тартылды" ? "selected" : ""}>
              Бас тартылды
            </option>

          </select>

        `;


        result.appendChild(box);

      }
    );


  }catch(error){

    console.error(error);

    result.innerHTML =
      "Тапсырыстарды жүктеу кезінде қате.";

  }

}
