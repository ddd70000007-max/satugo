<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SatuGo — Қазақстан маркетплейсі</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#222}
button,input,select,textarea{font:inherit}
header{background:#fff;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #0001}
.logo{font-size:25px;font-weight:800}.logo span{color:#ff4d00}
.header-buttons{display:flex;gap:8px}.header-btn{border:0;background:#f1f1f1;padding:9px 12px;border-radius:10px;cursor:pointer}.cart-btn{background:#ff4d00;color:#fff}
.container{max-width:1100px;margin:auto;padding:15px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;outline:0;margin-bottom:15px}
.banner{background:linear-gradient(135deg,#ff4d00,#ff8a00);color:#fff;padding:25px 20px;border-radius:16px;margin-bottom:20px}.banner h1{font-size:28px;margin-bottom:8px}
.seller-banner{background:#111;color:#fff;padding:18px;border-radius:14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.seller-banner button{background:#ff4d00;color:#fff;border:0;padding:11px 15px;border-radius:10px;cursor:pointer}
.section-title{font-size:22px;margin:20px 0 12px}.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}
.category{border:0;background:#fff;padding:11px 15px;border-radius:12px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 5px #0001}.category:hover{background:#ff4d00;color:#fff}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.product{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #0001;cursor:pointer}.product-image{width:100%;height:190px;object-fit:cover;background:#eee}.product-info{padding:12px}.product-name{font-size:16px;font-weight:bold;margin-bottom:7px}.product-category{color:#777;font-size:13px;margin-bottom:8px}.product-price{font-size:18px;font-weight:bold;margin-bottom:8px}.seller-mini{font-size:12px;color:#777;margin-bottom:10px}.add-btn,.main-btn{width:100%;border:0;background:#ff4d00;color:#fff;padding:11px;border-radius:10px;cursor:pointer}.main-btn{padding:13px;font-size:15px;margin-bottom:10px}.gray-btn{width:100%;background:#eee;color:#222;border:0;padding:13px;border-radius:10px;cursor:pointer;font-size:15px;margin-bottom:10px}.danger-btn{background:#e53935;color:#fff}.empty{background:#fff;padding:30px;text-align:center;border-radius:15px;color:#777}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:1000;padding:15px;overflow-y:auto}.modal-box{background:#fff;max-width:650px;margin:25px auto;border-radius:18px;padding:20px;position:relative}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:#eee;width:35px;height:35px;border-radius:50%;cursor:pointer;font-size:20px}
.account-info,.admin-card,.order-card,.review{background:#f7f7f7;padding:15px;border-radius:12px;margin-bottom:12px}.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.remove-btn{border:0;background:#ffe5e5;color:#d00;padding:7px 9px;border-radius:8px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;padding:15px 0}
.detail-image{width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin-bottom:15px}.detail-price{font-size:26px;font-weight:800;margin:10px 0}.stars{color:#f59e0b;letter-spacing:2px}.store-head{background:#111;color:#fff;padding:20px;border-radius:14px;margin-bottom:15px}.store-product{display:flex;gap:12px;align-items:center;background:#f7f7f7;padding:10px;border-radius:12px;margin-bottom:10px}.store-product img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#eee;border-radius:8px;width:30px;height:30px;cursor:pointer}
@media(max-width:800px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.products{grid-template-columns:repeat(2,1fr);gap:10px}.product-image{height:150px}.banner h1{font-size:23px}.seller-banner{flex-direction:column;align-items:flex-start}.seller-banner button{width:100%}.modal-box{margin:10px auto}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
<div class="logo">Satu<span>Go</span></div>
<div class="header-buttons">
<button class="header-btn" onclick="openAccount()">👤 Кіру</button>
<button class="header-btn" onclick="openFavorites()">❤️ <span id="favCount">0</span></button>
<button class="header-btn cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
</div>
</header>

<div class="container">
<input id="searchInput" class="search" placeholder="Тауар немесе дүкен іздеу..." oninput="searchProducts()">

<div class="banner">
<h1>SatuGo</h1>
<p>Қазақстандағы жаңа онлайн маркетплейс</p>
</div>

<div class="seller-banner">
<div>
<h3>Өз тауарыңды сат!</h3>
<p>Дүкен ашып, клиенттерге тауарларыңды ұсын.</p>
</div>
<button onclick="openSeller()">Дүкен ашу</button>
</div>

<h2 class="section-title">Категориялар</h2>

<div class="categories">
<button class="category" onclick="categoryFilter('')">Барлығы</button>
<button class="category" onclick="categoryFilter('Киім')">👕 Киім</button>
<button class="category" onclick="categoryFilter('Аяқ киім')">👟 Аяқ киім</button>
<button class="category" onclick="categoryFilter('Косметика')">💄 Косметика</button>
<button class="category" onclick="categoryFilter('Электрон')">📱 Электроника</button>
</div>

<h2 class="section-title">Тауарлар</h2>
<div id="products" class="products">
<div class="empty">Тауарлар жүктелуде...</div>
</div>
</div>

<div id="accountModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<h2>Аккаунт</h2>
<button class="close" onclick="closeModal('accountModal')">×</button>
</div>
<div id="accountContent"></div>
</div>
</div>

<div id="sellerModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<h2>🏪 Менің дүкенім</h2>
<button class="close" onclick="closeModal('sellerModal')">×</button>
</div>
<div id="sellerContent"></div>
</div>
</div>

<div id="cartModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<h2>🛒 Себет</h2>
<button class="close" onclick="closeModal('cartModal')">×</button>
</div>
<div id="cartItems"></div>
<div class="total">
<span>Барлығы:</span>
<span id="cartTotal">0 ₸</span>
</div>
<input id="customerName" class="input" placeholder="Аты-жөніңіз">
<input id="customerPhone" class="input" placeholder="Телефон нөмірі" type="tel">
<input id="customerAddress" class="input" placeholder="Жеткізу мекенжайы">
<button class="main-btn" onclick="makeOrder()">Тапсырыс беру</button>
</div>
</div>

<div id="productModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<h2>Тауар</h2>
<button class="close" onclick="closeModal('productModal')">×</button>
</div>
<div id="productContent"></div>
</div>
</div>

<div id="storeModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<h2>🏪 Дүкен</h2>
<button class="close" onclick="closeModal('storeModal')">×</button>
</div>
<div id="storeContent"></div>
</div>
</div>

<div id="favoritesModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<h2>❤️ Таңдаулылар</h2>
<button class="close" onclick="closeModal('favoritesModal')">×</button>
</div>
<div id="favoritesContent"></div>
</div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyCj7VBpb0u5YgFqz2Mm8NhvbytX_Fs5tJE",
authDomain:"satugo-c3b7c.firebaseapp.com",
projectId:"satugo-c3b7c",
storageBucket:"satugo-c3b7c.firebasestorage.app",
messagingSenderId:"32133349747",
appId:"1:32133349747:web:8df062f6428b4eb7ed8506",
measurementId:"G-4PF4DV016B"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();

var products=[],cart=[],favorites=JSON.parse(localStorage.getItem("satugoFavorites")||"[]"),currentUser=null,currentProfile=null;

var demoProducts=[
{id:"demo1",name:"Nike Air Max",price:39990,category:"Аяқ киім",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80",sellerId:"",sellerName:"SatuGo"},
{id:"demo2",name:"Oversize Hoodie",price:12990,category:"Киім",image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=700&q=80",sellerId:"",sellerName:"SatuGo"},
{id:"demo3",name:"Әйелдер көйлегі",price:19990,category:"Киім",image:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=700&q=80",sellerId:"",sellerName:"SatuGo"},
{id:"demo4",name:"Ақ кроссовка",price:29990,category:"Аяқ киім",image:"https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=700&q=80",sellerId:"",sellerName:"SatuGo"}
];

function safe(x){return String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function money(x){return Number(x||0).toLocaleString("ru-RU")+" ₸"}
function closeModal(id){document.getElementById(id).style.display="none"}
function findProduct(id){return products.find(p=>p.id===id)}
function updateCounts(){document.getElementById("cartCount").textContent=cart.length;document.getElementById("favCount").textContent=favorites.length}

async function loadProducts(){
try{
let s=await db.collection("products").get();
products=demoProducts.slice();
s.forEach(d=>{
let x=d.data();
products.push({
id:d.id,
name:x.name||"",
price:Number(x.price)||0,
category:x.category||"",
image:x.image||"",
sellerId:x.sellerId||"",
sellerName:x.sellerName||"Дүкен"
});
});
}catch(e){
console.error(e);
products=demoProducts.slice();
}
showProducts()
}

function showProducts(list){
let data=list||products,c=document.getElementById("products");
if(!data.length){
c.innerHTML='<div class="empty">Тауар табылмады.</div>';
return
}

c.innerHTML=data.map(p=>`<div class="product" onclick="openProduct('${safe(p.id)}')">
<img class="product-image" src="${safe(p.image)}" onerror="this.src='https://via.placeholder.com/700x500?text=SatuGo'">
<div class="product-info">
<div class="product-name">${safe(p.name)}</div>
<div class="product-category">${safe(p.category)}</div>
<div class="product-price">${money(p.price)}</div>
<div class="seller-mini">🏪 ${safe(p.sellerName)}</div>
<button class="add-btn" onclick="event.stopPropagation();addCart('${safe(p.id)}')">🛒 Себетке қосу</button>
</div>
</div>`).join("")
}

function searchProducts(){
let q=document.getElementById("searchInput").value.toLowerCase().trim();
showProducts(!q?products:products.filter(p=>`${p.name} ${p.category} ${p.sellerName}`.toLowerCase().includes(q)))
}

function categoryFilter(cat){
showProducts(cat?products.filter(p=>p.category===cat):products)
}

function addCart(id){
let p=findProduct(id);
if(!p)return alert("Тауар табылмады.");
cart.push({...p});
updateCounts();
alert("Тауар себетке қосылды ✅")
}

function removeCart(i){
cart.splice(i,1);
updateCounts();
showCart()
}

function changeQty(i,d){
if(d>0)cart.push({...cart[i]});
else removeCart(i);
showCart()
}

function openCart(){
document.getElementById("cartModal").style.display="block";
showCart()
}

function showCart(){
let b=document.getElementById("cartItems");
if(!cart.length){
b.innerHTML='<div class="empty">Себет бос.</div>';
document.getElementById("cartTotal").textContent="0 ₸";
return
}
let total=cart.reduce((s,x)=>s+Number(x.price||0),0);
b.innerHTML=cart.map((x,i)=>`<div class="cart-item">
<div>
<b>${safe(x.name)}</b>
<div>${money(x.price)}</div>
<div class="qty">
<button onclick="changeQty(${i},-1)">−</button>
<span>1</span>
<button onclick="changeQty(${i},1)">+</button>
</div>
</div>
<button class="remove-btn" onclick="removeCart(${i})">Өшіру</button>
</div>`).join("");
document.getElementById("cartTotal").textContent=money(total)
}

async function makeOrder(){
if(!currentUser){
alert("Алдымен аккаунтқа кіріңіз.");
openAccount();
return
}
if(!cart.length)return alert("Себет бос.");

let name=document.getElementById("customerName").value.trim();
let phone=document.getElementById("customerPhone").value.trim();
let address=document.getElementById("customerAddress").value.trim();

if(!name||!phone||!address)return alert("Барлық мәліметті толтырыңыз.");

let grouped={};
cart.forEach(x=>(grouped[x.sellerId||"satugo"]??=[]).push(x));

try{
for(let sellerId in grouped){
let items=grouped[sellerId];

await db.collection("orders").add({
customerId:currentUser.uid,
customerName:name,
customerPhone:phone,
customerAddress:address,
sellerId,
items,
total:items.reduce((s,x)=>s+Number(x.price||0),0),
status:"Жаңа",
createdAt:firebase.firestore.FieldValue.serverTimestamp()
})
}

cart=[];
updateCounts();
showCart();

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
document.getElementById("customerAddress").value="";

alert("Тапсырыс сәтті қабылданды! ✅")
}catch(e){
console.error(e);
alert("Тапсырыс жіберу кезінде қате болды.")
}
}
  async function openProduct(id){
let p=findProduct(id);
if(!p)return;

let reviews=[];

try{
let s=await db.collection("reviews")
.where("productId","==",id)
.get();

s.forEach(d=>reviews.push(d.data()));
}catch(e){
console.error(e);
}

let avg=reviews.length
?reviews.reduce((s,r)=>s+Number(r.rating||0),0)/reviews.length
:0;

document.getElementById("productContent").innerHTML=`
<img class="detail-image"
src="${safe(p.image)}"
onerror="this.src='https://via.placeholder.com/700x500?text=SatuGo'">

<h2>${safe(p.name)}</h2>

<div class="detail-price">${money(p.price)}</div>

<p>📂 ${safe(p.category)}</p>

<p>
🏪
<a href="#"
onclick="event.preventDefault();openStore('${safe(p.sellerId)}')">
${safe(p.sellerName)}
</a>
</p>

<p class="stars">
${avg
?("★".repeat(Math.round(avg))+"☆".repeat(5-Math.round(avg)))
:"☆☆☆☆☆"}
${reviews.length?avg.toFixed(1):"Жаңа"}
(${reviews.length})
</p>

<button class="main-btn"
onclick="addCart('${safe(p.id)}')">
🛒 Себетке қосу
</button>

<hr style="margin:15px 0;border:0;border-top:1px solid #eee">

<h3>⭐ Пікір қалдыру</h3>

<select id="reviewRating" class="input">
<option value="5">5 ⭐</option>
<option value="4">4 ⭐</option>
<option value="3">3 ⭐</option>
<option value="2">2 ⭐</option>
<option value="1">1 ⭐</option>
</select>

<textarea id="reviewText"
class="input"
placeholder="Пікіріңіз..."
rows="3"></textarea>

<button class="main-btn"
onclick="addReview('${safe(p.id)}')">
Пікір жариялау
</button>

<div id="reviewList">
${
reviews.map(r=>`
<div class="review">
<b>${safe(r.userName||"Пайдаланушы")}</b>
<div class="stars">
${"★".repeat(Number(r.rating||0))}
</div>
<p>${safe(r.text||"")}</p>
</div>
`).join("")
||
"<div class='empty'>Әзірге пікір жоқ.</div>"
}
</div>
`;

document.getElementById("productModal").style.display="block";
}

async function addReview(productId){

if(!currentUser){
alert("Пікір қалдыру үшін аккаунтқа кіріңіз.");
openAccount();
return;
}

let text=document.getElementById("reviewText").value.trim();
let rating=Number(document.getElementById("reviewRating").value);

if(!text){
return alert("Пікір жазыңыз.");
}

try{

await db.collection("reviews").add({
productId:productId,
userId:currentUser.uid,
userName:(currentProfile&&currentProfile.name)
||currentUser.email
||"Пайдаланушы",
rating:rating,
text:text,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});

alert("Пікір қосылды! ⭐");

openProduct(productId);

}catch(e){

console.error(e);
alert("Пікір қосылмады.");

}
}

async function openStore(sellerId){

if(!sellerId){
return alert("Бұл — SatuGo демо дүкені.");
}

let name="Дүкен";
let arr=[];

try{

let d=await db.collection("stores")
.doc(sellerId)
.get();

if(d.exists){
name=d.data().name||name;
}

let s=await db.collection("products")
.where("sellerId","==",sellerId)
.get();

s.forEach(d=>{
let x=d.data();

arr.push({
id:d.id,
...x
});

});

}catch(e){
console.error(e);
}

document.getElementById("storeContent").innerHTML=`

<div class="store-head">
<h2>🏪 ${safe(name)}</h2>
<p>Сатушы дүкені</p>
</div>

${
arr.length
?
arr.map(p=>`
<div class="store-product"
onclick="closeModal('storeModal');openProduct('${safe(p.id)}')">

<img
src="${safe(p.image)}"
onerror="this.src='https://via.placeholder.com/100?text=SatuGo'">

<div>
<b>${safe(p.name)}</b>
<p>${money(p.price)}</p>
</div>

</div>
`).join("")
:
"<div class='empty'>Бұл дүкенде әзірге тауар жоқ.</div>"
}

`;

document.getElementById("storeModal").style.display="block";
}

function toggleFavorite(id){

if(favorites.includes(id)){
favorites=favorites.filter(x=>x!==id);
}else{
favorites.push(id);
}

localStorage.setItem(
"satugoFavorites",
JSON.stringify(favorites)
);

updateCounts();
showFavorites();
}

function openFavorites(){

document.getElementById("favoritesModal").style.display="block";

showFavorites();

}

function showFavorites(){

let a=products.filter(
p=>favorites.includes(p.id)
);

document.getElementById("favoritesContent").innerHTML=

a.length

?

a.map(p=>`
<div class="store-product">

<img
src="${safe(p.image)}"
onerror="this.src='https://via.placeholder.com/100?text=SatuGo'">

<div style="flex:1">

<b>${safe(p.name)}</b>

<p>${money(p.price)}</p>

<button class="main-btn"
onclick="openProduct('${safe(p.id)}')">
Ашу
</button>

</div>

</div>
`).join("")

:

"<div class='empty'>Таңдаулылар бос.</div>";

}

function openAccount(){

document.getElementById("accountModal").style.display="block";

showAccount();

}

function showAccount(){

let b=document.getElementById("accountContent");

if(currentUser){

b.innerHTML=`

<div class="account-info">

<h3>
👤
${safe(
(currentProfile&&currentProfile.name)
||"Пайдаланушы"
)}
</h3>

<p>${safe(currentUser.email)}</p>

</div>

<button class="main-btn"
onclick="closeModal('accountModal');openSeller()">
🏪 Менің дүкенім
</button>

<button class="gray-btn"
onclick="logout()">
Шығу
</button>

`;

return;

}

b.innerHTML=`

<div class="tabs">

<button id="loginTab"
class="tab active"
onclick="showLoginForm()">
Кіру
</button>

<button id="registerTab"
class="tab"
onclick="showRegisterForm()">
Тіркелу
</button>

</div>

<div id="authForm"></div>
`;

showLoginForm();

}

function showLoginForm(){

document.getElementById("loginTab")
.classList.add("active");

document.getElementById("registerTab")
.classList.remove("active");

document.getElementById("authForm").innerHTML=`

<input
id="loginEmail"
class="input"
type="email"
placeholder="Email">

<input
id="loginPassword"
class="input"
type="password"
placeholder="Құпия сөз">

<button class="main-btn"
onclick="loginUser()">
Кіру
</button>

`;

}

function showRegisterForm(){

document.getElementById("registerTab")
.classList.add("active");

document.getElementById("loginTab")
.classList.remove("active");

document.getElementById("authForm").innerHTML=`

<input
id="registerName"
class="input"
placeholder="Аты-жөніңіз">

<input
id="registerEmail"
class="input"
type="email"
placeholder="Email">

<input
id="registerPassword"
class="input"
type="password"
placeholder="Құпия сөз (кемінде 6 таңба)">

<button class="main-btn"
onclick="registerUser()">
Тіркелу
</button>

`;

}

function translateFirebaseError(e){

let c=e&&e.code||"";

if(c==="auth/email-already-in-use")
return "❌ Бұл Email бұрын тіркелген.";

if(c==="auth/invalid-email")
return "❌ Email дұрыс емес.";

if(c==="auth/weak-password")
return "❌ Құпия сөз тым әлсіз.";

if(c==="auth/invalid-credential")
return "❌ Email немесе құпия сөз қате.";

return "❌ Қате орын алды. Қайта көріңіз.";

}

async function registerUser(){

let n=document.getElementById("registerName")
.value.trim();

let e=document.getElementById("registerEmail")
.value.trim();

let p=document.getElementById("registerPassword")
.value;

if(!n||!e||!p)
return alert("Барлық жолды толтырыңыз.");

if(p.length<6)
return alert(
"Құпия сөз кемінде 6 таңбадан тұруы керек."
);

try{

let r=await auth
.createUserWithEmailAndPassword(e,p);

await db.collection("users")
.doc(r.user.uid)
.set({
name:n,
email:e,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()
});

alert("Аккаунт сәтті құрылды! ✅");

showAccount();

}catch(x){

console.error(x);

alert(translateFirebaseError(x));

}

}

async function loginUser(){

let e=document.getElementById("loginEmail")
.value.trim();

let p=document.getElementById("loginPassword")
.value;

if(!e||!p)
return alert(
"Email және құпия сөзді енгізіңіз."
);

try{

await auth.signInWithEmailAndPassword(e,p);

alert("Сәтті кірдіңіз! ✅");

closeModal("accountModal");

}catch(x){

console.error(x);

alert(translateFirebaseError(x));

}

}

async function logout(){

await auth.signOut();

currentUser=null;
currentProfile=null;

closeModal("accountModal");

updateAccountButton();

alert("Аккаунттан шықтыңыз.");

}

async function loadProfile(){

if(!currentUser)return;

try{

let d=await db.collection("users")
.doc(currentUser.uid)
.get();

currentProfile=d.exists
?d.data()
:null;

}catch(e){

currentProfile=null;

}

}

function updateAccountButton(){

document.querySelector(".header-btn").innerHTML=
currentUser
?"👤 Аккаунт"
:"👤 Кіру";

}

async function openSeller(){

if(!currentUser){

alert(
"Дүкен ашу үшін алдымен аккаунтқа кіріңіз."
);

openAccount();

return;

}

document.getElementById("sellerModal")
.style.display="block";

loadStoreAdmin();

}

async function loadStoreAdmin(){

let b=document.getElementById("sellerContent");

let storeName="";

try{

let d=await db.collection("stores")
.doc(currentUser.uid)
.get();

if(d.exists){
storeName=d.data().name||"";
}

}catch(e){}

b.innerHTML=`

<h3>Дүкен</h3>

<input
id="storeName"
class="input"
placeholder="Дүкен атауы"
value="${safe(storeName)}">

<button class="main-btn"
onclick="saveStore()">
Дүкенді сақтау
</button>

<hr
style="margin:15px 0;border:0;border-top:1px solid #eee">

<h3>➕ Жаңа тауар</h3>

<input
id="productName"
class="input"
placeholder="Тауар атауы">

<input
id="productPrice"
class="input"
type="number"
placeholder="Бағасы, ₸">

<select
id="productCategory"
class="input">

<option>Киім</option>
<option>Аяқ киім</option>
<option>Косметика</option>
<option>Электрон</option>

</select>

<input
id="productImage"
class="input"
placeholder="Сурет URL">

<textarea
id="productDesc"
class="input"
placeholder="Тауар сипаттамасы"
rows="3"></textarea>

<button class="main-btn"
onclick="saveProduct()">
Тауарды қосу
</button>

<button class="gray-btn"
onclick="showMyProducts()">
📦 Менің тауарларым
</button>

<button class="gray-btn"
onclick="showMyOrders()">
🧾 Менің тапсырыстарым
</button>

<div id="sellerExtra"></div>

`;

}

async function saveStore(){

let n=document.getElementById("storeName")
.value.trim();

if(!n)
return alert("Дүкен атауын енгізіңіз.");

try{

await db.collection("stores")
.doc(currentUser.uid)
.set({

name:n,
ownerId:currentUser.uid,
updatedAt:
firebase.firestore.FieldValue.serverTimestamp()

});

alert("Дүкен сақталды! ✅");

}catch(e){

console.error(e);

alert(
"Дүкенді сақтау кезінде қате болды."
);

}

}

async function saveProduct(){

let n=document.getElementById("productName")
.value.trim();

let p=Number(
document.getElementById("productPrice").value
);

let c=document.getElementById("productCategory")
.value;

let img=document.getElementById("productImage")
.value.trim();

let desc=document.getElementById("productDesc")
.value.trim();

if(!n||!p||p<=0)
return alert(
"Тауар атауы мен дұрыс бағаны енгізіңіз."
);

try{

let d=await db.collection("stores")
.doc(currentUser.uid)
.get();

let sn=d.exists
?d.data().name||"Дүкен"
:"Дүкен";

await db.collection("products").add({

name:n,
price:p,
category:c,
image:img,
description:desc,
sellerId:currentUser.uid,
sellerName:sn,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productImage").value="";
document.getElementById("productDesc").value="";

alert("Тауар қосылды! ✅");

await loadProducts();

}catch(e){

console.error(e);

alert(
"Тауар қосу кезінде қате болды."
);

}

}
  async function showMyProducts(){

let e=document.getElementById("sellerExtra");

e.innerHTML=
"<div class='empty'>Жүктелуде...</div>";

try{

let s=await db.collection("products")
.where("sellerId","==",currentUser.uid)
.get();

if(s.empty){

e.innerHTML=
"<div class='empty'>Әзірге тауар жоқ.</div>";

return;
}

e.innerHTML=
"<h3 style='margin:15px 0'>📦 Менің тауарларым</h3>"+

s.docs.map(d=>{

let p=d.data();

return `
<div class="admin-card">

<b>${safe(p.name)}</b>

<p>
${money(p.price)}
 ·
${safe(p.category)}
</p>

<button
class="remove-btn"
onclick="deleteProduct('${d.id}')">

🗑 Өшіру

</button>

</div>
`;

}).join("");

}catch(x){

console.error(x);

e.innerHTML=
"<div class='empty'>Тауарларды жүктеу мүмкін болмады.</div>";

}

}


async function deleteProduct(id){

if(!confirm(
"Бұл тауарды өшіруге сенімдісіз бе?"
))return;

try{

await db.collection("products")
.doc(id)
.delete();

await loadProducts();

await showMyProducts();

alert("Тауар өшірілді.");

}catch(e){

console.error(e);

alert(
"Тауарды өшіру кезінде қате болды."
);

}

}


async function showMyOrders(){

let e=document.getElementById("sellerExtra");

e.innerHTML=
"<div class='empty'>Тапсырыстар жүктелуде...</div>";

try{

let s=await db.collection("orders")
.where("sellerId","==",currentUser.uid)
.get();

if(s.empty){

e.innerHTML=
"<div class='empty'>Әзірге тапсырыс жоқ.</div>";

return;

}

e.innerHTML=
"<h3 style='margin:15px 0'>🧾 Менің тапсырыстарым</h3>"+

s.docs.map(d=>{

let o=d.data();

return `
<div class="order-card">

<b>
👤 ${safe(o.customerName)}
</b>

<p>
📞 ${safe(o.customerPhone)}
</p>

<p>
📍 ${safe(o.customerAddress)}
</p>

<p>
${
(o.items||[])
.map(x=>safe(x.name))
.join(", ")
}
</p>

<b>
${money(o.total)}
</b>

<p>
Статус:
<b>
${safe(o.status||"Жаңа")}
</b>
</p>

<button
class="main-btn"
onclick="updateOrderStatus('${d.id}','Қабылданды')">

Қабылдау

</button>

<button
class="gray-btn"
onclick="updateOrderStatus('${d.id}','Жолда')">

Жолда

</button>

<button
class="gray-btn"
onclick="updateOrderStatus('${d.id}','Жеткізілді')">

Жеткізілді

</button>

</div>
`;

}).join("");

}catch(x){

console.error(x);

e.innerHTML=
"<div class='empty'>Тапсырыстарды жүктеу кезінде қате болды.</div>";

}

}


async function updateOrderStatus(id,status){

try{

await db.collection("orders")
.doc(id)
.update({

status:status,

updatedAt:
firebase.firestore.FieldValue.serverTimestamp()

});

alert(
"Статус өзгертілді: "+status
);

showMyOrders();

}catch(e){

console.error(e);

alert(
"Статусты өзгерту кезінде қате болды."
);

}

}


auth.onAuthStateChanged(async u=>{

currentUser=u;

if(u){

await loadProfile();

}else{

currentProfile=null;

}

updateAccountButton();

});


window.addEventListener("load",()=>{

loadProducts();

updateCounts();

});


window.addEventListener("click",e=>{

[
"accountModal",
"sellerModal",
"cartModal",
"productModal",
"storeModal",
"favoritesModal"
].forEach(id=>{

let x=document.getElementById(id);

if(e.target===x){

closeModal(id);

}

});

});

</script>

</body>
</html>
